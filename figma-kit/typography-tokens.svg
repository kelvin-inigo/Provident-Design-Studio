<svg width="1560" height="1495" viewBox="0 0 1560 1495" xmlns="http://www.w3.org/2000/svg"><rect width="1560" height="1495" fill="#FFFFFF"></rect><text x="60" y="110" font-family="Google Sans Flex" font-size="26" font-weight="500" fill="#1A2942">Provident typography — bound to placement/type-* and brand-core/font</text><text x="60" y="144" font-family="Google Sans Flex" font-size="20" font-weight="300" fill="#6B7280">Rendered at 1:1 mode sizes. Each row is named with its variable path; bind the text style to the token and the 9:16 value applies on mode switch.</text><text x="60" y="230" font-family="Google Sans Flex" font-size="20" font-weight="500" fill="#B0905C" letter-spacing="3">PLACEMENT/TYPE-HERO · FONT/WEIGHT-HERO 100</text><text x="1500" y="230" font-family="Google Sans Flex" font-size="20" font-weight="300" fill="#6B7280" text-anchor="end">1:1 → 85   ·   9:16 → 103</text><text x="60" y="258" font-family="Google Sans Flex" font-size="18" font-weight="300" fill="#6B7280">serif word = brand-core/font/serif-accent · always gold</text><text x="60" y="355" font-family="Google Sans Flex" font-size="85" font-weight="100" fill="#1A2942">Waterfront living, <tspan fill="#C9A96A" font-family="Source Serif 4">measured</tspan> returns</text><line x1="60" y1="430" x2="1500" y2="430" stroke="#ECE7DF"></line><text x="60" y="500" font-family="Google Sans Flex" font-size="20" font-weight="500" fill="#B0905C" letter-spacing="3">PLACEMENT/TYPE-HEADLINE · FONT/WEIGHT-LIGHT 300</text><text x="1500" y="500" font-family="Google Sans Flex" font-size="20" font-weight="300" fill="#6B7280" text-anchor="end">1:1 → 59   ·   9:16 → 71</text><text x="60" y="580" font-family="Google Sans Flex" font-size="59" font-weight="300" fill="#1A2942">Invest in Dubai commercial real estate</text><line x1="60" y1="650" x2="1500" y2="650" stroke="#ECE7DF"></line><text x="60" y="720" font-family="Google Sans Flex" font-size="20" font-weight="500" fill="#B0905C" letter-spacing="3">PLACEMENT/TYPE-HOOK · FONT/WEIGHT-LIGHT 300</text><text x="1500" y="720" font-family="Google Sans Flex" font-size="20" font-weight="300" fill="#6B7280" text-anchor="end">1:1 → 35   ·   9:16 → 41</text><text x="60" y="778" font-family="Google Sans Flex" font-size="35" font-weight="300" fill="#1A2942">1–3 BR residences from AED 1.9M</text><line x1="60" y1="840" x2="1500" y2="840" stroke="#ECE7DF"></line><text x="60" y="910" font-family="Google Sans Flex" font-size="20" font-weight="500" fill="#B0905C" letter-spacing="3">PLACEMENT/TYPE-BODY · FONT/WEIGHT-LIGHT 300</text><text x="1500" y="910" font-family="Google Sans Flex" font-size="20" font-weight="300" fill="#6B7280" text-anchor="end">1:1 → 28   ·   9:16 → 28</text><text x="60" y="938" font-family="Google Sans Flex" font-size="18" font-weight="300" fill="#6B7280">constant across modes</text><text x="60" y="982" font-family="Google Sans Flex" font-size="28" font-weight="300" fill="#1A2942">Strong rental demand and rising yields across prime districts.</text><line x1="60" y1="1040" x2="1500" y2="1040" stroke="#ECE7DF"></line><text x="60" y="1110" font-family="Google Sans Flex" font-size="20" font-weight="500" fill="#B0905C" letter-spacing="3">PLACEMENT/TYPE-EYEBROW · FONT/WEIGHT-MEDIUM 500</text><text x="1500" y="1110" font-family="Google Sans Flex" font-size="20" font-weight="300" fill="#6B7280" text-anchor="end">1:1 → 24   ·   9:16 → 28</text><text x="60" y="1138" font-family="Google Sans Flex" font-size="18" font-weight="300" fill="#6B7280">tracked caps +16%</text><text x="60" y="1176" font-family="Google Sans Flex" font-size="24" font-weight="500" fill="#B0905C" letter-spacing="3.8">NEW LAUNCH · BUSINESS BAY</text><line x1="60" y1="1235" x2="1500" y2="1235" stroke="#ECE7DF"></line><text x="60" y="1305" font-family="Google Sans Flex" font-size="20" font-weight="500" fill="#B0905C" letter-spacing="3">PLACEMENT/SIZE-LOGO · FONT/WEIGHT-LIGHT 300</text><text x="1500" y="1305" font-family="Google Sans Flex" font-size="20" font-weight="300" fill="#6B7280" text-anchor="end">1:1 → 41   ·   9:16 → 50</text><text x="60" y="1333" font-family="Google Sans Flex" font-size="18" font-weight="300" fill="#6B7280">wordmark · +4% tracking</text><text x="60" y="1391" font-family="Google Sans Flex" font-size="41" font-weight="300" fill="#1A2942" letter-spacing="1.6">provident.</text></svg>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDS sandbox</title>
<!-- SANDBOX (branch home/streamline): a proposed, simpler home and hand-off, on dummy data.
     It loads no studio code, no Drive, no sign-in and no share store; it only links the chrome
     kit and the template renders in preview/. State is localStorage 'pds-sandbox-v1'. -->
<script>try{ if (localStorage.getItem('provident-theme') !== 'dark') document.documentElement.setAttribute('data-theme','light'); }catch(e){}</script>
<link rel="stylesheet" href="../ui-design-system/provident-ui.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--ps-app); color:var(--ps-ink); font-family:var(--ps-font); font-size:14px; line-height:1.45; font-weight:400}
[hidden]{display:none !important}
a{color:inherit; text-decoration:none}
button,select,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0}
h1,h2,h3,p,ul{margin:0; padding:0} ul{list-style:none}
:focus-visible{outline:2px solid var(--ps-ink); outline-offset:2px}
svg.i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* the sandbox strip: says what this is, and lets one person play every role */
.sbx{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 24px; background:var(--ps-fill); border-bottom:1px solid var(--ps-hair); font-size:13px; color:var(--ps-ink-2)}
.sbx b{color:var(--ps-ink); font-weight:500}
.sbx select{height:30px; padding:0 10px; border-radius:var(--ps-r-sm); border:1px solid var(--ps-line); background:var(--ps-card); color:var(--ps-ink)}
.sbx .sp{flex:1}
.lk{background:none; padding:0; color:var(--ps-ink); text-decoration:underline; text-underline-offset:3px; font-size:13px}

/* the bar: two places and New */
.top{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; height:55px; padding:0 24px; background:var(--ps-app); border-bottom:1px solid var(--ps-hair)}
.nav{display:flex; gap:2px; padding:4px; border-radius:var(--ps-pill); background:var(--ps-fill)}
.nav a{display:inline-flex; align-items:center; gap:8px; height:28px; padding:0 16px; border-radius:var(--ps-pill); color:var(--ps-ink-2); font-size:14px; font-weight:500; white-space:nowrap}
.nav a:hover{background:var(--ps-fill-h); color:var(--ps-ink)}
.nav a[aria-current="page"]{background:var(--ps-fill-on); color:var(--ps-accent-i)}
.nav s{text-decoration:none; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--ps-ink); color:var(--ps-app); font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box}
.sp{flex:1}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; padding:0 18px; border-radius:var(--ps-pill); background:var(--ps-accent-h); color:var(--ps-primary-i); font-size:14px; font-weight:600; letter-spacing:.16px; white-space:nowrap; box-sizing:border-box}
.btn:hover{background:var(--ps-accent-h2)}
.btn[disabled]{background:var(--ps-fill-dis); color:var(--ps-dim); cursor:default}
.gh{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; padding:0 16px; border-radius:var(--ps-pill); background:var(--ps-fill); color:var(--ps-ink); font-size:14px; font-weight:600; white-space:nowrap; box-sizing:border-box}
.gh:hover{background:var(--ps-fill-h)}
.gh.sm,.btn.sm{height:30px; padding:0 12px; font-size:13px}
.av{width:26px; height:26px; border-radius:50%; background:var(--ps-fill-on); color:var(--ps-accent-i); font-size:10.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; flex:none; letter-spacing:.2px}
.av.lg{width:32px; height:32px; font-size:12px}
.me{position:relative}
.me summary{list-style:none; display:flex; align-items:center; gap:8px; cursor:pointer; height:36px; padding:0 10px 0 4px; border-radius:var(--ps-pill); background:var(--ps-fill); font-weight:500}
.me summary::-webkit-details-marker{display:none}
.me-m{position:absolute; right:0; top:44px; width:250px; padding:8px; border-radius:var(--ps-r); background:var(--ps-card); box-shadow:0 0 0 1px var(--ps-line); z-index:30}
.me-m p{padding:6px 10px; font-size:12px; color:var(--ps-ink-2)}
.me-m span{display:flex; justify-content:space-between; padding:8px 10px; border-radius:var(--ps-r-sm); font-size:14px}
.me-m span small{color:var(--ps-ink-2); font-size:12px}

main{flex:1; width:100%; max-width:1040px; margin:0 auto; padding:36px 24px 80px; box-sizing:border-box}
main.wide{max-width:1240px}
h1{font-size:34px; line-height:1.15; font-weight:400; letter-spacing:-.4px}
.lede{margin-top:6px; font-size:16px; color:var(--ps-ink-2)}
.h2{display:flex; align-items:baseline; gap:10px; margin:40px 0 12px; font-size:13px; font-weight:500; letter-spacing:.5px; text-transform:uppercase; color:var(--ps-ink-2)}
.h2 s{text-decoration:none; color:var(--ps-ink)}
.card{background:var(--ps-card); border-radius:var(--ps-r); box-shadow:0 0 0 1px var(--ps-hair)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ps-dim); flex:none; display:inline-block}
.dot[data-s="design"],.dot[data-s="todo"],.dot[data-s="draft"]{background:var(--ps-link)}
.dot[data-s="review"]{background:var(--ps-warn)}
.dot[data-s="ready"]{background:var(--ps-good)}
.dot[data-s="locked"]{background:transparent; box-shadow:inset 0 0 0 1.5px var(--ps-dim)}
.late{color:var(--ps-bad); font-weight:500}
.th{display:block; flex:none; border-radius:var(--ps-r-sm); background:var(--ps-fill); overflow:hidden; box-shadow:0 0 0 1px var(--ps-hair)}
.th img{display:block; width:100%; height:100%; object-fit:cover}

/* MY WORK: one list, one button a row */
.wk{display:grid; grid-template-columns:88px 1fr auto; gap:20px; align-items:center; padding:18px 20px; margin-top:12px}
.wk .th{width:88px; height:88px}
.wk[data-k="ops"] .th{width:66px; height:88px; margin:0 11px}
.wk-k{display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--ps-ink-2)}
.wk h3{margin:2px 0 2px; font-size:19px; font-weight:400; letter-spacing:-.1px}
.wk h3 a:hover{text-decoration:underline; text-underline-offset:3px}
.wk-why{font-size:14px; color:var(--ps-ink)}
.wk-ps{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:var(--ps-r-sm); background:var(--ps-fill); font-size:12.5px; color:var(--ps-ink)}
.q{margin-top:10px; padding:8px 12px; border-left:2px solid var(--ps-warn); background:var(--ps-warn-q); border-radius:0 var(--ps-r-sm) var(--ps-r-sm) 0; font-size:13.5px}
.q b{font-weight:500}
.clear{padding:44px 24px; text-align:center; margin-top:12px}
.clear h3{font-size:22px; font-weight:400} .clear p{color:var(--ps-ink-2); margin-top:4px}
.out{margin-top:8px}
.out li a{display:grid; grid-template-columns:1fr auto auto; gap:16px; align-items:center; padding:12px 20px; border-top:1px solid var(--ps-hair)}
.out li:first-child a{border-top:0}
.out li a:hover{background:var(--ps-card-h)}
.out b{font-weight:500} .out small{display:block; color:var(--ps-ink-2); font-size:13px}
.who{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ps-ink-2)}

/* the five-step line, the same for a campaign and a post */
.ln{display:flex; gap:3px; width:120px} .ln i{flex:1; height:4px; border-radius:2px; background:var(--ps-fill-h)}
.ln i[data-s="done"]{background:var(--ps-ink-2)} .ln i[data-s="cur"]{background:var(--ps-link)}
.ln[data-end] i{background:var(--ps-good)}

/* ALL WORK */
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:24px 0 14px}
.seg{display:flex; gap:2px; padding:3px; border-radius:var(--ps-pill); background:var(--ps-fill)}
.seg button{height:28px; padding:0 14px; border-radius:var(--ps-pill); background:none; font-size:13px; font-weight:500; color:var(--ps-ink-2)}
.seg button[aria-pressed="true"]{background:var(--ps-fill-on); color:var(--ps-accent-i)}
.fld{height:36px; padding:0 14px; border-radius:var(--ps-r-sm); border:1px solid var(--ps-line); background:var(--ps-card); box-sizing:border-box; min-width:0}
textarea.fld{height:auto; padding:10px 14px; resize:vertical; width:100%; line-height:1.45}
.ck{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ps-ink); cursor:pointer}
.ck input{width:16px; height:16px; accent-color:var(--ps-accent-h); margin:0}
.tb a{display:grid; grid-template-columns:44px minmax(0,2.2fr) 170px minmax(0,1.3fr) 80px 140px; gap:16px; align-items:center; padding:12px 20px; border-top:1px solid var(--ps-hair)}
.tb li:first-child a{border-top:0} .tb a:hover{background:var(--ps-card-h)}
.tb .th{width:44px; height:44px} .tb [data-k="ops"] .th{width:33px; height:44px; margin:0 5px}
.tb b{font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .tb small{color:var(--ps-ink-2); font-size:12.5px}
.tb .st{font-size:13px} .tb .st .ln{margin-bottom:5px}
.tb-h{display:grid; grid-template-columns:44px minmax(0,2.2fr) 170px minmax(0,1.3fr) 80px 140px; gap:16px; padding:0 20px 8px; font-size:12px; color:var(--ps-ink-2); letter-spacing:.4px; text-transform:uppercase; font-weight:500}
.mine{box-shadow:inset 3px 0 0 var(--ps-link)}

/* THE JOB PAGE */
.bk{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ps-ink-2); margin-bottom:18px}
.bk:hover{color:var(--ps-ink)}
.jh{display:grid; grid-template-columns:auto 1fr auto; gap:22px; align-items:center}
.jh .th{width:104px; height:104px} .jh[data-k="ops"] .th{width:84px; height:112px}
.jh h1{font-size:30px}
.jh-m{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin-top:8px; font-size:13.5px; color:var(--ps-ink-2)}
.now{display:flex; align-items:center; gap:18px; padding:16px 20px; margin-top:24px}
.now .ln{width:300px} .now .ln i{height:6px; border-radius:3px}
.now-s{display:flex; gap:0; width:300px; justify-content:space-between; font-size:11px; color:var(--ps-ink-2); margin-top:5px}
.now-s b{color:var(--ps-ink); font-weight:500}
.now p{flex:1; font-size:15px} .now p small{display:block; font-size:13px; color:var(--ps-ink-2)}
.brief{margin-top:16px; padding:16px 20px; font-size:14.5px; max-width:none} .brief small{display:block; font-size:12px; color:var(--ps-ink-2); margin-bottom:4px; letter-spacing:.4px; text-transform:uppercase; font-weight:500}
.gr{margin-top:8px; overflow:hidden}
.gr-r{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.4fr); border-top:1px solid var(--ps-hair)}
.gr-r:first-child{border-top:0}
.gr-r > *{padding:14px 20px; min-width:0}
.gr-r > * + *{border-left:1px solid var(--ps-hair)}
.gr-h > *{padding:10px 20px; font-size:12px; color:var(--ps-ink-2); letter-spacing:.4px; text-transform:uppercase; font-weight:500}
.gr-a b{font-weight:500; font-size:15px; display:block} .gr-a small{color:var(--ps-ink-2); font-size:12.5px}
.cell{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.cell .w{flex:1; min-width:120px} .cell .w b{font-weight:500; display:flex; align-items:center; gap:8px} .cell .w small{display:block; color:var(--ps-ink-2); font-size:12.5px; margin-left:16px}
.cell[data-s="locked"] .w b,.cell[data-s="none"]{color:var(--ps-ink-2); font-weight:400}
.cell[data-mine]{background:var(--ps-tint-1)}
details.fold{margin-top:12px} details.fold > summary{list-style:none; cursor:pointer; padding:14px 20px; display:flex; align-items:center; gap:10px; font-weight:500}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary svg{transition:transform .15s} details.fold[open] > summary svg{transform:rotate(90deg)}
details.fold > summary small{color:var(--ps-ink-2); font-weight:400}
.log li{display:grid; grid-template-columns:150px 1fr auto; gap:12px; padding:9px 20px; border-top:1px solid var(--ps-hair); font-size:13.5px} .log small{color:var(--ps-ink-2)}
.dt{padding:4px 20px 16px; display:grid; gap:8px; font-size:13.5px; color:var(--ps-ink-2)} .dt b{color:var(--ps-ink); font-weight:500}

/* THE DESIGNER (a stand-in) AND ITS HAND-OFF STRIP */
.dz{flex:1; display:flex; flex-direction:column; min-height:0}
.hs{position:relative; display:flex; align-items:center; gap:16px; padding:10px 24px; background:var(--ps-card); border-bottom:1px solid var(--ps-hair); min-height:56px; box-sizing:border-box; flex-wrap:wrap}
.hs-t{min-width:0} .hs-t small{display:block; font-size:12.5px; color:var(--ps-ink-2)} .hs-t b{font-weight:500; font-size:15px}
.hs .q{margin:0; flex:1 1 260px; max-width:520px}
.hs-ok{display:flex; align-items:center; gap:8px; font-size:14px} .hs-ok svg{color:var(--ps-good)}
.dz-b{flex:1; display:grid; grid-template-columns:260px 1fr; min-height:480px}
.dz-r{padding:20px; border-right:1px solid var(--ps-hair); display:grid; gap:10px; align-content:start}
.dz-r i{display:block; height:34px; border-radius:var(--ps-r-sm); background:var(--ps-fill)} .dz-r i:nth-child(3n){width:70%} .dz-r p{font-size:12.5px; color:var(--ps-ink-2); margin-bottom:6px}
.dz-s{background:var(--ps-stage); display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; padding:32px}
.cap{font-size:12.5px; color:var(--ps-ink-2)}
.dz-s img{max-width:100%; max-height:min(62vh,520px); border-radius:4px; display:block}
.sheet{position:absolute; right:24px; top:calc(100% + 8px); width:400px; max-width:calc(100vw - 48px); padding:20px; border-radius:var(--ps-r); background:var(--ps-card); box-shadow:0 0 0 1px var(--ps-line), 0 18px 40px rgba(10,11,13,.18); z-index:15; box-sizing:border-box}
.sheet h3{font-size:19px; font-weight:400} .sheet label.l,.frm label.l{display:block; margin:16px 0 6px; font-size:12px; color:var(--ps-ink-2); letter-spacing:.4px; text-transform:uppercase; font-weight:500}
.ppl{display:flex; flex-wrap:wrap; gap:6px}
.ppl button{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px 0 5px; border-radius:var(--ps-pill); background:var(--ps-fill); font-weight:500; font-size:13.5px}
.ppl button small{color:var(--ps-ink-2); font-weight:400; font-size:12px}
.ppl button[aria-pressed="true"]{background:var(--ps-fill-on); color:var(--ps-accent-i)} .ppl button[aria-pressed="true"] small{color:inherit; opacity:.8} .ppl button[aria-pressed="true"] .av{background:var(--ps-card); color:var(--ps-ink)}
.chk li{display:flex; gap:8px; align-items:flex-start; font-size:13.5px; padding:3px 0} .chk svg{width:16px; height:16px; margin-top:2px; color:var(--ps-good)} .chk li[data-w] svg{color:var(--ps-warn)}
.sheet-f{display:flex; gap:8px; margin-top:18px; align-items:center}
.else{margin-top:14px; border-top:1px solid var(--ps-hair); padding-top:12px} .else summary{cursor:pointer; font-size:13px; color:var(--ps-ink-2)} .else div{display:grid; gap:6px; margin-top:10px; justify-items:start}

/* THE CHECK (content team) */
.rv{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:24px; margin-top:8px; align-items:start}
.rv-s{background:var(--ps-stage); border-radius:var(--ps-r); display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; padding:28px; min-height:420px}
.rv-s img{max-width:100%; max-height:520px; border-radius:4px}
.rv-c{padding:20px}
.cp{display:grid; gap:14px; margin-top:6px} .cp small{display:block; font-size:12px; color:var(--ps-ink-2); letter-spacing:.4px; text-transform:uppercase; font-weight:500} .cp p{font-size:17px; line-height:1.35}
.cp p[dir="rtl"]{font-size:18px; line-height:1.6}
.rv-f{display:flex; gap:8px; flex-wrap:wrap; margin-top:20px}

/* NEW */
.pick{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:24px}
.pick button{text-align:left; padding:22px; background:var(--ps-card); border-radius:var(--ps-r); box-shadow:0 0 0 1px var(--ps-hair)}
.pick button:hover{background:var(--ps-card-h)} .pick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ps-ink)}
.pick b{display:block; font-size:19px; font-weight:400} .pick small{color:var(--ps-ink-2); font-size:13.5px}
.frm{padding:8px 22px 22px; margin-top:14px} .frm .fld{width:100%} .frm .two{display:grid; grid-template-columns:1fr 200px; gap:14px}
.auds{display:grid; gap:6px} .auds li{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-radius:var(--ps-r-sm); background:var(--ps-fill)}

/* ABOUT */
.ab h2{font-size:22px; font-weight:400; margin:36px 0 10px} .ab p{max-width:68ch; margin-top:8px; font-size:15px} .ab p.d{color:var(--ps-ink-2)}
.ab table{width:100%; border-collapse:collapse; margin-top:12px; font-size:14px} .ab th,.ab td{text-align:left; vertical-align:top; padding:11px 16px; border-top:1px solid var(--ps-hair)} .ab th{font-size:12px; color:var(--ps-ink-2); letter-spacing:.4px; text-transform:uppercase; font-weight:500; border-top:0}
.ab td:first-child{width:22%; font-weight:500} .ab td:nth-child(2){width:36%; color:var(--ps-ink-2)}
.ab ol{margin:10px 0 0; padding-left:20px; max-width:68ch; font-size:15px} .ab ol li{margin-top:6px}

.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); display:flex; align-items:center; gap:14px; padding:12px 18px; border-radius:var(--ps-pill); background:var(--ps-ink); color:var(--ps-app); font-size:14px; z-index:40; max-width:calc(100vw - 32px)}
.toast button{background:none; color:inherit; font-weight:600; text-decoration:underline; text-underline-offset:3px; padding:0}

@media (max-width:860px){
  .wk{grid-template-columns:64px 1fr} .wk .th{width:64px; height:64px} .wk[data-k="ops"] .th{width:48px; height:64px; margin:0 8px} .wk-a{grid-column:1 / -1} .wk-a .btn{width:100%}
  .tb a{grid-template-columns:44px minmax(0,1fr) 84px; gap:12px} .tb a > :nth-child(6){display:none} .tb a > :nth-child(4),.tb a > :nth-child(5){display:none} .tb-h{display:none} .tb .st .ln{width:80px}
  .jh{grid-template-columns:auto 1fr} .jh-a{grid-column:1 / -1} .jh-a .btn,.jh-a .gh{width:100%} .jh .th{width:72px; height:72px} .jh h1{font-size:24px}
  .now{flex-direction:column; align-items:flex-start}
  .gr-r{grid-template-columns:1fr} .gr-r > * + *{border-left:0; border-top:1px solid var(--ps-hair)} .gr-h{display:none} .cell::before{content:attr(data-l); font-size:11px; color:var(--ps-ink-2); letter-spacing:.4px; text-transform:uppercase; width:100%}
  .rv{grid-template-columns:1fr} .dz-b{grid-template-columns:1fr} .dz-r{display:none} .pick,.frm .two{grid-template-columns:1fr}
  .out li a{grid-template-columns:1fr auto} .out li a > :nth-child(3){display:none}
  .log li{grid-template-columns:1fr} h1{font-size:28px} main{padding:24px 16px 80px} .top,.sbx,.hs{padding-left:16px; padding-right:16px}
  .me summary span:not(.av){display:none} .me summary{padding:0 4px} .top{gap:8px} .top .p-wm{--ps-wm-h:15px} .nav a{padding:0 11px; font-size:13.5px} .btn.new{padding:0 9px} .btn.new span{display:none} .top [data-act="theme"]{display:none}
  .wk{align-items:start}
}
@media (max-width:520px){ .top .p-wm{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="g-chevl" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="g-r" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="g-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

/* ── routing and actions ── */
function route() {
  var p = location.hash.replace(/^#\/?/, '').split('/'), v = p[0] || '';
  chrome(v === '' ? 'mine' : v === 'all' || v === 'job' ? 'all' : '');
  if (v !== 'design') { U.sheet = null; U.sent = null; }
  if (v !== 'review') { U.chg = false; U.done = null; }
  $('app').innerHTML = v === '' ? vMine() : v === 'all' ? vAll() : v === 'job' ? vJob(p[1]) : v === 'design' ? vDesign(p[1], p[2]) : v === 'review' ? vReview(p[1], p[2]) : v === 'new' ? vNew() : v === 'about' ? vAbout() : vMine();
  document.title = 'PDS sandbox';
}
function cur() { var p = location.hash.replace(/^#\/?/, '').split('/'); return { v: p[0], j: J(p[1]), p: J(p[1]) && pc(J(p[1]), p[2]) }; }
function keepSheet() { if (!U.sheet) return; var n = $('note'); if (n) U.sheet.note = n.value; U.sheet.also = {}; [].forEach.call(document.querySelectorAll('[data-also]'), function (c) { if (c.checked) U.sheet.also[c.getAttribute('data-also')] = 1; }); }

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  var a = t.getAttribute('data-act'), v = t.getAttribute('data-v'), c = cur(), j = t.getAttribute('data-j') ? J(t.getAttribute('data-j')) : c.j, p = c.p;
  if (a === 'reset') { S = fresh(); save(); location.hash = '#/'; route(); toast('Back to the starting data.'); return; }
  if (a === 'theme') { var d = document.documentElement, dark = d.getAttribute('data-theme') === 'light'; if (dark) d.removeAttribute('data-theme'); else d.setAttribute('data-theme', 'light'); try { localStorage.setItem('provident-theme', dark ? 'dark' : 'light'); } catch (x) {} return; }
  if (a === 'undo') { if (S.undo) { for (var i = 0; i < S.jobs.length; i++) if (S.jobs[i].id === S.undo.id) S.jobs[i] = JSON.parse(S.undo.job); S.undo = null; save(); } U.sent = null; U.done = null; $('toast').innerHTML = ''; route(); toast('Undone.'); return; }
  if (a === 'flt') { U.flt = v; route(); return; }
  if (a === 'ph') { U.ph[j.id] = v; route(); return; }
  if (a === 'nk') { U.nk = v; route(); return; }
  if (a === 'nd') { U.nd = v; route(); return; }

  if (a === 'skip') { snap(j); becomeReady(j, p); logIt(j, 'Marked ' + label(j, p) + ' ready without a check'); save(); U.sheet = null; U.sent = { j: j.id, p: p.id, to: j.by }; route(); return; }
  if (a === 'give') { snap(j); p.with = v; logIt(j, 'Gave ' + label(j, p) + ' to ' + P(v).n); save(); U.sheet = null; U.sent = { j: j.id, p: p.id, to: v }; route(); return; }
  if (a === 'chg') { U.chg = !U.chg; route(); var f = $('chg'); if (f) f.focus(); return; }
  if (a === 'ok') {
    snap(j); var hadAr = j.pieces.some(function (q) { return q.st === 'locked' && q.aud === p.aud && q.ph === p.ph; }); becomeReady(j, p); logIt(j, 'Approved ' + label(j, p)); save();
    U.done = { j: j.id, p: p.id, t: 'Approved.', sub: j.kind === 'ops' ? 'It is ready for ' + first(j.by) + ' to publish.' : lang(p) + ' is ready for ' + first(j.by) + ' to download.' + (hadAr ? ' The Arabic is now with ' + first(p.sentBy || j.designer) + '.' : '') }; route(); return;
  }
  if (a === 'chgGo') { var n = ($('chg').value || '').trim(); if (!n) { $('chg').focus(); $('chg').setAttribute('placeholder', 'Say what to change first.'); return; } snap(j); var back = p.sentBy || j.designer; p.st = 'design'; p.with = back; p.note = { t: n, by: S.me, at: Date.now(), ask: true }; logIt(j, 'Asked for a change on ' + label(j, p)); save(); U.chg = false; U.done = { j: j.id, p: p.id, t: 'Sent back to ' + first(back) + '.', sub: 'Your note goes with it. It returns to you when it is fixed.' }; route(); return; }
  if (a === 'dl' || a === 'dl1') { snap(j); var n2 = 0; j.pieces.forEach(function (q) { if (q.st === 'ready' && !q.dl && (a === 'dl' || q.id === t.getAttribute('data-p'))) { q.dl = true; n2++; } }); logIt(j, 'Downloaded ' + n2 + ' design' + (n2 === 1 ? '' : 's')); save(); route(); toast('Downloaded ' + n2 + ' design' + (n2 === 1 ? '' : 's') + ' (pretend).', true); return; }
  if (a === 'launch' || a === 'posted') { snap(j); j.pieces.forEach(function (q) { q.dl = true; }); j.live = Date.now(); logIt(j, a === 'launch' ? 'Marked it launched' : 'Marked it posted'); save(); route(); toast(j.name + ' is finished. It moves out of the list.', true); return; }
});
document.addEventListener('change', function (e) {
  var t = e.target, a = t.getAttribute && t.getAttribute('data-act');
  if (a === 'as') { S.me = t.value; S.undo = null; save(); U.nk = null; U.nd = null; if (location.hash && location.hash !== '#/') location.hash = '#/'; else route(); return; }
  if (a === 'fin') { U.fin = t.checked; route(); return; }
  if (a === 'extra') { var j = J(t.getAttribute('data-j')); j.extras.forEach(function (x) { if (x.k === t.getAttribute('data-v')) { x.done = t.checked; logIt(j, (t.checked ? 'Marked ' : 'Reopened ') + x.n + (t.checked ? ' done' : '')); } }); save(); route(); }

    auds.forEach(function (a) { ps.push({ id: 'p' + (++n), aud: a, lang: 'EN', st: 'todo', with: des, sentBy: null, sentAt: 0, note: null, dl: false, ph: null, checks: null }); if (ar.indexOf(a) >= 0) ps.push({ id: 'p' + (++n), aud: a, lang: 'AR', st: 'locked', with: null, sentBy: null, sentAt: 0, note: null, dl: false, ph: null, checks: null }); });
    S.jobs.unshift({ id: id, kind: 'cas', name: name, by: S.me, designer: des, due: dd, made: Date.now(), live: 0, thumb: 'campaign-h', brief: brief, copy: { EN: { h: name, s: 'Supporting line from the brief', c: 'Register your interest' }, AR: { h: 'العنوان بالعربية', s: 'السطر الداعم', c: 'سجّل اهتمامك' } }, pieces: ps,
      extras: [{ k: 'anim', n: 'Animated', sub: '1:1 and 9:16', done: false }, { k: 'video', n: 'MVP video', sub: 'From the Video Studio', done: false }], log: [{ at: Date.now(), by: S.me, t: 'Sent the brief to ' + P(des).n }] });

  } else {

      pieces: [{ id: 'p1', aud: 'Post', lang: 'EN', st: smm ? 'draft' : 'design', with: S.me, sentBy: null, sentAt: 0, note: null, dl: false, ph: null, checks: null }], extras: [], log: [{ at: Date.now(), by: S.me, t: smm ? 'Started the draft' : 'Started the post' }] });
    save(); U.nk = null; location.hash = '#/design/' + id + '/p1';
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && U.sheet) { U.sheet = null; route(); var b = document.querySelector('[data-act="sheet"]'); if (b) b.focus(); } });

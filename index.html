<!doctype html>
<html lang="en" data-acc-home>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Provident Design Studio</title>
<meta name="description" content="Provident Design Studio: one home for Campaign ads and Organic posts — what is waiting on you, where everything stands, and the way into each studio.">

<!-- SET data-theme BEFORE FIRST PAINT. Light-first, and the key is `provident-theme`, the SAME
     one the studios read, so a choice made here carries into whichever studio opens next. -->
<script>try{ if (localStorage.getItem('provident-theme') !== 'dark')
  document.documentElement.setAttribute('data-theme','light'); }catch(e){}</script>

<!-- THE LANDING PAGE LINKS THE DESIGN SYSTEM RATHER THAN MIRRORING IT: it carries no colour
     literals in JS and is never opened off the disk, so it is a live consumer and cannot drift.
     The kit's @font-face resolves ../_ds/ against the stylesheet, so the real typeface comes with it. -->
<link rel="stylesheet" href="ui-design-system/provident-ui.css">
<!-- ONE HOME: the studios' own code for the work, in the studios' order. studio-base.js supplies
     providentDrive; share-link.js CAS's Status (ad set pages), the campaign setup and the Drive kit;
     access.js in home mode (no gate, sign-in from a click, the admin's panel, the hand-off picker);
     post-flow.js OPS's posts (the Feed and the post page). None of them needs a studio engine for
     what this page mounts; the actions that do (a pick-up, a new design) open the studio. -->
<script src="studio-base.js"></script>
<script src="share-link.js"></script>
<script src="access.js"></script>
<script src="post-flow.js"></script>

<style>
/* THE HOME (2026-11-02, "one home"). One page for every role over both studios: Home (what is
   waiting on you, from CAS and OPS, and where everything stands), Status (one board), an item page
   per queue row, New (the studio follows the role) and Access (the admin's panel; everyone else
   sees what their role opens). It runs no studio code: it reads what the studios leave on this
   computer — provident-inbox-cas|ops (StudioBase.inboxSave), provident-acc-me (access.js),
   recents in IndexedDB — and every action opens the studio that owns it. Chrome tokens only. */
body{margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--ps-app); color:var(--ps-ink); font-family:var(--ps-font)}
::selection{background:color-mix(in srgb, var(--ps-link) 40%, transparent)}
[hidden]{display:none !important}
.sp{flex:1}
svg.i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--ps-ink); outline-offset:2px}
/* ── the bar: wordmark, the three places, New, the account ── */
.p-top{position:sticky; top:0; z-index:20; gap:14px}
.uh-nav{display:flex; gap:2px; padding:4px; border-radius:var(--ps-pill); background:var(--ps-fill)}
.uh-nav a{display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 16px; border-radius:var(--ps-pill); color:var(--ps-ink-2);
  text-decoration:none; font:600 14px/1 var(--ps-font); letter-spacing:.16px; transition:background-color var(--ps-motion) var(--ps-ease), color var(--ps-motion) var(--ps-ease)}
.uh-nav a:hover{background:var(--ps-fill-h); color:var(--ps-ink)}
.uh-nav a[aria-current="page"]{background:var(--ps-fill-on); color:var(--ps-ink)}
.uh-n{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; box-sizing:border-box; border-radius:var(--ps-pill);
  background:var(--ps-primary); color:var(--ps-primary-i); font:600 11.5px/1 var(--ps-font); font-variant-numeric:tabular-nums}
.uh-me{display:inline-grid; place-items:center; width:36px; height:36px; padding:0; border:0; border-radius:50%; background:var(--ps-fill-on); color:var(--ps-ink);
  font:600 12.5px/1 var(--ps-font); cursor:pointer; transition:box-shadow var(--ps-motion) var(--ps-ease)}
.uh-me:hover{box-shadow:0 0 0 2px var(--ps-line)}
.uh-av{display:inline-grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--ps-fill-on); color:var(--ps-ink);
  font:600 12.5px/1 var(--ps-font); flex:none}
.uh-av[data-sm]{width:24px; height:24px; font-size:10.5px}
.uh-av[data-q]{background:var(--ps-fill); color:var(--ps-ink-2)}
/* the account menu: a ring, not a shadow, like every surface here */
.mn{position:fixed; inset:62px 16px auto auto; margin:0; width:260px; padding:8px; border:0; border-radius:16px; background:var(--ps-card); color:var(--ps-ink);
  box-shadow:inset 0 0 0 1px var(--ps-line), 0 0 0 4px color-mix(in srgb, var(--ps-app) 70%, transparent)}
.mn:popover-open{animation:mnin 200ms cubic-bezier(.16,1,.3,1)}
@keyframes mnin{from{opacity:0; transform:translateY(-6px)}}
.mn-h{display:grid; grid-template-columns:36px minmax(0,1fr); gap:12px; align-items:center; padding:8px 8px 4px}
.mn-h .uh-av{width:36px; height:36px}
.mn-h b{display:block; font:500 14px/1.25 var(--ps-font)}
.mn-h small{display:block; font:400 12.5px/1.3 var(--ps-font); color:var(--ps-ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mn-r{display:inline-flex; align-items:center; height:24px; margin:6px 8px 8px 56px; padding:0 10px; border-radius:var(--ps-pill); background:var(--ps-fill); font:500 12px/1 var(--ps-font); color:var(--ps-ink-2)}
.mn-i{display:flex; align-items:center; width:100%; height:38px; padding:0 10px; border:0; border-radius:10px; background:none; box-sizing:border-box; color:var(--ps-ink);
  font:500 14px/1 var(--ps-font); text-decoration:none; cursor:pointer; text-align:left; transition:background-color var(--ps-motion) var(--ps-ease)}
.mn-i:hover{background:var(--ps-fill)}
.mn-i + .mn-i{margin-top:2px}
.mn a.mn-i{margin-top:2px; box-shadow:0 -1px 0 var(--ps-hair)}
/* buttons: one navy action, the rest quiet */
.b{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; padding:0 16px; border:0; border-radius:var(--ps-pill); cursor:pointer;
  font:600 14px/1 var(--ps-font); letter-spacing:.16px; text-decoration:none; white-space:nowrap;
  transition:background-color var(--ps-motion) var(--ps-ease), color var(--ps-motion) var(--ps-ease), box-shadow var(--ps-motion) var(--ps-ease), transform var(--ps-motion) var(--ps-ease)}
.b:active{transform:translateY(1px)}
.b-p{background:var(--ps-primary); color:var(--ps-primary-i)}
.b-p:hover{background:var(--ps-primary-h)}
.b-g{background:var(--ps-fill); color:var(--ps-ink)}
.b-g:hover{background:var(--ps-fill-h)}
.b-q{background:transparent; color:var(--ps-ink-2)}
.b-q:hover{background:var(--ps-fill); color:var(--ps-ink)}
.b-o{background:transparent; color:var(--ps-ink); box-shadow:inset 0 0 0 1px var(--ps-line)}
.b-o:hover{box-shadow:inset 0 0 0 1px var(--ps-ink-2)}
.b-l{height:auto; padding:0; background:none; color:var(--ps-link); font-weight:500; text-underline-offset:3px}
.b-l:hover{text-decoration:underline}
.b-lg{height:44px; padding:0 20px}
.b svg.i{width:17px; height:17px}

/* ── page frame ── */
.pg{width:100%; max-width:1320px; margin:0 auto; padding:40px 32px 48px; box-sizing:border-box}
.h1{margin:0; font:400 clamp(30px,3.4vw,46px)/1.12 var(--ps-font); letter-spacing:-.028em; color:var(--ps-ink); text-wrap:balance}
.h1 span{display:block; color:var(--ps-ink-2)}
.h2{margin:0; font:400 28px/1.2 var(--ps-font); letter-spacing:-.018em}
.sh{display:flex; align-items:baseline; gap:10px; margin:0 0 12px; font:600 14px/1.3 var(--ps-font); color:var(--ps-ink)}
.sh small{font:400 13px/1.3 var(--ps-font); color:var(--ps-dim); font-variant-numeric:tabular-nums}
.sh .sp{flex:1}
.lede{margin:8px 0 0; font:400 15px/1.5 var(--ps-font); color:var(--ps-ink-2); max-width:62ch}
.pan{padding:18px; border-radius:16px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair)}
.pan > .sh{margin-bottom:14px}
.quiet{padding:22px 24px; border-radius:16px; background:var(--ps-fill)}
.quiet b{display:block; font:500 17px/1.3 var(--ps-font)}
.quiet p{margin:6px 0 0; font:400 14px/1.5 var(--ps-font); color:var(--ps-ink-2); max-width:62ch}

/* the studio mark: the miniature at the studio's own canvas shape, and the hub's tray */
.mk{display:inline-flex; align-items:center; gap:7px; font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap}
.mk i{display:inline-flex; flex-direction:column; justify-content:flex-end; gap:2px; height:14px; aspect-ratio:var(--a,1); box-sizing:border-box; padding:0 2px 3px;
  border-radius:3px; box-shadow:inset 0 0 0 1.25px var(--ps-ink-2)}
.mk i::before,.mk i::after{content:''; display:block; height:1.25px; border-radius:2px; background:var(--ps-ink-2)}
.mk i::before{width:70%} .mk i::after{width:45%}
.mk[data-s="ops"] i{--a:.75}
.mk-h{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px 0 7px; border-radius:var(--ps-pill); background:var(--ps-fill);
  font:500 12px/1 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap}
.mk-h svg.i{width:14px; height:14px}

/* renders: real ones at true shape; a new item has none yet */
.rd{position:relative; flex:none; display:block; height:var(--h,56px); aspect-ratio:var(--a,1); border-radius:6px; overflow:hidden; background:var(--ps-stage);
  box-shadow:0 0 0 1px var(--ps-hair)}
.rd img{display:block; width:100%; height:100%; object-fit:cover}
.rd[data-none]{background:var(--ps-fill); box-shadow:inset 0 0 0 1px var(--ps-line)}
.rd[data-none]::before{content:''; position:absolute; left:18%; right:18%; bottom:20%; height:2px; border-radius:2px; background:var(--ps-line); box-shadow:0 -6px 0 var(--ps-line)}
.rd[data-none][data-t]::after{content:attr(data-t); position:absolute; inset:0; display:grid; place-items:center; padding:0 12px; text-align:center;
  font:500 13px/1.3 var(--ps-font); color:var(--ps-dim)}

/* step segments: the studio's own steps */
.seg{display:flex; gap:3px}
.seg i{width:14px; height:4px; border-radius:var(--ps-pill); background:var(--ps-line)}
.seg i[data-s="done"]{background:var(--ps-good)}
.seg i[data-s="cur"]{background:var(--ps-link)}
.seg i[data-s="warn"]{background:var(--ps-warn)}
.due{display:inline-flex; align-items:center; gap:6px; font:400 13px/1 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}
.due::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--ps-line)}
.due[data-k="soon"]{color:var(--ps-ink)} .due[data-k="soon"]::before{background:var(--ps-warn)}
.due[data-k="late"]{color:var(--ps-bad)} .due[data-k="late"]::before{background:var(--ps-bad)}

/* ═════ HOME ═════ */
.hm{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:40px 48px; align-items:start}
.hm-main{min-width:0}
.hm-side{display:flex; flex-direction:column; gap:16px; min-width:0}
.hm .h1{margin-bottom:32px}

/* Next up: the one card that shouts */
.nx{display:grid; grid-template-columns:auto minmax(0,1fr); gap:28px; padding:20px 28px 20px 20px; border-radius:16px; background:var(--ps-card);
  box-shadow:inset 0 0 0 1px var(--ps-hair)}
.nx .rd{--h:250px; border-radius:8px}
.nx-b{display:flex; flex-direction:column; min-width:0; padding-top:4px}
.nx-src{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px}
.nx h3{margin:14px 0 0; font:400 30px/1.15 var(--ps-font); letter-spacing:-.02em; text-wrap:pretty}
.nx h3 a{color:inherit; text-decoration:none}
.nx h3 a:hover{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:5px}
.nx-msg{margin:12px 0 0; padding:12px 14px; border-radius:12px; background:var(--ps-fill); font:400 14px/1.5 var(--ps-font); color:var(--ps-ink); max-width:56ch}
.nx-msg small{display:block; margin-bottom:4px; font:400 12.5px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.nx-steps{list-style:none; display:grid; grid-template-columns:repeat(var(--n,4),minmax(0,1fr)); gap:6px; margin:20px 0 0; padding:0; max-width:520px}
.nx-steps li{display:flex; flex-direction:column; gap:7px; min-width:0; font:400 12.5px/1.2 var(--ps-font); color:var(--ps-dim)}
.nx-steps li::before{content:''; height:4px; border-radius:var(--ps-pill); background:var(--ps-line)}
.nx-steps li[data-s="done"]{color:var(--ps-ink-2)} .nx-steps li[data-s="done"]::before{background:var(--ps-good)}
.nx-steps li[data-s="cur"]{color:var(--ps-ink); font-weight:500} .nx-steps li[data-s="cur"]::before{background:var(--ps-link)}
.nx-steps li[data-s="warn"]{color:var(--ps-ink); font-weight:500} .nx-steps li[data-s="warn"]::before{background:var(--ps-warn)}
.nx-steps li span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pgr{display:flex; align-items:center; gap:2px; margin:-8px -6px -8px 0}
.icb{display:inline-grid; place-items:center; width:32px; height:32px; padding:0; border:0; border-radius:50%; background:transparent; color:var(--ps-ink-2); cursor:pointer;
  transition:background-color var(--ps-motion) var(--ps-ease), color var(--ps-motion) var(--ps-ease)}
.icb:hover{background:var(--ps-fill); color:var(--ps-ink)}
.icb:disabled{opacity:.35; cursor:default; background:transparent}
.nx[data-flip] > *{animation:nxin 300ms cubic-bezier(.16,1,.3,1)}
@keyframes nxin{from{opacity:0; transform:translateX(calc(var(--d,1) * 16px)); filter:blur(3px)}}
.nw-d{display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px 0 8px; border-radius:var(--ps-pill); background:var(--ps-fill-on);
  font:600 11.5px/1 var(--ps-font); color:var(--ps-ink); letter-spacing:.1px}
.nw-d::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--ps-link)}
.hc{display:flex; flex-direction:column; gap:12px; margin-top:20px; padding:16px; border-radius:16px; background:var(--ps-fill); max-width:560px; animation:pin 300ms cubic-bezier(.16,1,.3,1)}
.hc label{font:600 14px/1.3 var(--ps-font)}
.hc label small{margin-left:6px; font:400 13px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.hc .ta{min-height:88px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair)}
.hc-a{display:flex; flex-wrap:wrap; gap:10px}
.nx-acts{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-top:auto; padding-top:22px}

/* the inbox: everything handed to you, from either studio or the hub */
.ib{margin-top:40px}
.flt{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px}
.flt button{display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 13px; border:0; border-radius:var(--ps-pill); background:transparent;
  box-shadow:inset 0 0 0 1px var(--ps-line); color:var(--ps-ink-2); font:500 13px/1 var(--ps-font); cursor:pointer;
  transition:background-color var(--ps-motion) var(--ps-ease), color var(--ps-motion) var(--ps-ease), box-shadow var(--ps-motion) var(--ps-ease)}
.flt button:hover{color:var(--ps-ink); box-shadow:inset 0 0 0 1px var(--ps-ink-2)}
.flt button[aria-pressed="true"]{background:var(--ps-fill-on); color:var(--ps-ink); box-shadow:none}
.flt button small{font:400 12.5px/1 var(--ps-font); color:var(--ps-dim); font-variant-numeric:tabular-nums}
.flt button[aria-pressed="true"] small{color:var(--ps-ink-2)}
.rows{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.row{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:18px; padding:10px 12px 10px 10px; border-radius:14px;
  background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair);
  transition:box-shadow var(--ps-motion) var(--ps-ease), background-color var(--ps-motion) var(--ps-ease), opacity 260ms var(--ps-ease), transform 320ms cubic-bezier(.16,1,.3,1)}
.row:hover{box-shadow:inset 0 0 0 1px var(--ps-line); background:var(--ps-card-h)}
.row[data-gone]{opacity:0; transform:translateX(28px)}
.row-t{min-width:0}
.row-t a{display:block; font:500 15px/1.3 var(--ps-font); color:var(--ps-ink); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-t a:hover{text-decoration:underline; text-underline-offset:3px}
.row-m{display:flex; align-items:center; gap:8px 12px; margin-top:6px; flex-wrap:wrap; font:400 13px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.row-m b{font-weight:500; color:var(--ps-ink)}
.row-m .dot{width:3px; height:3px; border-radius:50%; background:var(--ps-dim)}
.th{display:grid; place-items:center; width:var(--w,56px)}
.row[data-k="acc"] .rd{display:grid; place-items:center; background:var(--ps-fill); box-shadow:none; color:var(--ps-ink-2)}
.row[data-k="acc"] .rd svg.i{width:22px; height:22px}
.more{margin-top:12px}
.oth{margin-top:36px}
.oth .row{grid-template-columns:auto minmax(0,1fr) auto}
.oth .row-t a{font-size:14px}

/* side: the board in one panel, the admin's door, your studios */
.flw{list-style:none; margin:4px 0 0; padding:0; position:relative}
/* the line the stages hang on, drawn through the dots */
.flw::before{content:''; position:absolute; left:4px; top:22px; bottom:22px; width:1px; background:var(--ps-line)}
.flw a{position:relative; display:grid; grid-template-columns:9px minmax(0,1fr) auto 26px; align-items:center; gap:14px; margin:0 -8px; padding:11px 8px; border-radius:10px;
  color:inherit; text-decoration:none; transition:background-color var(--ps-motion) var(--ps-ease)}
.flw a:hover{background:var(--ps-fill)}
.fl-d{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px var(--ps-card); transition:box-shadow var(--ps-motion) var(--ps-ease)}
.flw a:hover .fl-d{box-shadow:0 0 0 3px var(--ps-fill)}
.flw li[data-empty] .fl-d{background:var(--ps-card); box-shadow:0 0 0 3px var(--ps-card), inset 0 0 0 1.5px var(--ps-line)}
.fl-n{min-width:0}
.fl-n b{display:block; font:500 14px/1.25 var(--ps-font)}
.fl-n small{display:block; margin-top:3px; font:400 12.5px/1.35 var(--ps-font); color:var(--ps-ink-2)}
.fl-n em{display:block}
.fl-n em{font-style:normal; font-weight:500; color:var(--ps-bad)}
.flw li[data-empty] .fl-n b,.flw li[data-empty] .fl-c{color:var(--ps-ink-2)}
/* the work in the stage: its own renders, overlapped; yours carry the link ring */
.fl-s{display:flex; align-items:center; justify-content:flex-end; min-width:0}
.fl-t{display:block; border-radius:5px; transition:transform 220ms cubic-bezier(.16,1,.3,1)}
.fl-t + .fl-t,.fl-t + .fl-more{margin-left:-9px}
.fl-t .rd{--h:30px; border-radius:5px; box-shadow:0 0 0 2px var(--ps-card)}
.fl-t .rd[data-none]{box-shadow:0 0 0 2px var(--ps-card), inset 0 0 0 1px var(--ps-line)}
.fl-t .rd[data-none]::before{display:none}
.fl-t[data-me] .rd{box-shadow:0 0 0 2px var(--ps-card), 0 0 0 3.5px var(--ps-link)}
.flw a:hover .fl-t .rd{box-shadow:0 0 0 2px var(--ps-fill)}
.flw a:hover .fl-t[data-me] .rd{box-shadow:0 0 0 2px var(--ps-fill), 0 0 0 3.5px var(--ps-link)}
.flw a:hover .fl-t:nth-child(2){transform:translateX(3px)} .flw a:hover .fl-t:nth-child(3){transform:translateX(6px)} .flw a:hover .fl-t:nth-child(4){transform:translateX(9px)}
.fl-more{display:inline-grid; place-items:center; height:30px; min-width:30px; padding:0 6px; box-sizing:border-box; border-radius:var(--ps-pill); background:var(--ps-fill-h);
  box-shadow:0 0 0 2px var(--ps-card); font:600 11.5px/1 var(--ps-font); color:var(--ps-ink); position:relative}
.fl-c{font:400 20px/1 var(--ps-font); letter-spacing:-.01em; text-align:right; font-variant-numeric:tabular-nums}
.fl-f{display:flex; align-items:center; gap:10px; margin:8px -8px -6px; padding:12px 8px 10px; border-radius:10px; box-shadow:0 -1px 0 var(--ps-hair);
  color:var(--ps-ink-2); text-decoration:none; font:400 13px/1 var(--ps-font); transition:background-color var(--ps-motion) var(--ps-ease), color var(--ps-motion) var(--ps-ease)}
.fl-f i{width:9px; height:9px; border-radius:50%; background:var(--ps-good)}
.fl-f svg.i{width:16px; height:16px}
.fl-f:hover{background:var(--ps-fill); color:var(--ps-ink); box-shadow:none}
.req{list-style:none; margin:0; padding:0}
.req li{display:grid; grid-template-columns:32px minmax(0,1fr); gap:4px 12px; padding:12px 0}
.req li + li{box-shadow:0 -1px 0 var(--ps-hair)}
.req .uh-av{grid-row:span 2}
.req b{display:block; font:500 14px/1.25 var(--ps-font)}
.req small{display:block; font:400 12.5px/1.35 var(--ps-font); color:var(--ps-ink-2)}
.req .acts{grid-column:2; display:flex; gap:8px; margin-top:8px}
.req .acts .b{height:32px; padding:0 13px; font-size:13px}
.st{display:grid; grid-template-columns:34px minmax(0,1fr) auto; align-items:center; gap:12px; margin:0 -8px; padding:9px 8px; border-radius:8px;
  color:inherit; text-decoration:none; transition:background-color var(--ps-motion) var(--ps-ease)}
.st:hover{background:var(--ps-fill)}
.st .mk i{height:28px; padding:0 4px 5px; gap:3px; border-radius:5px}
.st .mk i::before,.st .mk i::after{height:2px}
.st b{display:block; font:500 14px/1.25 var(--ps-font)}
.st small{display:block; margin-top:2px; font:400 12.5px/1.3 var(--ps-font); color:var(--ps-dim)}
.st > svg.i{color:var(--ps-dim); transition:transform var(--ps-motion) var(--ps-ease)}
.st:hover > svg.i{transform:translateX(3px); color:var(--ps-ink)}

/* ═════ STATUS: one board, both studios ═════ */
.sx-head{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 24px; margin-bottom:24px}
.sx-tools{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:20px}
.sx-tools .flt{margin:0}
.srch{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:var(--ps-pill); background:var(--ps-fill); color:var(--ps-ink-2); margin-left:auto}
.srch input{width:200px; border:0; background:none; outline:none; color:var(--ps-ink); font:400 14px/1 var(--ps-font)}
.srch input::placeholder{color:var(--ps-dim)}
.srch:focus-within{outline:2px solid var(--ps-ink); outline-offset:2px}
.tg{display:inline-flex; align-items:center; gap:10px; height:36px; padding:0 4px; border:0; background:none; color:var(--ps-ink-2); font:500 13px/1 var(--ps-font); cursor:pointer}
.tg i{position:relative; width:32px; height:20px; border-radius:var(--ps-pill); background:var(--ps-fill-h); transition:background-color var(--ps-motion) var(--ps-ease)}
.tg i::after{content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--ps-ink-2); transition:transform var(--ps-motion) var(--ps-ease), background-color var(--ps-motion) var(--ps-ease)}
.tg[aria-pressed="true"]{color:var(--ps-ink)}
.tg[aria-pressed="true"] i{background:var(--ps-primary)}
.tg[aria-pressed="true"] i::after{transform:translateX(12px); background:var(--ps-primary-i)}
.bd{display:grid; grid-template-columns:repeat(5,minmax(220px,1fr)); gap:14px; align-items:start; overflow-x:auto; padding-bottom:8px;
  scrollbar-width:thin; scrollbar-color:var(--ps-line) transparent}
.col{min-width:0; border-radius:16px; background:var(--ps-fill); padding:12px 10px 10px}
.col-h{display:flex; align-items:center; gap:8px; padding:2px 6px 12px; font:600 14px/1.2 var(--ps-font)}
.col-h > i{width:8px; height:8px; border-radius:50%; background:var(--c,var(--ps-line))}
.col-h small{margin-left:auto; font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
.col-who{display:block; padding:0 6px 10px; margin-top:-6px; font:400 12px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.cds{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.cd{display:block; padding:12px; border-radius:12px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair); color:inherit; text-decoration:none;
  transition:box-shadow var(--ps-motion) var(--ps-ease), transform 200ms cubic-bezier(.16,1,.3,1)}
.cd:hover{box-shadow:inset 0 0 0 1px var(--ps-line); transform:translateY(-1px)}
.cd-g{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start}
.cd .th{align-self:start}
.cd b{display:block; margin-top:6px; font:500 14px/1.3 var(--ps-font); color:var(--ps-ink); text-wrap:pretty}
.cd-st{display:flex; align-items:center; gap:8px; margin-top:8px; font:400 12.5px/1.2 var(--ps-font); color:var(--ps-ink-2)}
.cd-ft{display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:10px; box-shadow:0 -1px 0 var(--ps-hair)}
.cd-ft .due{margin-left:auto; font-size:12.5px}
.cd[data-mine]{box-shadow:inset 0 0 0 1px var(--ps-link)}
.cd-you{font:500 12px/1 var(--ps-font); color:var(--ps-link); white-space:nowrap}
.cd-ft{flex-wrap:wrap; row-gap:6px}
.col-late{margin-left:auto; font:500 12px/1 var(--ps-font); color:var(--ps-bad)}
.col-late + small{margin-left:8px}
.col-empty{padding:14px 8px; font:400 13px/1.4 var(--ps-font); color:var(--ps-dim); text-align:center}

/* ═════ ITEM: CAS's ad set page carried over — one head card with the step counters, the work as
   tiles, activity with the words that changed, and a rail of team links, details and the brief ═════ */
.bk{display:inline-flex; align-items:center; gap:6px; margin:-8px 0 16px; color:var(--ps-ink-2); text-decoration:none; font:500 14px/1 var(--ps-font); min-height:32px}
.bk:hover{color:var(--ps-ink)}
.it-src{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:12px}
.ih{border-radius:16px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair); overflow:hidden}
.ih-top{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:22px; align-items:center; padding:20px 22px; background:var(--ps-fill)}
.ih-top .rd{--h:96px; border-radius:8px}
.ih-tags{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px}
.ih-tags .chip{height:22px; padding:0 9px; font-size:12px; background:var(--ps-card)}
.ih h1{margin:8px 0 0; font:400 clamp(24px,2.4vw,30px)/1.15 var(--ps-font); letter-spacing:-.018em; text-wrap:balance}
.ih-meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:10px; font:400 13px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.pill{display:inline-flex; align-items:center; gap:7px; height:24px; padding:0 10px 0 9px; border-radius:var(--ps-pill); background:var(--ps-card);
  font:500 12.5px/1 var(--ps-font); color:var(--ps-ink)}
.pill::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--c)}
.it-acts{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; align-self:start}
.it-acts .icb{width:36px; height:36px; background:var(--ps-card); color:var(--ps-ink-2)}
.it-acts .icb:hover{color:var(--ps-ink)}
/* the counters: each step's count, its colour, and how full it is */
.ctr{list-style:none; display:grid; grid-template-columns:repeat(var(--n,4),minmax(0,1fr)); gap:22px; margin:0; padding:22px 22px 0}
.ctr li{display:flex; flex-direction:column; min-width:0}
.ctr span{display:flex; align-items:center; gap:7px; font:400 13px/1.2 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ctr span::before{content:''; flex:none; width:7px; height:7px; border-radius:50%; background:var(--c)}
.ctr li[data-s="cur"] span{color:var(--ps-ink); font-weight:500}
.ctr b{margin:10px 0 12px; font:400 30px/1 var(--ps-font); letter-spacing:-.02em; color:var(--ps-ink); font-variant-numeric:tabular-nums}
.ctr b small{font:400 14px/1 var(--ps-font); color:var(--ps-dim); letter-spacing:0}
.ctr li[data-s="todo"] b{color:var(--ps-dim)}
.ctr i{position:relative; display:block; height:4px; border-radius:var(--ps-pill); background:var(--ps-hair); overflow:hidden}
.ctr i::after{content:''; position:absolute; inset:0; transform:scaleX(var(--f,0)); transform-origin:left; background:var(--c);
  transition:transform 600ms cubic-bezier(.16,1,.3,1)}
.ih-now{display:flex; align-items:center; gap:8px; margin:0; padding:18px 22px 20px; font:400 13.5px/1.45 var(--ps-font); color:var(--ps-ink)}
.ih-now::before{content:''; flex:none; width:7px; height:7px; border-radius:50%; background:var(--c)}
#hc-slot:not(:empty){padding:0 22px 22px}
#hc-slot .hc{margin:0}
.it-b{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; margin-top:24px; align-items:start}
.it-b > div{display:flex; flex-direction:column; gap:16px; min-width:0}
.it-h2{display:flex; align-items:center; gap:10px; margin:6px 0 2px; font:600 14px/1.3 var(--ps-font)}
.it-h2 small{font:400 13px/1.3 var(--ps-font); color:var(--ps-dim)}
.it-h2 .sp{flex:1}
.it-h2 .b{height:32px; padding:0 13px; font-size:13px}
/* NEW: two doors, each showing the shapes it makes with real renders */
.nw-w{max-width:1100px}
.doors{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:32px}
.door{display:flex; flex-direction:column; border-radius:20px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair); color:inherit; text-decoration:none; overflow:hidden;
  transition:box-shadow var(--ps-motion) var(--ps-ease)}
.door:hover{box-shadow:inset 0 0 0 1px var(--ps-line)}
.door-st{display:flex; align-items:flex-end; justify-content:center; gap:14px; height:236px; padding:0 20px 18px; box-sizing:border-box; background:var(--ps-fill)}
.dfr{display:flex; flex-direction:column; align-items:center; gap:8px; transition:transform 320ms cubic-bezier(.16,1,.3,1)}
.dfr .rd{border-radius:6px}
.dfr small{font:500 11.5px/1 var(--ps-font); color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
.door:hover .dfr{transform:translateY(-6px)}
.door:hover .dfr:nth-child(2){transition-delay:30ms} .door:hover .dfr:nth-child(3){transition-delay:60ms} .door:hover .dfr:nth-child(4){transition-delay:90ms}
/* the carousel: two pages peeking behind the first */
.dcar{position:relative; display:flex}
.dcar > i{position:absolute; top:0; width:90px; height:160px; border-radius:6px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-line); transition:transform 320ms cubic-bezier(.16,1,.3,1)}
.dcar > i:nth-of-type(1){left:14px; z-index:-1; transform:translateY(-6px) scale(.96)}
.dcar > i:nth-of-type(2){left:28px; z-index:-2; transform:translateY(-12px) scale(.92)}
.dcar{isolation:isolate}
.door:hover .dcar > i:nth-of-type(1){transform:translate(10px,-8px) scale(.96)}
.door:hover .dcar > i:nth-of-type(2){transform:translate(22px,-16px) scale(.92)}
.door-b{display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:22px 24px 22px; flex:1}
.door-b b{font:400 26px/1.15 var(--ps-font); letter-spacing:-.018em}
.door-b p{margin:0; font:400 14.5px/1.5 var(--ps-font); color:var(--ps-ink-2); max-width:46ch}
.door-f{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; width:100%; margin-top:auto; padding-top:12px}
.door-f small{font:400 12.5px/1.3 var(--ps-font); color:var(--ps-dim)}
.door-go{display:inline-flex; align-items:center; gap:8px; margin-left:auto; height:36px; padding:0 16px; border-radius:var(--ps-pill); background:var(--ps-fill);
  font:600 14px/1 var(--ps-font); letter-spacing:.16px; color:var(--ps-ink); transition:background-color var(--ps-motion) var(--ps-ease), color var(--ps-motion) var(--ps-ease)}
.door-go svg.i{transition:transform var(--ps-motion) var(--ps-ease)}
.door:hover .door-go{background:var(--ps-primary); color:var(--ps-primary-i)}
.door:hover .door-go svg.i{transform:translateX(3px)}
.door:focus-visible{outline:2px solid var(--ps-ink); outline-offset:3px}
.door-alt{display:flex; align-items:center; gap:10px; margin:18px 0 0; font:400 14px/1.4 var(--ps-font); color:var(--ps-ink-2)}
.door-alt a{color:var(--ps-link); font-weight:500; text-underline-offset:3px}

/* ACCESS for everyone but the admin: who you are, what your role opens, and how to ask for more */
.ax2{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:24px 40px; align-items:start; max-width:1120px}
.ax2-main{display:flex; flex-direction:column; gap:16px; min-width:0}
.ax2-main .lede{margin-bottom:12px}
.ax2-side{position:sticky; top:84px; min-width:0}
.idc{display:grid; grid-template-columns:64px minmax(0,1fr); gap:18px; align-items:center; padding:20px; border-radius:16px; background:var(--ps-fill)}
.idc .uh-av{width:64px; height:64px; font-size:20px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair)}
.idc b{display:block; font:400 24px/1.2 var(--ps-font); letter-spacing:-.015em}
.idc small{display:block; margin-top:4px; font:400 13.5px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.idc-t{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.idc-t .chip{background:var(--ps-card)}
.idc-r{display:inline-flex; align-items:center; height:26px; padding:0 12px; border-radius:var(--ps-pill); background:var(--ps-fill-on); font:600 12.5px/1 var(--ps-font); color:var(--ps-ink)}
.cn{list-style:none; margin:0; padding:0}
.cn li{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:14px; align-items:center; padding:11px 0}
.cn li + li{box-shadow:0 -1px 0 var(--ps-hair)}
.cn li:first-child{padding-top:2px}
.cn-i{display:grid; place-items:center; width:22px; height:22px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--ps-line)}
.cn li[data-on="1"] .cn-i{background:var(--ps-good); color:var(--ps-app); box-shadow:none}
.cn-i svg.i{width:14px; height:14px; stroke-width:2.4}
.cn b{display:block; font:500 14px/1.3 var(--ps-font)}
.cn small{display:block; margin-top:2px; font:400 12.5px/1.35 var(--ps-font); color:var(--ps-ink-2)}
.cn li[data-on="0"] b{color:var(--ps-ink-2); font-weight:400}
.cn-s{font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2)}
.cn li[data-on="1"] .cn-s{color:var(--ps-ink)}
.rq{display:flex; flex-direction:column; gap:12px}
.rq-o{display:flex; flex-direction:column; gap:8px}
.rq-o label{display:grid; grid-template-columns:18px minmax(0,1fr); gap:12px; align-items:start; padding:12px 14px; border-radius:12px; box-shadow:inset 0 0 0 1px var(--ps-line); cursor:pointer;
  transition:box-shadow var(--ps-motion) var(--ps-ease), background-color var(--ps-motion) var(--ps-ease)}
.rq-o label:hover{box-shadow:inset 0 0 0 1px var(--ps-ink-2)}
.rq-o label:has(input:checked){box-shadow:inset 0 0 0 2px var(--ps-link); background:var(--ps-accent-q)}
.rq-o input{margin:2px 0 0; width:16px; height:16px; accent-color:var(--ps-primary)}
.rq-o b{display:block; font:500 14px/1.3 var(--ps-font)}
.rq-o small{display:block; margin-top:3px; font:400 12.5px/1.4 var(--ps-font); color:var(--ps-ink-2)}
.rq-l{margin-top:6px; font:600 14px/1.3 var(--ps-font)}
.rq-l small{margin-left:6px; font:400 13px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.rq .ta{min-height:84px}
.rq .b-p{align-self:flex-start}
.rq-p .rq-st{margin-bottom:12px}
.rq-p .pill{background:var(--ps-fill)}
.rq-p .br b{font-weight:500}
@media (max-width:980px){
  .ax2{grid-template-columns:minmax(0,1fr)}
  .ax2-side{position:static}
  .doors{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .door-st{height:auto; gap:10px; padding:28px 12px 14px}
  .dfr .rd{--h:var(--hm) !important}
  .dcar > i{width:74px; height:99px}
  .door-b{padding:18px}
  .door-go{margin-left:0}
  .idc{grid-template-columns:48px minmax(0,1fr); gap:14px; padding:16px}
  .idc .uh-av{width:48px; height:48px; font-size:16px}
  .idc b{font-size:20px}
  .szp{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* the page change: one short settle, nothing else enters */
.pg[data-in]{animation:pin 340ms cubic-bezier(.16,1,.3,1)}
@keyframes pin{from{opacity:0; transform:translateY(6px)}}

@media (max-width:1100px){
  .hm{grid-template-columns:minmax(0,1fr)}
  .hm-side{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); align-items:start}
  .it-b{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .p-top{flex-wrap:wrap; height:auto; padding-top:10px; padding-bottom:10px}
  .uh-nav{order:5; width:100%; justify-content:space-between}
  .uh-nav a{flex:1; justify-content:center; padding:0 10px}
  .bd{grid-template-columns:repeat(5,minmax(256px,82vw)); scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
}
@media (max-width:640px){
  .pg{padding:24px 16px 32px}
  .hm .h1{margin-bottom:22px}
  .nx{grid-template-columns:minmax(0,1fr); padding:14px 14px 18px; gap:16px}
  .nx .rd{--h:220px; justify-self:center}
  .nx h3{font-size:24px}
  .nx-acts .b-p{flex:1}
  .row{grid-template-columns:auto minmax(0,1fr); gap:10px 12px}
  .row .due{grid-column:2}
  .row > .b{grid-column:1 / -1}
  .oth .row{grid-template-columns:auto minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr); gap:2px}
  .kv dd{margin-bottom:10px}
  .srch{margin-left:0; width:100%; box-sizing:border-box}
  .srch input{width:100%}
  .ar li{grid-template-columns:40px minmax(0,1fr)}
  .ar .acts{grid-column:1 / -1; flex-wrap:wrap}
  .ar .acts .b{flex:1}
  .tb thead{display:none}
  .tb tr{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:12px 0; box-shadow:0 -1px 0 var(--ps-hair)}
  .tb td{box-shadow:none; padding:0}
  .tb td:nth-child(3),.tb td:nth-child(4){grid-column:1 / -1; font-size:13px; color:var(--ps-ink-2)}
  .ft{padding:12px 16px 24px}
  .p-wm-a{height:15px; width:auto}
  .p-top{gap:10px}
  #newbtn{width:36px; padding:0}
  #newlbl{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}
  .dk{padding:6px 12px}
  .dk-n,.dk-l{display:none}
  .tst{max-width:calc(100vw - 32px); box-sizing:border-box}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important; animation:none !important}
}
/* what the queue does not hold: the item page hands over to the studio */
.chip{display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:var(--ps-pill); background:var(--ps-fill); font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2)}
.it-trk{list-style:none; display:grid; grid-template-columns:repeat(var(--n,4),minmax(0,1fr)); gap:22px; margin:0; padding:22px 22px 0}
.it-trk li{display:flex; flex-direction:column; gap:10px; min-width:0}
.it-trk span{display:flex; align-items:center; gap:7px; font:400 13px/1.2 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.it-trk span::before{content:''; flex:none; width:7px; height:7px; border-radius:50%; background:var(--c)}
.it-trk b{font:400 22px/1 var(--ps-font); letter-spacing:-.015em; color:var(--ps-dim)}
.it-trk li[data-s="done"] b{color:var(--ps-ink-2)}
.it-trk li[data-s="cur"] b,.it-trk li[data-s="cur"] span{color:var(--ps-ink)}
.it-trk li[data-s="cur"] span{font-weight:500}
.it-trk i{display:block; height:4px; border-radius:var(--ps-pill); background:var(--ps-hair)}
.it-trk li[data-s="done"] i{background:var(--ps-good)}
.it-trk li[data-s="cur"] i{background:var(--c)}
.it-more{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px 24px; align-items:center; margin-top:16px; padding:20px 22px; border-radius:16px; background:var(--ps-fill)}
.it-more b{display:block; font:500 16px/1.3 var(--ps-font)}
.it-more p{margin:4px 0 0; font:400 14px/1.5 var(--ps-font); color:var(--ps-ink-2); max-width:62ch}
.fresh{margin:16px 0 0; font:400 12.5px/1.6 var(--ps-font); color:var(--ps-ink-2)}
.fresh a{color:var(--ps-link); text-decoration:none; font-weight:500}
.fresh a:hover{text-decoration:underline; text-underline-offset:3px}
.qk{display:flex; gap:16px; align-items:flex-start; padding:24px 26px; border-radius:16px; background:var(--ps-fill)}
.qk h3{margin:0; font:500 18px/1.3 var(--ps-font)}
.qk p{margin:6px 0 0; font:400 15px/1.5 var(--ps-font); color:var(--ps-ink-2); max-width:62ch}
.qk-a{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-top:16px}
.qk-o{flex:none; display:grid; place-items:center; width:36px; height:36px; border-radius:50%; background:var(--ps-good); color:var(--ps-app)}
.qk-o[data-k="info"]{background:var(--ps-fill-h); color:var(--ps-ink-2)}
.qk-o svg.i{width:20px; height:20px; stroke-width:2.2}
/* THE DESK (2026-11-03, by request): this computer's saved projects as a masonry, as Pinterest
   stacks pins. Each tile is the first page whole at its own shape, in a quiet frame (as the
   studios' Recent tiles were); columns fill top to bottom, so tall stories and short banners
   pack without gaps. The format and page count ride in the line under the title. */
.desk{margin-top:44px}
.desk .sh{margin-bottom:16px}
.dk2{list-style:none; margin:0; padding:0; columns:4 160px; column-gap:16px}
.dk2 > li{break-inside:avoid; margin:0 0 22px}
.rc{display:flex; flex-direction:column; gap:10px; color:var(--ps-ink); text-decoration:none; border-radius:14px}
.rc-st{display:block; padding:10px; border-radius:14px; background:var(--ps-fill); box-shadow:inset 0 0 0 1px var(--ps-hair);
  transition:box-shadow var(--ps-motion) var(--ps-ease), background-color var(--ps-motion) var(--ps-ease)}
.rc-st img{display:block; width:100%; height:auto; border-radius:6px; box-shadow:0 0 0 1px var(--ps-hair); transition:transform 320ms cubic-bezier(.16,1,.3,1)}
.rc:hover .rc-st{background:var(--ps-fill-h); box-shadow:inset 0 0 0 1px var(--ps-line)}
.rc-st:empty{aspect-ratio:4/5}
.rc:hover .rc-st img{transform:translateY(-3px)}
.rc:focus-visible{outline:2px solid var(--ps-ink); outline-offset:3px}
.rc b{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font:500 14px/1.3 var(--ps-font); text-wrap:pretty}
.rc small{display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; margin-top:-4px; font:400 12.5px/1.3 var(--ps-font); color:var(--ps-ink-2); min-width:0}
.rc small .mk{font-weight:400; font-size:12.5px}
/* PROJECTS: every saved project on this computer, both studios, grouped as the studios grouped them
   (CAS by campaign, OPS by format); the tiles are the desk's */
.pj-tools{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:24px 0 8px}
.pj-tools .srch{margin-left:auto}
.pj-open{display:flex; flex-wrap:wrap; gap:8px}
.pj-open .b{height:32px; padding:0 13px; font-size:13px}
.pj-s{margin-top:36px}
.pj-s > h2{display:flex; align-items:center; gap:10px; margin:0 0 4px; font:500 18px/1.3 var(--ps-font)}
.pj-g{margin-top:22px; padding-top:20px; box-shadow:0 -1px 0 var(--ps-hair)}
.pj-s > h2 + .pj-g{box-shadow:none; padding-top:6px}
.pj-g .dk2{columns:5 168px}
@media (max-width:640px){ .pj-g .dk2{columns:2} .pj-tools .srch{width:100%} }
.pj-gh{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin:0 0 14px}
.pj-gh b{font:500 15px/1.3 var(--ps-font)}
.pj-gh small{font:400 12.5px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.pj-none{margin-top:24px}
.desk-more{display:flex; flex-wrap:wrap; gap:4px 16px; margin:18px 0 0; font:400 13px/1.4 var(--ps-font); color:var(--ps-ink-2)}
.desk-more a{color:var(--ps-link); font-weight:500; text-decoration:none}
.desk-more a:hover{text-decoration:underline; text-underline-offset:3px}
/* the admin's panel is access.js's own; this is only its frame */
.acc-adm{width:100%; max-width:1320px; margin:-24px auto 0; padding:0 32px 48px; box-sizing:border-box}

/* SIGNED OUT: the page is a sign-in page, nothing of anyone's work behind it */
body[data-gate] .uh-nav,body[data-gate] #newbtn,body[data-gate] #meav,body[data-gate] .ft{display:none !important}
.gt{min-height:calc(100vh - 140px); display:grid; grid-template-columns:minmax(0,440px) minmax(0,1fr); align-items:center; gap:48px; padding:24px 0}
.gt-c{width:100%; max-width:440px; text-align:left}
/* what the studios make, fanned: the only pictures here are the work itself */
.gt-art{position:relative; height:440px; border-radius:24px; background:var(--ps-fill); overflow:hidden}
.gt-art .rd{position:absolute; border-radius:8px; box-shadow:0 0 0 1px var(--ps-hair)}
.gt-art .rd:nth-child(1){left:12%; top:16%; --h:250px; transform:rotate(-6deg)}
.gt-art .rd:nth-child(2){left:38%; top:10%; --h:300px; z-index:1}
.gt-art .rd:nth-child(3){right:10%; top:22%; --h:230px; transform:rotate(5deg)}
@media (max-width:900px){ .gt{grid-template-columns:minmax(0,1fr); gap:28px} .gt-art{height:280px; order:-1} .gt-art .rd:nth-child(1){--h:160px} .gt-art .rd:nth-child(2){--h:190px} .gt-art .rd:nth-child(3){--h:150px} }
.gt-c .h1{font-size:clamp(30px,3.2vw,40px); margin:0}
.gt-c .lede{margin:12px 0 0}
.gt-c .qk-a{margin-top:24px}
.gt-c .b-lg{min-width:220px}
.gt-n{margin:20px 0 0; padding-top:16px; box-shadow:0 -1px 0 var(--ps-hair); font:400 13px/1.5 var(--ps-font); color:var(--ps-ink-2)}
.gt-n button{border:0; background:none; padding:0; color:var(--ps-link); font:500 13px/1.5 var(--ps-font); cursor:pointer; text-underline-offset:3px}
.gt-n button:hover{text-decoration:underline}
.gt-busy{display:flex; align-items:center; gap:12px; margin-top:24px; font:400 14px/1.4 var(--ps-font); color:var(--ps-ink-2)}
.gt-busy i{width:18px; height:18px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--ps-line); border-top:2px solid var(--ps-ink); box-sizing:border-box; animation:gt-r 900ms linear infinite}
@keyframes gt-r{to{transform:rotate(360deg)}}
/* PREVIEW AS: the admin sees the home as a role sees it, under a bar that says so */
.pv{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 32px; background:var(--ps-fill-on); color:var(--ps-ink); font:400 14px/1.3 var(--ps-font)}
.pv b{font-weight:600}
.pv .sp{flex:1}
.pv button{height:32px; padding:0 14px; border:0; border-radius:var(--ps-pill); background:var(--ps-card); color:var(--ps-ink); font:600 13px/1 var(--ps-font); cursor:pointer}
.pv button:hover{box-shadow:inset 0 0 0 1px var(--ps-line)}
/* NEW CAMPAIGN: CAS's setup form, given a page — a title, the form in one card, and beside it how
   a campaign moves from here */
.np{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:28px 40px; align-items:start}
.np-h{margin:0}
.np-main .lede{margin:10px 0 24px}
.np-card{padding:26px 30px 24px; border-radius:20px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair)}
#plan-host .rsp-body{padding-top:0; gap:22px}
#plan-host .rsp-name{font-size:clamp(24px,2.2vw,30px); letter-spacing:-.018em; padding-bottom:10px}
#plan-host .rsp-sheet textarea{min-height:120px; height:132px}
#plan-host .rsp-ft{margin-top:6px; padding-top:18px; box-shadow:0 -1px 0 var(--ps-hair)}
.np-side{position:sticky; top:84px; display:flex; flex-direction:column; gap:16px}
.np-flow{list-style:none; margin:0; padding:0; position:relative}
.np-flow::before{content:''; position:absolute; left:4px; top:10px; bottom:12px; width:1px; background:var(--ps-line)}
.np-flow li{position:relative; display:grid; grid-template-columns:9px minmax(0,1fr); gap:14px; padding:0 0 16px}
.np-flow li:last-child{padding-bottom:0}
.np-flow li > i{margin-top:5px; width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px var(--ps-card)}
.np-flow b{display:block; font:500 14px/1.3 var(--ps-font)}
.np-flow small{display:block; margin-top:3px; font:400 12.5px/1.45 var(--ps-font); color:var(--ps-ink-2)}
@media (max-width:1060px){ .np{grid-template-columns:minmax(0,1fr)} .np-side{position:static} }
@media (max-width:640px){ .np-card{padding:18px 16px} .pv{padding:10px 16px} .acc-adm{margin-top:-12px} }
/* THE STUDIOS' OWN PAGES, mounted here: CAS's ad set page (share-link.js ArchView), OPS's post page
   (post-flow.js StatusView) and CAS's campaign setup (PlanView). Each host stays in the document once
   mounted, hidden when its route is not on screen, so its own refresh keeps the queue current. */
.mnt{width:100%; max-width:1320px; margin:0 auto; padding:8px 32px 48px; box-sizing:border-box}
.mnt-bk{margin:0 0 8px}
@media (max-width:640px){ .mnt{padding:4px 16px 32px} }
.ft{max-width:1320px; width:100%; margin:auto auto 0; box-sizing:border-box; padding:12px 32px 28px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px;
  font:400 12.5px/1.4 var(--ps-font); color:var(--ps-ink-2)}
.ft a{display:inline-flex; align-items:center; min-height:36px; color:var(--ps-link); text-decoration:none; font-weight:500}
.ft a:hover{text-decoration:underline; text-underline-offset:3px}
@media (max-width:640px){
  .acc-adm{padding:0 16px 32px}
  .ft{padding:12px 16px 24px}
  .it-trk{grid-template-columns:repeat(2,minmax(0,1fr)); padding:18px 16px 0}
  .it-more{grid-template-columns:minmax(0,1fr); padding:18px}
  .qk{padding:20px}
  .dk2{columns:2; column-gap:12px}
  .dk2 > li{margin-bottom:18px}
}
</style>
</head>

<script>
/* The toggle writes the same `provident-theme` key the studios read. */
(function(){
  var btn = document.getElementById('themebtn'), ico = document.getElementById('themeicon');
  function sync(){
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    ico.setAttribute('href', light ? '#i-dark-mode' : '#i-light-mode');
    btn.title = light ? 'Switch to dark' : 'Switch to light';
    btn.setAttribute('aria-label', btn.title);
  }
  btn.addEventListener('click', function(){
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    if (light) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme','light');
    try{ localStorage.setItem('provident-theme', light ? 'dark' : 'light'); }catch(e){}
    sync();
  });
  sync();
})();

/* ONE HOME. Everything here is read from this computer and is optional:
   - provident-inbox-cas / -ops: what each studio last read on Status, already judged for the
     signed-in person (StudioBase.inboxSave). A row: {studio, id, name, mine, ready, open, step,
     sub, segs, steps, verb, due, from, at, thumb, ratio, href}. A field the page needs is added
     to the two writers (inboxCas in share-link.js, inboxOps in post-flow.js), never guessed here;
   - provident-acc-me: the account access.js last confirmed, and access.js itself (home mode);
   - provident-drive-who: the Google account, when nothing else is known;
   - recents in IndexedDB (provident-design-studio, recents:<studio>), never created from here.
   Routes are hash routes: #/ Home, #/status, #/item/<cas|ops>/<id>, #/new, #/access. */
(function(){
  'use strict';
  var CAS = 'Provident%20Campaign%20Studio.dc.html', OPS = 'Provident%20Organic%20Studio.dc.html';
  var STUDIO = {
    cas: { n: 'Campaign ads', long: 'Campaign Ads Studio', a: 1, file: CAS, desc: 'Meta ads in every size', start: '#/new/cas' },
    ops: { n: 'Organic posts', long: 'Organic Post Studio', a: .75, file: OPS, desc: 'Feed and story posts', start: OPS + '#view=new' }
  };
  var ROLE = { designer: 'Designer', admin: 'Designer', pm: 'Performance marketing', smm: 'Social media', ct: 'Content team',
    cten: 'Content team · English', ctar: 'Content team · Arabic' };
  // the board's four columns; each studio's own step names map onto them
  var STAGES = [
    { k: 'new', n: 'New', who: 'Tickets and drafts, waiting for a designer', c: 'var(--ps-dim)' },
    { k: 'design', n: 'Design', who: 'With design', c: 'var(--ps-link)' },
    { k: 'check', n: 'Copy check', who: 'With the content team', c: 'var(--ps-warn)' },
    { k: 'ready', n: 'Ready', who: 'To run or to publish', c: 'var(--ps-good)' }
  ];
  var SC = {}; STAGES.forEach(function(s){ SC[s.k] = s; });

  function $(id){ return document.getElementById(id); }
  function ls(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function js(k){ try { return JSON.parse(ls(k) || 'null'); } catch (e) { return null; } }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function ico(id){ return '<svg class="i" aria-hidden="true"><use href="#g-' + id + '"/></svg>'; }
  function ago(ts){
    if (!ts) return '';
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    var m = Math.round(s / 60); if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60); if (h < 24) return h + ' h ago';
    var d = Math.round(h / 24); if (d < 7) return d === 1 ? 'yesterday' : d + ' days ago';
    return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }
  function initials(n){ var p = String(n || '').trim().split(/[\s.@_-]+/).filter(Boolean); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
  function first(n){ return String(n || '').trim().split(/\s+/)[0] || ''; }
  // due dates are days ('2026-11-04'); late, today, tomorrow and this week read as words
  function due(d){
    if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
    var t = new Date(d + 'T00:00'), now = new Date(); now.setHours(0, 0, 0, 0);
    var n = Math.round((t - now) / 864e5), dm = t.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    if (n < 0) return { n: n, k: 'late', t: 'Overdue since ' + dm };
    if (n === 0) return { n: n, k: 'soon', t: 'Due today' };
    if (n === 1) return { n: n, k: 'soon', t: 'Due tomorrow' };
    if (n < 7) return { n: n, k: '', t: 'Due ' + t.toLocaleDateString(undefined, { weekday: 'long' }) };
    return { n: n, k: '', t: 'Due ' + dm };
  }
  function dueEl(x){ var d = due(x.due); return d ? '<span class="due" data-k="' + d.k + '">' + esc(d.t) + '</span>' : ''; }
  function mk(s){ return '<span class="mk" data-s="' + s + '"><i></i>' + STUDIO[s].n + '</span>'; }
  function rd(x, h, t){
    var a = x.ratio || STUDIO[x.studio].a, st = 'style="--a:' + a + ';--h:' + h + 'px"';
    if (x.thumb && /^data:image\/|^https?:/.test(x.thumb)) return '<span class="rd" ' + st + '><img src="' + esc(x.thumb) + '" alt="" decoding="async"></span>';
    return '<span class="rd" data-none ' + (t ? 'data-t="' + (x.open ? 'Not started yet' : 'No preview yet') + '" ' : '') + st + '></span>';
  }
  function segs(x){
    var s = x.segs || [];
    if (!s.length) return '';
    return '<span class="seg" aria-hidden="true">' + s.map(function(v, i){
      var copy = x.studio === 'ops' ? i === 2 : i === 1 || i === 2;
      return '<i data-s="' + (v === 'done' ? 'done' : v === 'cur' ? (copy ? 'warn' : 'cur') : 'todo') + '"></i>';
    }).join('') + '</span>';
  }
  function stageOf(x){
    if (x.ready) return 'ready';
    if (x.open) return 'new';
    var s = String(x.step || '').toLowerCase();
    if (/ticket|draft/.test(s)) return 'new';
    if (/copy|translation/.test(s)) return 'check';
    if (/ready|done/.test(s)) return 'ready';
    return 'design';
  }

  // ── who is here, and what the studios left ──────────────────────────────────────────────
  var me = js('provident-acc-me'), who = js('provident-drive-who');
  if (!me && who && (who.email || who.name)) me = { email: who.email, name: who.name, role: null };
  var inbox = { cas: js('provident-inbox-cas'), ops: js('provident-inbox-ops') };
  var acc = window.providentAccess, phase = acc && acc.phase ? acc.phase() : 'off';
  var data = null, cur = 0, flip = 0, homeF = 'all', sxF = 'all', sxMine = false, sxQ = '';

  // access.js's answer first (it carries the admin's Preview as), else what it last left here
  function roleOf(){
    var n = acc && acc.now && phase === 'in' ? acc.now() : null;
    if (n && n.role) return n.role;
    return me && me.role ? (me.role === 'cten' || me.role === 'ctar' ? 'ct' : me.role) : null;

      if (solo.length > 1 || (solo.length && solo.length < groups.length)) {
        groups = groups.filter(function(g){ return g.items.length > 1; });
        groups.push({ name: groups.length ? (k === 'cas' ? 'Other campaigns' : 'Other posts') : (k === 'cas' ? 'Campaigns' : 'Posts'), ts: solo[0].ts,
          items: solo.map(function(g){ var it = g.items[0]; return k === 'cas' ? { x: it.x, title: g.name, sub: [it.title === 'Single ad' ? '' : it.title, it.sub].filter(Boolean).join(' \u00b7 ') } : it; }) });
      }
      out += '<section class="pj-s" aria-label="' + STUDIO[k].n + '"><h2>' + mk(k) .replace('class="mk"', 'class="mk" style="font:inherit;color:inherit"') + '<small style="font:400 13px/1 var(--ps-font);color:var(--ps-ink-2)">' + list.length + '</small></h2>' +
        groups.map(function(gr){
          return '<div class="pj-g"><div class="pj-gh"><b>' + esc(gr.name) + '</b><small>' + gr.items.length + (gr.items.length === 1 ? ' project' : ' projects') + ' \u00b7 last saved ' + esc(ago(gr.ts)) + '</small></div>' +
            '<ol class="dk2">' + gr.items.map(function(it){ return tileHtml(it.x, it.title, it.sub); }).join('') + '</ol></div>';
        }).join('') + '</section>';
    });
    host.innerHTML = out;
  }
  function paintDesk(){
    var sec = $('desk'); if (!sec || !deskRows || !deskRows.length) return;
    var show = deskRows.slice(0, DESK_MAX), more = deskRows.length - show.length;
    $('desk-n').textContent = deskRows.length;
    $('reel').innerHTML = show.map(function(x){ return tileHtml(x); }).join('');
    $('desk-more').hidden = !more;
    if (more) $('desk-more').innerHTML = '<span>' + more + ' more saved on this computer.</span><a href="#/projects">See all ' + deskRows.length + ' in Projects</a>';
    studioLinks();
    sec.hidden = false;
  }

  route();
})();
</script>
</body>

<!doctype html>
<html lang="en" data-acc-home>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Provident Design Studio</title>
<meta name="description" content="Provident Design Studio: one home for Campaign ads and Organic posts — what is waiting on you, where everything stands, and the way into each studio.">
<!-- HOME-SCREEN WEB APP (2026-11-26): saved to an iPhone's home screen, PDS opens without the
     browser's bars. The status bar is the system's own ("default": legible in both themes, and
     nothing of ours sits under it); web-app.js tells the stylesheets about the keyboard, the
     scroll position and whether this is the home-screen app. See docs/notes/chrome-and-design-system.md. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PDS">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="app-icon-180.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<script src="./web-app.js"></script>

<!-- SET data-theme BEFORE FIRST PAINT. Light-first, and the key is `provident-theme`, the SAME
     one the studios read, so a choice made here carries into whichever studio opens next. -->
<script>try{ if (localStorage.getItem('provident-theme') !== 'dark')
  document.documentElement.setAttribute('data-theme','light'); }catch(e){}</script>

<!-- THE LANDING PAGE LINKS THE DESIGN SYSTEM RATHER THAN MIRRORING IT: it carries no colour
     literals in JS and is never opened off the disk, so it is a live consumer and cannot drift.
     The kit's @font-face resolves ../_ds/ against the stylesheet, so the real typeface comes with it. -->
<link rel="stylesheet" href="ui-design-system/provident-ui.css">
<!-- ONE HOME: the studios' own code for the work, in the studios' order. studio-base.js supplies
     providentDrive; share-link.js CAS's Status (ad set pages), the campaign setup and the Drive kit;
     access.js in home mode (no gate, sign-in from a click, the admin's panel, the hand-off picker);
     post-flow.js OPS's posts (the Feed and the post page). None of them needs a studio engine for
     what this page mounts; the actions that do (a pick-up, a new design) open the studio. -->
<script src="studio-base.js"></script>
<script src="share-link.js"></script>
<script src="access.js"></script>
<script src="post-flow.js"></script>
<script src="engine.js"></script>
<!-- HELP (2026-11-18): the support page, #/help — the guides each role sees, with captured walkthroughs -->
<script src="help-content.js"></script>
<script src="help.js"></script>

<style>
/* THE HOME (2026-11-02, "one home"). One page for every role over both studios: Home (what is
   waiting on you, from CAS and OPS, and where everything stands), Status (one board), an item page
   per queue row, New (the studio follows the role) and Access (the admin's panel; everyone else
   sees what their role opens). It runs no studio code: it reads what the studios leave on this
   computer — provident-inbox-cas|ops (StudioBase.inboxSave), provident-acc-me (access.js),
   recents in IndexedDB — and every action opens the studio that owns it. Chrome tokens only. */
body{margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--ps-app); color:var(--ps-ink); font-family:var(--ps-font)}
::selection{background:color-mix(in srgb, var(--ps-link) 40%, transparent)}
[hidden]{display:none !important}
.sp{flex:1}
svg.i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--ps-ink); outline-offset:2px}
/* ── the bar: wordmark, the three places, New, the account ── */
.p-top{position:sticky; top:0; z-index:20; gap:14px}
.uh-nav{display:flex; gap:2px; padding:4px; border-radius:var(--ps-pill); background:var(--ps-fill)}
.uh-nav a{display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 16px; border-radius:var(--ps-pill); color:var(--ps-ink-2);
  text-decoration:none; font:600 14px/1 var(--ps-font); letter-spacing:.16px; transition:background-color var(--ps-motion) var(--ps-ease), color var(--ps-motion) var(--ps-ease)}
.uh-nav a:hover{background:var(--ps-fill-h); color:var(--ps-ink)}
.uh-nav a[aria-current="page"]{background:var(--ps-fill-on); color:var(--ps-ink)}
.uh-nav a[hidden]{display:none}
/* MY WORK (2026-11-27): the top bar is the two places on a desktop; the rest is in the account menu.
   A phone keeps its own tab bar and More sheet. */
@media (min-width:641px){ .uh-nav [data-nav="projects"],.uh-nav [data-nav="access"],.uh-nav [data-nav="engine"],.uh-nav [data-nav="help"]{display:none} }
.mn-i .uh-n{margin-left:auto}
.mw{max-width:980px; margin:0 auto; width:100%}
/* ALL WORK: a campaign as Ready and Pending */
.rps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.rp{padding:16px 20px 18px; border-radius:16px; background:var(--ps-card); box-shadow:0 0 0 1px var(--ps-hair)}
.rp[data-mine]{box-shadow:0 0 0 1.5px var(--ps-link)}
.rp-h{display:flex; align-items:center; gap:18px; margin-bottom:12px}
.rp-t{flex:1; min-width:0}
.rp h3{margin:0; font:400 19px/1.25 var(--ps-font); letter-spacing:-.01em}
.rp h3 a{color:var(--ps-ink); text-decoration:none} .rp h3 a:hover{text-decoration:underline; text-underline-offset:3px}
.rp-m{display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; margin:4px 0 0; font-size:13px; color:var(--ps-ink-2)}
.rp-n{flex:none; font-size:13.5px; color:var(--ps-ink-2); white-space:nowrap} .rp-n b{font-weight:500; color:var(--ps-ink)}
.rp-l{display:grid; grid-template-columns:92px minmax(0,1fr); gap:12px; align-items:start; padding:8px 0}
.rp-l + .rp-l{border-top:1px solid var(--ps-hair)}
.rp-k{padding-top:5px; font:500 13px/1.3 var(--ps-font); color:var(--ps-ink)} .rp-k b{font-weight:400; color:var(--ps-ink-2); margin-left:4px}
.rp-l ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.rp-l li{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px 0 9px; border-radius:8px; font-size:13px; color:var(--ps-ink); background:var(--ps-fill)}
.rp-l[data-s="ready"] li{background:var(--ps-good-q)} .rp-l[data-s="ready"] li svg{width:14px; height:14px; color:var(--ps-good); stroke-width:2.4}
.rp-l[data-s="pend"] li i{width:8px; height:8px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--ps-ink-2)}
.rp-q{margin:0; font-size:13.5px; color:var(--ps-ink-2)} .rp-all{padding-top:8px}
@media (max-width:640px){ .rp-h{flex-wrap:wrap; gap:10px} .rp-t{flex-basis:100%} .rp-h .b{margin-left:auto} .rp-l{grid-template-columns:1fr; gap:6px} .rp-k{padding-top:0} }
/* ALL WORK: one table */
.aw-h,.aw a{display:grid; grid-template-columns:52px minmax(0,1.5fr) minmax(0,1.7fr) 86px 150px; gap:18px; align-items:center}
.aw-h{padding:0 18px 8px; font:500 12px/1 var(--ps-font); letter-spacing:.04em; text-transform:uppercase; color:var(--ps-ink-2)}
.aw{list-style:none; margin:0; padding:0; border-radius:16px; background:var(--ps-card); box-shadow:0 0 0 1px var(--ps-hair); overflow:hidden}
.aw a{padding:11px 18px; color:var(--ps-ink); text-decoration:none; font-size:13.5px}
.aw li + li a{border-top:1px solid var(--ps-hair)}
.aw a:hover{background:var(--ps-card-h)} .aw a:focus-visible{outline-offset:-2px}
.aw a[data-mine]{background:var(--ps-tint-1)}
.aw-th{display:flex; justify-content:center}
.aw-n{min-width:0} .aw-n b{display:block; font-weight:500; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.aw-n small{font-size:12.5px; color:var(--ps-ink-2)} .aw-n em{font-style:normal; color:var(--ps-ink)}
.aw-s{display:flex; align-items:center; gap:10px; min-width:0; color:var(--ps-ink-2)} .aw-s > span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .aw-s b{font-weight:500; color:var(--ps-ink)}
.aw-m{color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
@media (max-width:900px){ .aw-h{display:none} .aw a{grid-template-columns:44px minmax(0,1fr) auto; gap:12px; padding:11px 12px} .aw-s,.aw-m{display:none} .aw .rd{--h:36px !important} }
.mw .h1{margin-bottom:24px}
.wks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.wk{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:22px; align-items:center; padding:18px 22px 18px 18px; border-radius:16px; background:var(--ps-card); box-shadow:0 0 0 1px var(--ps-hair)}
.wk-th{display:flex; width:96px; justify-content:center}
.wk-k{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; font-size:13px; color:var(--ps-ink-2)}
.wk h3{margin:4px 0 2px; font:400 20px/1.25 var(--ps-font); letter-spacing:-.01em}
.wk h3 a{color:var(--ps-ink); text-decoration:none} .wk h3 a:hover{text-decoration:underline; text-underline-offset:3px}
.wk-why{margin:0; font-size:14px; line-height:1.45; color:var(--ps-ink-2)} .wk-why b{font-weight:500; color:var(--ps-ink)}
.wk-a{display:flex; flex-direction:column; align-items:stretch; gap:8px}
.mw .oth{margin-top:40px}
@media (max-width:760px){ .wk{grid-template-columns:auto minmax(0,1fr); gap:14px; padding:14px} .wk-th{width:64px; align-self:start} .wk-th .rd{--h:60px !important} .wk-a{grid-column:1 / -1} }
.uh-n{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; box-sizing:border-box; border-radius:var(--ps-pill);
  background:var(--ps-primary); color:var(--ps-primary-i); font:600 11.5px/1 var(--ps-font); font-variant-numeric:tabular-nums}
.uh-me{display:inline-grid; place-items:center; width:36px; height:36px; padding:0; border:0; border-radius:50%; background:var(--ps-fill-on); color:var(--ps-ink);
  font:600 12.5px/1 var(--ps-font); cursor:pointer; transition:box-shadow var(--ps-motion) var(--ps-ease)}
.uh-me:hover{box-shadow:0 0 0 2px var(--ps-line)}
.uh-av{display:inline-grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--ps-fill-on); color:var(--ps-ink);
  font:600 12.5px/1 var(--ps-font); flex:none}
.uh-av[data-sm]{width:24px; height:24px; font-size:10.5px}
.uh-av[data-q]{background:var(--ps-fill); color:var(--ps-ink-2)}
/* the account menu: a ring, not a shadow, like every surface here */
.mn{position:fixed; inset:62px 16px auto auto; margin:0; width:260px; padding:8px; border:0; border-radius:16px; background:var(--ps-card); color:var(--ps-ink);
  box-shadow:inset 0 0 0 1px var(--ps-line), 0 0 0 4px color-mix(in srgb, var(--ps-app) 70%, transparent)}
.mn:popover-open{animation:mnin 200ms cubic-bezier(.16,1,.3,1)}
@keyframes mnin{from{opacity:0; transform:translateY(-6px)}}
.mn-h{display:grid; grid-template-columns:36px minmax(0,1fr); gap:12px; align-items:center; padding:8px 8px 4px}
.mn-h .uh-av{width:36px; height:36px}
.mn-h b{display:block; font:500 14px/1.25 var(--ps-font)}
.mn-h small{display:block; font:400 12.5px/1.3 var(--ps-font); color:var(--ps-ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mn-r{display:inline-flex; align-items:center; height:24px; margin:6px 8px 8px 56px; padding:0 10px; border-radius:var(--ps-pill); background:var(--ps-fill); font:500 12px/1 var(--ps-font); color:var(--ps-ink-2)}
.mn-i{display:flex; align-items:center; width:100%; height:38px; padding:0 10px; border:0; border-radius:10px; background:none; box-sizing:border-box; color:var(--ps-ink);
  font:500 14px/1 var(--ps-font); text-decoration:none; cursor:pointer; text-align:left; transition:background-color var(--ps-motion) var(--ps-ease)}
.mn-i:hover{background:var(--ps-fill)}
.mn-i + .mn-i{margin-top:2px}
.mn a.mn-i{margin-top:2px; box-shadow:0 -1px 0 var(--ps-hair)}
/* buttons: one navy action, the rest quiet */
.b{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; padding:0 16px; border:0; border-radius:var(--ps-pill); cursor:pointer;
  font:600 14px/1 var(--ps-font); letter-spacing:.16px; text-decoration:none; white-space:nowrap;
  transition:background-color var(--ps-motion) var(--ps-ease), color var(--ps-motion) var(--ps-ease), box-shadow var(--ps-motion) var(--ps-ease), transform var(--ps-motion) var(--ps-ease)}
.b:active{transform:translateY(1px)}
.b-p{background:var(--ps-primary); color:var(--ps-primary-i)}
.b-p:hover{background:var(--ps-primary-h)}
.b-g{background:var(--ps-fill); color:var(--ps-ink)}
.b-g:hover{background:var(--ps-fill-h)}
.b-q{background:transparent; color:var(--ps-ink-2)}
.b-q:hover{background:var(--ps-fill); color:var(--ps-ink)}
.b-o{background:transparent; color:var(--ps-ink); box-shadow:inset 0 0 0 1px var(--ps-line)}
.b-o:hover{box-shadow:inset 0 0 0 1px var(--ps-ink-2)}
.b-l{height:auto; padding:0; background:none; color:var(--ps-link); font-weight:500; text-underline-offset:3px}
.b-l:hover{text-decoration:underline}
.b-lg{height:44px; padding:0 20px}
.b svg.i{width:17px; height:17px}

/* ── page frame ── */
.pg{width:100%; max-width:1320px; margin:0 auto; padding:40px 32px 48px; box-sizing:border-box}
.h1{margin:0; font:400 clamp(30px,3.4vw,46px)/1.12 var(--ps-font); letter-spacing:-.028em; color:var(--ps-ink); text-wrap:balance}
.h1 span{display:block; color:var(--ps-ink-2)}
.h2{margin:0; font:400 28px/1.2 var(--ps-font); letter-spacing:-.018em}
.sh{display:flex; align-items:baseline; gap:10px; margin:0 0 12px; font:600 14px/1.3 var(--ps-font); color:var(--ps-ink)}
.sh small{font:400 13px/1.3 var(--ps-font); color:var(--ps-dim); font-variant-numeric:tabular-nums}
.sh .sp{flex:1}
.lede{margin:8px 0 0; font:400 15px/1.5 var(--ps-font); color:var(--ps-ink-2); max-width:62ch}
.pan{padding:18px; border-radius:16px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair)}
.pan > .sh{margin-bottom:14px}
.quiet{padding:22px 24px; border-radius:16px; background:var(--ps-fill)}
.quiet b{display:block; font:500 17px/1.3 var(--ps-font)}
.quiet p{margin:6px 0 0; font:400 14px/1.5 var(--ps-font); color:var(--ps-ink-2); max-width:62ch}

/* the studio mark: the miniature at the studio's own canvas shape, and the hub's tray */
.mk{display:inline-flex; align-items:center; gap:7px; font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap}
.mk i{display:inline-flex; flex-direction:column; justify-content:flex-end; gap:2px; height:14px; aspect-ratio:var(--a,1); box-sizing:border-box; padding:0 2px 3px;
  border-radius:3px; box-shadow:inset 0 0 0 1.25px var(--ps-ink-2)}
.mk i::before,.mk i::after{content:''; display:block; height:1.25px; border-radius:2px; background:var(--ps-ink-2)}
.mk i::before{width:70%} .mk i::after{width:45%}
.mk[data-s="ops"] i{--a:.75}
.mk-h{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px 0 7px; border-radius:var(--ps-pill); background:var(--ps-fill);
  font:500 12px/1 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap}
.mk-h svg.i{width:14px; height:14px}

/* renders: real ones at true shape; a new item has none yet */
.rd{position:relative; flex:none; display:block; height:var(--h,56px); width:calc(var(--h,56px) * var(--a,1)); aspect-ratio:var(--a,1); border-radius:6px; overflow:hidden; background:var(--ps-stage);
  box-shadow:0 0 0 1px var(--ps-hair)}
.rd img{display:block; width:100%; height:100%; object-fit:cover}
.rd[data-none]{background:var(--ps-fill); box-shadow:inset 0 0 0 1px var(--ps-line)}
.rd[data-none]::before{content:''; position:absolute; left:18%; right:18%; bottom:20%; height:2px; border-radius:2px; background:var(--ps-line); box-shadow:0 -6px 0 var(--ps-line)}
.rd[data-none][data-t]::after{content:attr(data-t); position:absolute; inset:0; display:grid; place-items:center; padding:0 12px; text-align:center;
  font:500 13px/1.3 var(--ps-font); color:var(--ps-dim)}

/* step segments: the studio's own steps */
.seg{display:flex; gap:3px}
.seg i{width:14px; height:4px; border-radius:var(--ps-pill); background:var(--ps-line)}
.seg i[data-s="done"]{background:var(--ps-good)}
.seg i[data-s="cur"]{background:var(--ps-link)}
.seg i[data-s="warn"]{background:var(--ps-warn)}
.due{display:inline-flex; align-items:center; gap:6px; font:400 13px/1 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}
.due::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--ps-line)}
.due[data-k="soon"]{color:var(--ps-ink)} .due[data-k="soon"]::before{background:var(--ps-warn)}
.due[data-k="late"]{color:var(--ps-bad)} .due[data-k="late"]::before{background:var(--ps-bad)}

/* ═════ HOME ═════ */
.hm{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:40px 48px; align-items:start}
.hm-main{min-width:0}
.hm-side{display:flex; flex-direction:column; gap:16px; min-width:0; margin-top:33.7px}   /* level with the Next up card, under its heading */
.hm > .sky{grid-column:1/-1; margin-bottom:-8px}   /* 32px to Next up, with the grid's 40px row gap */
/* THE SKY OVER THE GREETING (2026-11-03): the panel's own card colour where the words are, and to
   the right a sky for the time of day — a clear, cloudy 9am, a warmer afternoon, a sunset, a night
   with stars. skyPaint() sets the colours (--s1..3), the sun or moon (--sx, --sy, --sr, --sc), the
   clouds (--co, --cc) and the stars (--st) from the clock, every minute. Dimmed in the dark theme. */
.sky{position:relative; isolation:isolate; overflow:hidden; padding:46px 40px 48px; border-radius:16px; background:var(--ps-card);
  box-shadow:inset 0 0 0 1px var(--ps-hair)}
.sky .h1{position:relative; margin:0}
.sky-l{position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:.92; transition:opacity 600ms ease;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, transparent 26%, rgba(0,0,0,.5) 50%, #000 80%);
  mask-image:linear-gradient(90deg, transparent 0, transparent 26%, rgba(0,0,0,.5) 50%, #000 80%)}
:root:not([data-theme="light"]) .sky-l{opacity:.58}
/* on a pale sky a white cloud needs its shaded underside to show */
:root[data-theme="light"] .sky-c{filter:blur(4px) drop-shadow(0 7px 9px rgba(52,86,140,.26))}
.sky-g{position:absolute; inset:0; background:linear-gradient(180deg, var(--s1) 0%, var(--s2) 58%, var(--s3) 100%); transition:background 1.2s ease}
.sky-st{position:absolute; inset:0; opacity:var(--st,0); transition:opacity 1.2s ease;
  background:radial-gradient(1px 1px at 58% 22%, #fff 70%, transparent), radial-gradient(1.3px 1.3px at 66% 54%, #fff 70%, transparent),
    radial-gradient(1px 1px at 74% 16%, #fff 70%, transparent), radial-gradient(1.4px 1.4px at 81% 40%, #fff 70%, transparent),
    radial-gradient(1px 1px at 88% 70%, #fff 70%, transparent), radial-gradient(1.2px 1.2px at 93% 26%, #fff 70%, transparent),
    radial-gradient(1px 1px at 70% 80%, #fff 70%, transparent), radial-gradient(1px 1px at 62% 64%, #fff 70%, transparent),
    radial-gradient(1.2px 1.2px at 85% 12%, #fff 70%, transparent), radial-gradient(1px 1px at 97% 58%, #fff 70%, transparent)}
.sky-sun{position:absolute; left:var(--sx,80%); top:var(--sy,40%); width:var(--sr,140px); aspect-ratio:1; border-radius:50%; transform:translate(-50%,-50%);
  background:radial-gradient(circle, var(--sc) 0 15%, color-mix(in srgb, var(--sc) 45%, transparent) 24%, color-mix(in srgb, var(--sc) 12%, transparent) 46%, transparent 70%);
  transition:left 1.2s ease, top 1.2s ease, width 1.2s ease}
.sky-c{position:absolute; left:var(--x); top:var(--y); width:var(--w); aspect-ratio:3.2; opacity:calc(var(--co,0) * var(--k,1)); filter:blur(5px);
  background:radial-gradient(42% 62% at 28% 64%, var(--cc) 62%, transparent 64%), radial-gradient(36% 80% at 54% 44%, var(--cc) 62%, transparent 64%),
    radial-gradient(30% 58% at 78% 64%, var(--cc) 62%, transparent 64%);
  transition:opacity 1.2s ease}
/* one entry when the home loads or is opened again, never a loop: the sky fades up, the sun
   settles, the clouds slide in one after another (2026-11-03) */
.sky[data-in] .sky-l{animation:sky-l-in 900ms ease-out both; animation-delay:var(--ent,0ms)}
.sky[data-in] .sky-sun{animation:sky-sun-in 1600ms cubic-bezier(.16,1,.3,1) both; animation-delay:calc(150ms + var(--ent,0ms))}
.sky[data-in] .sky-c{animation:sky-c-in 1700ms cubic-bezier(.16,1,.3,1) both; animation-delay:calc(200ms + var(--i,0) * 110ms + var(--ent,0ms))}
@keyframes sky-l-in{from{opacity:0}}
@keyframes sky-sun-in{from{opacity:0; transform:translate(-50%,-38%) scale(.86)}}
@keyframes sky-c-in{from{opacity:0; transform:translateX(-40px)}}
@media (prefers-reduced-motion:reduce){ .sky[data-in] .sky-l,.sky[data-in] .sky-sun,.sky[data-in] .sky-c{animation:none} }

/* TRACKER (2026-11-20): one row per campaign or post; Launch shows the deliverables EN/AR */
.flt a{display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 13px; border-radius:var(--ps-pill); box-shadow:inset 0 0 0 1px var(--ps-line); color:var(--ps-ink-2); font:500 13px/1 var(--ps-font); text-decoration:none;

.tk-c[data-s="miss"]{color:var(--ps-ink-2); box-shadow:inset 0 0 0 1px var(--ps-line); background:repeating-linear-gradient(135deg, transparent 0 6px, var(--ps-hair) 6px 7px)}

.tk-lbl{font:400 13.5px/1.2 var(--ps-font); color:var(--ps-ink); align-self:center}

@media (max-width:1360px){ .tk-r{grid-template-columns:110px minmax(0,1fr) 180px} .tk-r > .tk-g, .tk-r > .tk-q{grid-column:1 / -1; grid-row:2} .tk-p > div:nth-child(3){grid-column:1 / -1; grid-row:2} }

  .tk-r > .tk-g:not(.tk-gm){display:none} .tk-r > .tk-gm{display:grid; grid-template-columns:minmax(0,1fr) 96px 96px} .tk-gm .tk-hd{text-align:center}
  .tk-gm .tk-c[data-en]{grid-row:auto; grid-column:span 2; flex-direction:row; align-items:center; justify-content:space-between; padding:0 10px} }
.rows{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}

  transition:box-shadow var(--ps-motion) var(--ps-ease), background-color var(--ps-motion) var(--ps-ease), opacity 260ms var(--ps-ease), transform 320ms cubic-bezier(.16,1,.3,1)}

/* side: the board in one panel, the admin's door, your studios */
.flw{list-style:none; margin:4px 0 0; padding:0; position:relative}
/* the line the stages hang on, drawn through the dots */

.flw a{position:relative; display:grid; grid-template-columns:9px minmax(0,1fr) auto 26px; align-items:center; gap:14px; margin:0 -8px; padding:11px 8px; border-radius:10px;

.fl-d{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px var(--ps-card); transition:box-shadow var(--ps-motion) var(--ps-ease)}

.fl-t{display:block; border-radius:5px; transition:transform 220ms cubic-bezier(.16,1,.3,1)}

.flw a:hover .fl-t:nth-child(2){transform:translateX(3px)} .flw a:hover .fl-t:nth-child(3){transform:translateX(6px)} .flw a:hover .fl-t:nth-child(4){transform:translateX(9px)}

.fl-c{font:400 20px/1 var(--ps-font); letter-spacing:-.01em; text-align:right; font-variant-numeric:tabular-nums}

/* ═════ A READY POST'S FILES (social media) ═════ */
.fz-back{margin:0 0 14px -12px}

@media (max-width:640px){ .fz-g{--n:2; --g:12px; grid-template-columns:repeat(2, minmax(0,1fr)); row-gap:18px} }

/* ═════ STATUS: one board, both studios ═════ */
.sx-head{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 24px; margin-bottom:24px}
.sx-tools{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:20px}
.sx-tools .flt{margin:0}
.srch{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:var(--ps-pill); background:var(--ps-fill); color:var(--ps-ink-2); margin-left:auto}
.srch input{width:200px; border:0; background:none; outline:none; color:var(--ps-ink); font:400 14px/1 var(--ps-font)}
.srch input::placeholder{color:var(--ps-dim)}
.srch:focus-within{outline:2px solid var(--ps-ink); outline-offset:2px}
.tg{display:inline-flex; align-items:center; gap:10px; height:36px; padding:0 4px; border:0; background:none; color:var(--ps-ink-2); font:500 13px/1 var(--ps-font); cursor:pointer}
.tg i{position:relative; width:32px; height:20px; border-radius:var(--ps-pill); background:var(--ps-fill-h); transition:background-color var(--ps-motion) var(--ps-ease)}
.tg i::after{content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--ps-ink-2); transition:transform var(--ps-motion) var(--ps-ease), background-color var(--ps-motion) var(--ps-ease)}
.tg[aria-pressed="true"]{color:var(--ps-ink)}
.tg[aria-pressed="true"] i{background:var(--ps-primary)}
.tg[aria-pressed="true"] i::after{transform:translateX(12px); background:var(--ps-primary-i)}
.tg small{margin-left:-4px; font:400 12.5px/1 var(--ps-font); color:var(--ps-dim); font-variant-numeric:tabular-nums}
.bd{display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:8px; scrollbar-width:thin; scrollbar-color:var(--ps-line) transparent}
.col{flex:1 1 0; min-width:200px; max-width:460px; border-radius:16px; background:var(--ps-fill); padding:12px 10px 10px; box-sizing:border-box}
.col-h{display:flex; align-items:center; gap:8px; padding:2px 6px 12px; font:600 14px/1.2 var(--ps-font)}
.col-h > i{width:8px; height:8px; border-radius:50%; background:var(--c,var(--ps-line))}
.col-h small{margin-left:auto; font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
.col-who{display:block; padding:0 6px 10px; margin-top:-6px; font:400 12px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.cds{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.cd{display:block; padding:12px; border-radius:12px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair); color:inherit; text-decoration:none;
  transition:box-shadow var(--ps-motion) var(--ps-ease), transform 200ms cubic-bezier(.16,1,.3,1)}
.cd:hover{box-shadow:inset 0 0 0 1px var(--ps-line); transform:translateY(-1px)}
.cd-g{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start}
.cd .th{align-self:start}
.cd-n{min-width:0}
/* a long name wraps (at its underscores first) and stops at three lines, never past the card */
.cd b{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; margin-top:6px; font:500 14px/1.3 var(--ps-font); color:var(--ps-ink); text-wrap:pretty; overflow-wrap:anywhere}
.cd-st{display:flex; align-items:center; gap:8px; margin-top:8px; font:400 12.5px/1.2 var(--ps-font); color:var(--ps-ink-2)}
/* a signed-off ad set still short of deliverables says so, as Progress does (.tk-short) */
.cd-ms{display:flex; align-items:center; gap:6px; margin-top:6px; font:400 12.5px/1.2 var(--ps-font); color:var(--ps-ink)} .cd-ms i{width:7px; height:7px; border-radius:50%; background:var(--ps-warn); flex:none}
.cd-ft{display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:10px; box-shadow:0 -1px 0 var(--ps-hair)}
.cd-ft .due{margin-left:auto; font-size:12.5px}
.cd[data-mine]{box-shadow:inset 0 0 0 1px var(--ps-link)}
.cd-you{font:500 12px/1 var(--ps-font); color:var(--ps-link); white-space:nowrap}
.cd-ft{flex-wrap:wrap; row-gap:6px}
.col-late{margin-left:auto; font:500 12px/1 var(--ps-font); color:var(--ps-bad)}
.col-late + small{margin-left:8px}
.col-empty{padding:14px 8px; font:400 13px/1.4 var(--ps-font); color:var(--ps-dim); text-align:center}

/* STATUS, ORGANISED (2026-11-18, by request): a second tool row (Filter, the two switches, Overdue,
   Board | List, View), the filters in force as chips, columns that fold to a rail, an Overdue lane,
   a list view and a compact density. Chrome tokens only. */
.sx-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-bottom:14px}
.sx-bar .sp{flex:1}
.pp{position:relative; display:inline-flex}
.pb{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px 0 12px; border:0; border-radius:var(--ps-pill); background:var(--ps-fill); color:var(--ps-ink);
  font:500 13px/1 var(--ps-font); cursor:pointer; white-space:nowrap; transition:background-color var(--ps-motion) var(--ps-ease)}
.pb:hover,.pb[aria-expanded="true"]{background:var(--ps-fill-h)}
.pb svg.i{width:16px; height:16px; color:var(--ps-ink-2)}
.pb small{font:400 12.5px/1 var(--ps-font); color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
.pb .pb-n{display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; box-sizing:border-box; border-radius:var(--ps-pill); background:var(--ps-fill-on); color:var(--ps-ink); font:600 11.5px/1 var(--ps-font)}
.pb .pb-d{width:7px; height:7px; border-radius:50%; background:var(--ps-bad)}
.pb .pb-v{width:14px; height:14px; margin-right:-4px}
.pm{position:absolute; z-index:30; top:42px; left:0; width:264px; max-height:min(70vh,520px); overflow-y:auto; padding:8px; box-sizing:border-box; border-radius:16px; background:var(--ps-card); color:var(--ps-ink);
  box-shadow:inset 0 0 0 1px var(--ps-line), 0 0 0 4px color-mix(in srgb, var(--ps-app) 70%, transparent);
  scrollbar-width:thin; scrollbar-color:var(--ps-line) transparent}
.pm[data-in]{animation:mnin 200ms cubic-bezier(.16,1,.3,1)}   /* on opening only, never on a redraw under a tick */
.pm[data-r]{left:auto; right:0}
.pm-h{margin:0; padding:10px 10px 6px; font:500 12.5px/1.2 var(--ps-font); color:var(--ps-ink-2)}
.pm-h:first-child{padding-top:4px}
.pm-n{margin:0; padding:2px 10px 8px; font:400 12.5px/1.4 var(--ps-font); color:var(--ps-ink-2)}
.po{display:grid; grid-template-columns:18px minmax(0,1fr) auto; align-items:center; gap:10px; width:100%; min-height:36px; padding:6px 10px; border:0; border-radius:10px; background:none; box-sizing:border-box;
  color:var(--ps-ink); font:400 14px/1.25 var(--ps-font); text-align:left; cursor:pointer}
.po:hover{background:var(--ps-fill)}
.po[aria-pressed="true"]{font-weight:500}
.po-c{display:grid; place-items:center; width:18px; height:18px; border-radius:6px; box-shadow:inset 0 0 0 1.5px var(--ps-line)}
.po[data-rd] .po-c{border-radius:50%}
.po[aria-pressed="true"] .po-c{background:var(--ps-fill-on); box-shadow:none}
.po-c svg.i{width:13px; height:13px; stroke-width:2.25}
.po-l{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.po small{font:400 12.5px/1 var(--ps-font); color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
.po-s{display:block; margin-top:2px; font:400 12.5px/1.3 var(--ps-font); color:var(--ps-ink-2); white-space:normal}
.vs{display:inline-flex; padding:3px; border-radius:var(--ps-pill); background:var(--ps-fill)}
.vs button{display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 12px 0 10px; border:0; border-radius:var(--ps-pill); background:none; color:var(--ps-ink-2); font:500 13px/1 var(--ps-font); cursor:pointer}
.vs button svg.i{width:16px; height:16px}
.vs button:hover{color:var(--ps-ink)}
.vs button[aria-pressed="true"]{background:var(--ps-fill-on); color:var(--ps-ink)}
.tk-vs{margin-left:auto}
.tk-vs a{display:inline-flex; align-items:center; height:30px; padding:0 14px; border-radius:var(--ps-pill); color:var(--ps-ink-2); font:500 13px/1 var(--ps-font); text-decoration:none}
.tk-vs a:hover{color:var(--ps-ink)}
.tk-vs a[aria-current]{background:var(--ps-fill-on); color:var(--ps-ink)}
.tk-vs a:focus-visible{outline:2px solid var(--ps-ink); outline-offset:2px}
@media (max-width:760px){ .tk-vs{margin-left:0} }
.sx-act{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin:-2px 0 16px}
.fc{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 6px 0 11px; border:0; border-radius:var(--ps-pill); background:var(--ps-fill-on); color:var(--ps-ink); font:500 12.5px/1 var(--ps-font); cursor:pointer}
.fc svg.i{width:14px; height:14px; padding:2px; box-sizing:content-box; border-radius:50%; color:var(--ps-ink-2)}
.fc:hover svg.i{background:var(--ps-fill-h); color:var(--ps-ink)}
.sx-act .b-l{margin-left:6px; font-size:13px}
.sx-n{margin-left:auto; font:400 12.5px/1 var(--ps-font); color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
.pb:focus-visible,.po:focus-visible,.vs button:focus-visible,.fc:focus-visible,.col-x:focus-visible,.col-r:focus-visible,.lv-gh:focus-visible,.lv-h button:focus-visible,.lr:focus-visible,.cd:focus-visible{outline:2px solid var(--ps-ink); outline-offset:2px}
/* a column folds to a rail: its dot, its count and its name, one click to open it again */
.col-h span.col-t{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.col-h .uh-av{margin:-3px 0}
.col-x{display:inline-grid; place-items:center; width:24px; height:24px; margin:-4px -2px -4px 2px; padding:0; border:0; border-radius:50%; background:none; color:var(--ps-ink-2); cursor:pointer}
.col-x:hover{background:var(--ps-fill-h); color:var(--ps-ink)}
.col-x svg.i{width:15px; height:15px}
.col[data-c]{flex:0 0 44px; min-width:0; padding:0}
.col-r{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; min-height:168px; padding:14px 0 16px; border:0; border-radius:16px; background:none; color:var(--ps-ink); font:600 14px/1 var(--ps-font); cursor:pointer}
.col-r:hover{background:var(--ps-fill-h)}
.col-r > i{width:8px; height:8px; border-radius:50%; background:var(--c,var(--ps-line)); flex:none}
.col-r small{font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
.col-r span{writing-mode:vertical-rl; white-space:nowrap}
.due[data-q]{color:var(--ps-ink-2)}
/* compact cards: the render small, the name on one line, the step and the date on one row */
.bd[data-den="compact"] .cd{padding:8px 10px}
.bd[data-den="compact"] .cd-g{gap:10px; align-items:center}
.bd[data-den="compact"] .cd b{-webkit-line-clamp:1; margin-top:4px; font-size:13.5px}
.bd[data-den="compact"] .cd-st{margin-top:6px; font-size:12px}
.bd[data-den="compact"] .cd-ft{margin-top:6px; padding-top:0; box-shadow:none}
.bd[data-den="compact"] .cd-ft .uh-av{display:none}
.bd[data-den="compact"] .cd-ft .due{margin-left:0; font-size:12px}
.bd[data-den="compact"] .cd-ft:empty{display:none}
.bd[data-den="compact"] .cds{gap:6px}
/* the list: one row a campaign or post, the same groups as the board */
.lv{--cols:minmax(0,1fr) 184px 150px 178px 92px}
.lv-h,.lr{display:grid; grid-template-columns:var(--cols); align-items:center; column-gap:16px}
.lv-h{padding:0 14px 8px; font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2)}
.lv-h button{display:inline-flex; align-items:center; gap:4px; justify-self:start; height:24px; margin-left:-6px; padding:0 6px; border:0; border-radius:8px; background:none; color:inherit; font:inherit; cursor:pointer}
.lv-h button:hover{color:var(--ps-ink); background:var(--ps-fill)}
.lv-h button[aria-pressed="true"]{color:var(--ps-ink)}
.lv-h button svg.i{width:13px; height:13px; visibility:hidden}
.lv-h button[aria-pressed="true"] svg.i{visibility:visible}
.lv-g{margin-bottom:10px; border-radius:16px; background:var(--ps-fill)}
.lv-gh{display:flex; align-items:center; gap:8px; width:100%; height:44px; padding:0 14px 0 10px; border:0; border-radius:16px; background:none; color:var(--ps-ink); font:600 14px/1 var(--ps-font); text-align:left; cursor:pointer}
.lv-gh:hover{background:var(--ps-fill-h)}
.lv-gh svg.i{width:16px; height:16px; color:var(--ps-ink-2); transition:transform var(--ps-motion) var(--ps-ease)}
.lv-gh[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.lv-gh > i{width:8px; height:8px; border-radius:50%; background:var(--c,var(--ps-line))}
.lv-gh small{font:500 12.5px/1 var(--ps-font); color:var(--ps-ink-2); font-variant-numeric:tabular-nums}
.lv-gh em{margin-left:auto; font:400 12.5px/1 var(--ps-font); color:var(--ps-ink-2); font-style:normal}
.lv-g ul{list-style:none; margin:0; padding:0 6px 6px}
.lv-g li + li{margin-top:4px}
.lr{padding:8px; border-radius:12px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair); color:inherit; text-decoration:none; transition:box-shadow var(--ps-motion) var(--ps-ease)}
.lr:hover{box-shadow:inset 0 0 0 1px var(--ps-line)}
.lr[data-mine]{box-shadow:inset 0 0 0 1px var(--ps-link)}
.lr-n{display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:12px; min-width:0}
.lr-n b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:500 14px/1.3 var(--ps-font); color:var(--ps-ink)}
.lr-k{display:flex; align-items:center; gap:10px; margin-top:4px}
.lr-k .mk,.lr-k .mk-h{font-size:12px}
.lr-s,.lr-f{display:flex; align-items:center; gap:8px; min-width:0; font:400 13px/1.2 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap}
.lr-f span:last-child{overflow:hidden; text-overflow:ellipsis}
.lr-0,.lr-u{font:400 13px/1 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}
.lv[data-den="compact"] .lr{padding:5px 8px}
.lv[data-den="compact"] .lr-k{display:none}
.lv[data-den="compact"] .lr-n b{font-size:13.5px}
.lv[data-den="compact"] .lv-g li + li{margin-top:3px}
.sx-none{margin-top:4px}
@media (prefers-reduced-motion:reduce){ .pm[data-in]{animation:none} .lv-gh svg.i{transition:none} }

/* ═════ ITEM: CAS's ad set page carried over — one head card with the step counters, the work as
   tiles, activity with the words that changed, and a rail of team links, details and the brief ═════ */
.bk{display:inline-flex; align-items:center; gap:6px; margin:-8px 0 16px; color:var(--ps-ink-2); text-decoration:none; font:500 14px/1 var(--ps-font); min-height:32px}
.bk:hover{color:var(--ps-ink)}
.it-src{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:12px}
.ih{border-radius:16px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair); overflow:hidden}
.ih-top{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:22px; align-items:center; padding:20px 22px; background:var(--ps-fill)}
.ih-top .rd{--h:96px; border-radius:8px}
.ih-tags{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px}
.ih-tags .chip{height:22px; padding:0 9px; font-size:12px; background:var(--ps-card)}
.ih h1{margin:8px 0 0; font:400 clamp(24px,2.4vw,30px)/1.15 var(--ps-font); letter-spacing:-.018em; text-wrap:balance}
.ih-meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:10px; font:400 13px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.pill{display:inline-flex; align-items:center; gap:7px; height:24px; padding:0 10px 0 9px; border-radius:var(--ps-pill); background:var(--ps-card);
  font:500 12.5px/1 var(--ps-font); color:var(--ps-ink)}
.pill::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--c)}
.it-acts{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; align-self:start}
.it-acts .icb{width:36px; height:36px; background:var(--ps-card); color:var(--ps-ink-2)}
.it-acts .icb:hover{color:var(--ps-ink)}
/* the counters: each step's count, its colour, and how full it is */
.ctr{list-style:none; display:grid; grid-template-columns:repeat(var(--n,4),minmax(0,1fr)); gap:22px; margin:0; padding:22px 22px 0}
.ctr li{display:flex; flex-direction:column; min-width:0}
.ctr span{display:flex; align-items:center; gap:7px; font:400 13px/1.2 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ctr span::before{content:''; flex:none; width:7px; height:7px; border-radius:50%; background:var(--c)}
.ctr li[data-s="cur"] span{color:var(--ps-ink); font-weight:500}
.ctr b{margin:10px 0 12px; font:400 30px/1 var(--ps-font); letter-spacing:-.02em; color:var(--ps-ink); font-variant-numeric:tabular-nums}
.ctr b small{font:400 14px/1 var(--ps-font); color:var(--ps-dim); letter-spacing:0}
.ctr li[data-s="todo"] b{color:var(--ps-dim)}
.ctr i{position:relative; display:block; height:4px; border-radius:var(--ps-pill); background:var(--ps-hair); overflow:hidden}
.ctr i::after{content:''; position:absolute; inset:0; transform:scaleX(var(--f,0)); transform-origin:left; background:var(--c);
  transition:transform 600ms cubic-bezier(.16,1,.3,1)}
.ih-now{display:flex; align-items:center; gap:8px; margin:0; padding:18px 22px 20px; font:400 13.5px/1.45 var(--ps-font); color:var(--ps-ink)}
.ih-now::before{content:''; flex:none; width:7px; height:7px; border-radius:50%; background:var(--c)}
#hc-slot:not(:empty){padding:0 22px 22px}
#hc-slot .hc{margin:0}
.it-b{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; margin-top:24px; align-items:start}
.it-b > div{display:flex; flex-direction:column; gap:16px; min-width:0}
.it-h2{display:flex; align-items:center; gap:10px; margin:6px 0 2px; font:600 14px/1.3 var(--ps-font)}
.it-h2 small{font:400 13px/1.3 var(--ps-font); color:var(--ps-dim)}
.it-h2 .sp{flex:1}
.it-h2 .b{height:32px; padding:0 13px; font-size:13px}
/* NEW: two doors, each showing the shapes it makes with real renders */
.nw-w{max-width:1100px}
.doors{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:32px}
.door{display:flex; flex-direction:column; border-radius:20px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair); color:inherit; text-decoration:none; overflow:hidden;
  transition:box-shadow var(--ps-motion) var(--ps-ease)}
.door:hover{box-shadow:inset 0 0 0 1px var(--ps-line)}
.door-st{position:relative; display:grid; place-items:center; height:236px; box-sizing:border-box; background:var(--ps-fill); overflow:hidden}
/* NEW CHOOSER STAGES (2026-11-03, redesign): each shows what the studio makes, uncropped.
   CAS — a crop guide: ONE real 1:1 design, the 4:5, 9:16 and 1.91:1 canvases drawn round it. */
.cg{position:relative; width:250px; height:208px; flex:none}
.cg-f{position:absolute; box-sizing:border-box; border-radius:5px; box-shadow:inset 0 0 0 1px var(--ps-line); transition:box-shadow 260ms var(--ps-ease), transform 420ms cubic-bezier(.16,1,.3,1)}
.cg-f > b{position:absolute; font:500 10px/1 var(--ps-font); letter-spacing:.02em; color:var(--ps-ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.cg-45{left:57px; top:19px; width:136px; height:170px} .cg-45 > b{left:6px; top:6px}
.cg-916{left:74px; top:13.5px; width:102px; height:181px} .cg-916 > b{left:50%; top:-14px; transform:translateX(-50%)}
.cg-191{left:1px; top:39px; width:248px; height:130px} .cg-191 > b{left:6px; top:7px}
.cg-11{left:65px; top:44px; width:120px; height:120px; border-radius:6px; overflow:visible; box-shadow:0 6px 18px -8px rgba(0,0,0,.55)}
.cg-11 img{display:block; width:100%; height:100%; border-radius:6px; object-fit:cover; box-shadow:0 0 0 1px var(--ps-hair)}
.cg-11 > b{left:calc(100% + 13px); top:50%; transform:translateY(-50%)}
.door:hover .cg-f:not(.cg-11){box-shadow:inset 0 0 0 1px var(--ps-ink-2)}
.door:hover .cg-45{transform:scale(1.03)} .door:hover .cg-916{transform:scale(1.03); transition-delay:40ms} .door:hover .cg-191{transform:scale(1.03); transition-delay:80ms}
.door:hover .cg-11{transform:translateY(-3px)}
/* OPS — a carousel, its pages fanned (feed 3:4), and a story with its design whole (9:16) */
.og{display:flex; align-items:flex-end; gap:34px}
.og-col{display:flex; flex-direction:column; align-items:center; gap:12px}

/* THE ROLE PREVIEW (2026-11-05, /impeccable): one quiet line under the header, not a navy slab:
   an eye, "Viewing as" the person and their role, the one warning, and End preview at the end */
.pv{background:var(--ps-app); box-shadow:0 1px 0 var(--ps-hair)}
.pv-in{display:flex; align-items:center; gap:10px 14px; max-width:1320px; margin:0 auto; padding:10px 32px; box-sizing:border-box; font:400 13.5px/1.3 var(--ps-font); color:var(--ps-ink-2)}
.pv-ic{display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--ps-fill-on); color:var(--ps-ink); flex:none}
.pv-ic svg.i{width:16px; height:16px}
.pv-t{display:inline-flex; align-items:center; gap:8px; min-width:0; flex:none; max-width:60%}
.pv-t .uh-av{width:22px; height:22px; font-size:10px; flex:none}
.pv-t b{font-weight:500; color:var(--ps-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pv-r{padding:4px 9px; border-radius:var(--ps-pill); background:var(--ps-fill); font:500 12px/1 var(--ps-font); color:var(--ps-ink-2); white-space:nowrap}
.pv-n{flex:1 1 auto; min-width:0; color:var(--ps-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pv button{display:inline-flex; align-items:center; gap:6px; height:32px; margin-left:auto; padding:0 14px 0 10px; border:0; border-radius:var(--ps-pill); background:var(--ps-fill); color:var(--ps-ink); font:600 13px/1 var(--ps-font); cursor:pointer; flex:none}
.pv button svg.i{width:15px; height:15px}
.pv button:hover{background:var(--ps-fill-h)}
.pv button:focus-visible{outline:2px solid var(--ps-ink); outline-offset:2px}
@media (max-width:720px){ .pv-in{padding:10px 16px} .pv-n{display:none} .pv-r{display:none} }
/* NEW CAMPAIGN: CAS's setup form, given a page — a title, the form in one card, and beside it how
   a campaign moves from here */
.np{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:28px 40px; align-items:start}
.np-h{margin:0}
.np-main .lede{margin:10px 0 24px}
.np-card{padding:26px 30px 24px; border-radius:20px; background:var(--ps-card); box-shadow:inset 0 0 0 1px var(--ps-hair)}
#plan-host .rsp-body{padding-top:0; gap:22px}
#plan-host .rsp-name{font-size:clamp(24px,2.2vw,30px); letter-spacing:-.018em; padding-bottom:10px}
#plan-host .rsp-sheet textarea{min-height:120px; height:132px}
#plan-host .rsp-ft{margin-top:6px; padding-top:18px; box-shadow:0 -1px 0 var(--ps-hair)}
.np-side{position:sticky; top:84px; display:flex; flex-direction:column; gap:16px}
.np-flow{list-style:none; margin:0; padding:0; position:relative}
.np-flow::before{content:''; position:absolute; left:4px; top:10px; bottom:12px; width:1px; background:var(--ps-line)}
.np-flow li{position:relative; display:grid; grid-template-columns:9px minmax(0,1fr); gap:14px; padding:0 0 16px}
.np-flow li:last-child{padding-bottom:0}
.np-flow li > i{margin-top:5px; width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px var(--ps-card)}
.np-flow b{display:block; font:500 14px/1.3 var(--ps-font)}
.np-flow small{display:block; margin-top:3px; font:400 12.5px/1.45 var(--ps-font); color:var(--ps-ink-2)}
@media (max-width:1060px){ .np{grid-template-columns:minmax(0,1fr)} .np-side{position:static} }
@media (max-width:640px){ .np-card{padding:18px 16px} .pv{padding:10px 16px} .acc-adm{margin-top:-12px} }
/* THE STUDIOS' OWN PAGES, mounted here: CAS's ad set page (share-link.js ArchView), OPS's post page
   (post-flow.js StatusView) and CAS's campaign setup (PlanView). Each host stays in the document once
   mounted, hidden when its route is not on screen, so its own refresh keeps the queue current. */
.mnt{width:100%; max-width:1320px; margin:0 auto; padding:8px 32px 48px; box-sizing:border-box}
/* a post's page carrying the content team's copy check takes the window's width, as CAS's content-team window does */
.mnt:has(.psd-cc){max-width:none}
.mnt-bk{margin:0 0 8px}
@media (max-width:640px){ .mnt{padding:4px 16px 32px} }
.ft{max-width:1320px; width:100%; margin:auto auto 0; box-sizing:border-box; padding:12px 32px 28px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px;
  font:400 12.5px/1.4 var(--ps-font); color:var(--ps-ink-2)}
.ft a{display:inline-flex; align-items:center; min-height:36px; color:var(--ps-link); text-decoration:none; font-weight:500}
.ft a:hover{text-decoration:underline; text-underline-offset:3px}
@media (max-width:640px){
  .acc-adm{padding:0 16px 32px}
  .ft{padding:12px 16px 24px}
  .it-trk{grid-template-columns:repeat(2,minmax(0,1fr)); padding:18px 16px 0}
  .it-more{grid-template-columns:minmax(0,1fr); padding:18px}
  .qk{padding:20px}
  .dk2,.pj-g .dk2{--n:2; --g:12px; grid-template-columns:repeat(2, minmax(0,1fr)); row-gap:18px}
  .dk2[data-st] > li{padding-bottom:18px}
}
/* SAFARI ON A PHONE OR TABLET (2026-11-05). viewport-fit=cover is in the head, so the page keeps
   itself clear of the notch in landscape and the home indicator at the foot (every inset is 0 on a
   desktop); no text inflation on rotation; no grey flash under a tap. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ═════ PHONE (2026-11-21, /impeccable critique of the phone view, 22/40) ═════
   The site was a desktop layout that reflowed. On a phone now: the main nav is a tab bar at the
   foot of the screen (thumb reach, every destination visible, a one-row header that no longer
   follows the page down); every control a finger uses is at least 44px; inputs are 16px so iOS
   does not zoom; Home puts the board before the recent projects; Tracker shows one short row per
   campaign with its deliverables on demand. --tabbar-h tells share-link.js's bottom bars where to sit. */
@media (max-width:640px){
  :root{--tabbar-h:calc(60px + env(safe-area-inset-bottom,0px))}
  .p-top{position:static; flex-wrap:nowrap; padding-top:10px; padding-bottom:10px}
  .uh-nav{position:fixed; left:0; right:0; bottom:0; z-index:60; order:0; width:auto; display:flex; justify-content:space-around; gap:2px;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px)); border-radius:0; background:var(--ps-card); box-shadow:0 -1px 0 var(--ps-line);
    -webkit-mask-image:none; mask-image:none; overflow:visible}
  .uh-nav a{position:relative; flex:1 1 0; min-width:0; height:44px; padding:0 2px; gap:0; justify-content:center; font-size:12px; border-radius:12px; white-space:nowrap}
  .uh-nav a:last-child{margin-right:0}
  .uh-nav .uh-n{position:absolute; top:1px; right:2px; min-width:16px; height:16px; padding:0 4px; font-size:10.5px}
  .pg{padding-bottom:calc(32px + var(--tabbar-h))}
  .ft{padding-bottom:calc(24px + var(--tabbar-h))}
  .pm,.pm[data-r]{bottom:calc(12px + var(--tabbar-h))}
  .tst{bottom:calc(12px + var(--tabbar-h)) !important}
  /* Home: Next up, then what waits on you, then the board; the rest after it */
  .hm{display:flex; flex-direction:column; gap:0}
  .hm > .sky{margin-bottom:28px}
  .eg-toasts{bottom:calc(12px + var(--tabbar-h)) !important}
  .hm-main,.hm-side{display:contents}
  .hm-main > .oth,.hm-main > .fresh,.hm-main > .desk{order:2}
  .hm-side > *{order:3; margin-top:16px}
  .hm-side > .pan:first-child{order:1; margin:28px 0 8px}
  .hm-main > .oth,.hm-main > .desk{margin-top:28px}
  .pan > .sh{flex-wrap:wrap; row-gap:4px}
  /* Next up's step labels fit their bar */
  .nx-steps{gap:4px}
  .nx-steps li span{font-size:12px; line-height:1.2; letter-spacing:0; white-space:normal; overflow-wrap:anywhere}
  /* Tracker: one short row per campaign, deliverables on a tap */
  .tk-r{gap:12px; padding:16px}
  .tk-when{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px}
  .tk-when b{display:inline; margin:0; font-size:14px; font-weight:500; letter-spacing:0}
  .tk-when small{display:inline}
  .tk-who h3{font-size:17px}
  .tk-ms,.tk-xp{display:flex}
  .tk-shw{display:none}
  .tk-r > .tk-gm{display:none}
  .tk-r[data-open] > .tk-gm{display:grid; grid-template-columns:minmax(72px,1fr) minmax(0,88px) minmax(0,88px)}
  .tk-hd,.tk-gm .tk-hd{font-size:12px}
  .tk-side{flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap}
  .tk-side .b{flex:1 1 auto}
  .tk-rd{flex:none}
}
@media (min-width:641px){ .tk-ms,.tk-xp{display:none} }
.tk-ms{align-items:center; gap:8px; margin:0; font:400 14px/1.4 var(--ps-font); color:var(--ps-ink)}
.tk-ms i{width:7px; height:7px; flex:none; border-radius:50%; background:var(--ps-warn)}
.tk-ms[data-ok] i{background:var(--ps-good)}
.tk-xp{align-items:center; justify-content:space-between; width:100%; min-height:44px; padding:0 14px; border:0; border-radius:12px; background:var(--ps-fill); color:var(--ps-ink); font:500 14px/1 var(--ps-font); cursor:pointer}
.tk-xp svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; transition:transform var(--ps-motion) var(--ps-ease)}
.tk-xp[aria-expanded="true"] svg{transform:rotate(180deg)}
.tk-xp:focus-visible{outline:2px solid var(--ps-ink); outline-offset:2px}
/* a finger, not a pointer: 44px targets; text links keep their look and grow an invisible hit area */
@media (pointer:coarse){
  .b,.vs button,.vs a,.flt a,.flt button,.tg,.srch,#themebtn,.uh-me{min-height:44px}
  .b-l{min-height:0}
  #themebtn,.uh-me,#newbtn{min-width:44px; flex:none}
  .icb{width:44px; height:44px}
  .uh-nav a{min-height:40px}
  .srch input,input,textarea,select{font-size:16px}
  .b-l,.fresh a,.desk-more a,.row-t a,.p-wm{position:relative}
  .b-l::after,.fresh a::after,.desk-more a::after,.p-wm::after{content:""; position:absolute; inset:-14px -6px}
  .row-t a::after{content:""; position:absolute; inset:-12px 0}
}
/* ═════ THE HOME-SCREEN APP (2026-11-26, by request: "it needs to act as a native iOS app") ═════
   web-app.js sets data-standalone / data-kb / data-scrolled / data-past / data-sdir on <html>.
   On a phone the header is a 52px glass bar that stays (the page's title takes the wordmark's
   place once the big title has scrolled away), the tab bar is glass with an icon over each word,
   the filter rows stick under the header and fold to their first row on the way down, and the
   groups on Projects and Home fold on a tap. Glass = the bar's own ground at 74% over a blur of
   whatever is passing under it, so the type on it keeps its contrast on any content.
   Every rule is inside a phone or coarse-pointer query: the desktop is untouched. */
.uh-ti,.uh-ttl{display:none}
@media (max-width:640px){
  :root{--uh-h:calc(52px + env(safe-area-inset-top,0px)); --tabbar-h:calc(54px + env(safe-area-inset-bottom,0px));
    --glass:color-mix(in srgb, var(--ps-app) 74%, transparent); --glass-f:saturate(180%) blur(22px)}
  html{scroll-padding-top:calc(var(--uh-h) + 72px)}
  .pg{padding-top:16px}
  .pg[data-in]{animation-duration:220ms}

  /* the header: one glass row */
  .p-top{position:sticky; top:0; z-index:40; height:var(--uh-h); box-sizing:border-box; gap:8px; overflow:visible;
    padding:env(safe-area-inset-top,0px) 12px 0 16px; background:none;
    border-bottom-color:transparent; transition:border-color 180ms var(--ps-ease)}
  /* the glass is a layer BEHIND the bar's content, not the bar itself: a backdrop-filter on
     .p-top would make it the containing block of the fixed tab bar inside it, and the tabs
     would ride at the top of the screen */
  .p-top::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background:var(--glass);
    -webkit-backdrop-filter:var(--glass-f); backdrop-filter:var(--glass-f)}
  :root[data-scrolled] .p-top{border-bottom-color:var(--ps-hair)}
  body:has(.pj-tools,.sx-tools) .p-top{border-bottom-color:transparent}
  .p-top #newbtn,.p-top #themebtn,.p-top .uh-me{width:36px; min-width:36px; height:36px; min-height:36px}
  .p-top .p-wm{transition:opacity 160ms var(--ps-ease), transform 160ms var(--ps-ease)}
  .uh-ttl{display:block; position:absolute; left:16px; right:148px; bottom:0; height:52px; margin:0;
    font:600 17px/52px var(--ps-font); letter-spacing:-.01em; color:var(--ps-ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;
    opacity:0; transform:translateY(8px); transition:opacity 160ms var(--ps-ease), transform 160ms var(--ps-ease)}
  :root[data-past] .uh-ttl:not(:empty){opacity:1; transform:none}
  :root[data-past] .p-top:has(.uh-ttl:not(:empty)) .p-wm{opacity:0; transform:translateY(-8px); pointer-events:none}
  body[data-gate] .uh-ttl{display:none}

  /* the tab bar: glass, an icon over each word, the current one in full ink */
  .uh-nav{height:var(--tabbar-h); box-sizing:border-box; align-items:stretch; gap:0;
    padding:3px 4px env(safe-area-inset-bottom,0px); background:var(--glass);
    -webkit-backdrop-filter:var(--glass-f); backdrop-filter:var(--glass-f); box-shadow:0 -1px 0 var(--ps-hair);
    transition:transform 220ms var(--ps-ease), visibility 0s}
  .uh-nav a{flex-direction:column; height:auto; gap:3px; padding:6px 2px 4px; border-radius:10px;
    font-size:11px; font-weight:500; line-height:1; letter-spacing:.01em; color:var(--ps-dim); background:none}
  .uh-nav a:hover{background:none; color:var(--ps-dim)}
  .uh-nav a[aria-current="page"],.uh-nav a[aria-current="page"]:hover{background:none; color:var(--ps-ink); font-weight:600}
  .uh-ti{display:block; width:23px; height:23px; stroke-width:1.6}
  .uh-nav a[aria-current="page"] .uh-ti{stroke-width:2.1}
  .uh-nav .uh-n{top:2px; right:calc(50% - 24px)}
  /* the keyboard is up: the tab bar stands down */
  :root[data-kb] .uh-nav{transform:translateY(110%); visibility:hidden; transition:transform 220ms var(--ps-ease), visibility 0s 220ms}

  /* the filter rows stick under the header; on the way down only their first row (the chips) stays */
  .pj-tools,.sx-tools{position:sticky; top:var(--uh-h); z-index:30; margin-left:-16px; margin-right:-16px;
    padding:8px 16px; gap:8px; box-sizing:border-box; isolation:isolate}
  /* the fold is a clip, set only while folded: a clip at rest would also clip the Filter sheet,
     which is a fixed child of these tools */
  .pj-tools::before,.sx-tools::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background:var(--glass);
    -webkit-backdrop-filter:var(--glass-f); backdrop-filter:var(--glass-f)}
  .pj-tools{margin-top:12px; margin-bottom:0}
  .sx-tools{margin-bottom:12px}
  .pj-tools .flt,.sx-tools .flt{width:100%; margin:0}
  :root[data-sdir="down"]:not([data-kb]) .pj-tools:not(:focus-within),
  :root[data-sdir="down"]:not([data-kb]) .sx-tools:not(:focus-within):not(:has(.pm)){clip-path:inset(0 0 calc(100% - 60px) 0)}
  :root[data-sdir="down"]:not([data-kb]) .pj-s > h2{top:calc(var(--uh-h) + 60px)}
  .sx-tools:has(.pm){z-index:95}
  .pj-tools::before,.sx-tools::before{background:color-mix(in srgb, var(--ps-app) 88%, transparent) !important}
  .sx-head{margin-bottom:12px; gap:12px 24px}
  .sx-head .lede,.pg > .lede{font-size:14px}

  /* Projects: the studio's heading sticks under the chips, and it and each group fold on a tap */
  .pj-s{margin-top:20px}
  .pj-s > h2{position:sticky; top:calc(var(--uh-h) + var(--tools-h,60px)); z-index:20; transition:top 240ms var(--ps-ease); margin:0 -16px; padding:10px 16px; min-height:44px; box-sizing:border-box;
    background:var(--glass); -webkit-backdrop-filter:var(--glass-f); backdrop-filter:var(--glass-f); cursor:pointer}
  .pj-gh{position:relative; min-height:44px; margin:0 0 10px; padding-right:28px; align-content:center; cursor:pointer}
  .pj-s > h2::after,.pj-gh::after,.hm-side .pan > .sh::after{content:""; flex:none; width:7px; height:7px; margin-left:auto; box-sizing:border-box;
    border-right:1.75px solid var(--ps-dim); border-bottom:1.75px solid var(--ps-dim); transform:translateY(-2px) rotate(45deg);
    transition:transform 180ms var(--ps-ease)}
  .pj-gh::after{position:absolute; right:6px; top:50%; margin-top:-5px}
  .pj-s[data-fold] > h2::after,.pj-g[data-fold] > .pj-gh::after,.hm-side .pan[data-fold] > .sh::after{transform:translateX(-2px) rotate(-45deg)}
  .pj-s[data-fold] > :not(h2),.pj-g[data-fold] > :not(.pj-gh),.hm-side .pan[data-fold] > :not(.sh){display:none}
  .pj-g[data-fold] > .pj-gh{margin-bottom:0}
  .hm-side .pan > .sh{cursor:pointer; align-items:center; min-height:28px}
  .hm-side .pan[data-fold] > .sh{margin-bottom:0}
  .hm-side .pan{padding:14px 16px}
  [data-foldh]{position:relative}
  .fold-b{position:absolute; inset:0; z-index:1; width:100%; margin:0; padding:0; border:0; border-radius:8px; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .fold-b:focus-visible{outline:2px solid var(--ps-ink); outline-offset:2px}
  [data-foldh] a,[data-foldh] button:not(.fold-b){position:relative; z-index:2}

  /* the stacked tiles: the 2px packing rows carry no gap of their own (a phone rule gave each
     of them 18px, and twelve projects made a page 23,000px long) */
  .dk2[data-st],.pj-g .dk2[data-st]{row-gap:0}

  /* compact: the greeting and the cards give the first screen back to the work */
  .sky{min-height:0}
  .hm > .sky{margin-bottom:20px}
  .qk{padding:16px}
}
/* a finger gets an answer the moment it lands; nothing on the chrome selects or calls out */
@media (pointer:coarse){
  html{touch-action:manipulation}
  .p-top,.uh-nav,.b,.flt,.vs,.pb,.tg,.tk-xp,.sh,.pj-gh,.pj-s > h2{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  .b,.flt button,.flt a,.vs a,.vs button,.pb,.tk-xp,.st,.door,.uh-nav a,#themebtn,.uh-me,.icb,.dk2 > li > a{
    transition:transform 90ms var(--ps-ease), opacity 90ms var(--ps-ease), background-color 120ms var(--ps-ease), color 120ms var(--ps-ease)}
  .b:active,.flt button:active,.flt a:active,.vs a:active,.vs button:active,.pb:active,.tk-xp:active,#themebtn:active,.uh-me:active,.icb:active{transform:scale(.96); opacity:.82}
  .uh-nav a:active{transform:scale(.92); opacity:.7}
  .st:active,.door:active,.dk2 > li > a:active{transform:scale(.985); opacity:.86}
}
@media (prefers-reduced-motion:reduce){ .p-top .p-wm,.uh-ttl,.uh-nav,.pj-tools,.sx-tools,.sht-p,.sht-s{transition:none} }
/* ═════ THE PHONE, SECOND PASS (2026-11-26, /impeccable critique: 20/40) ═════
   Four tabs: Home, Tracker, Projects, More (Access, Engine, Help, appearance and the account
   live in More's sheet, so the header keeps only New). New is a sheet; a pushed page has a back
   button; no footer; Home, Tracker and Projects put the work before the furniture. */
.uh-more,.uh-back{display:none}
.sht[hidden]{display:none !important}
@media (max-width:640px){
  /* the header: back or wordmark, then New; the theme and the account went into More */
  .p-top #themebtn,.p-top #meav,.p-top .mn{display:none}
  .p-top #newbtn{width:44px; min-width:44px; height:44px; min-height:44px; border-radius:50%}
  .uh-back{display:inline-flex; align-items:center; gap:2px; height:44px; margin-left:-10px; padding:0 8px 0 2px; color:var(--ps-ink);
    font:400 17px/1 var(--ps-font); text-decoration:none; letter-spacing:-.01em}
  .uh-back svg.i{width:24px; height:24px; stroke-width:2}
  .uh-back[hidden]{display:none}
  .p-top:has(.uh-back:not([hidden])) .p-wm{display:none}
  .p-top:has(.uh-back:not([hidden])) .uh-ttl{left:120px; right:64px; text-align:center}
  :root[data-past] .p-top:has(.uh-back:not([hidden])) .uh-back{opacity:1}
  .pg .bk,.mnt-bk{display:none}
  .uh-ttl{right:72px}
  /* four tabs */
  .uh-nav [data-nav="access"],.uh-nav [data-nav="engine"],.uh-nav [data-nav="help"]{display:none !important}
  .uh-more{display:flex; position:relative; flex:1 1 0; min-width:0; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 2px 4px;
    border:0; border-radius:10px; background:none; color:var(--ps-dim); font:500 11px/1 var(--ps-font); letter-spacing:.01em; cursor:pointer}
  .uh-more[aria-current="page"]{color:var(--ps-ink); font-weight:600}
  .uh-more[aria-current="page"] .uh-ti{stroke-width:2.1}
  .uh-more .uh-n{position:absolute; top:2px; right:calc(50% - 24px)}
  .uh-nav a{font-size:11px}
  .ft{display:none}
  .pg{padding-bottom:calc(24px + var(--tabbar-h))}

  /* the sheet */
  .sht{position:fixed; inset:0; z-index:90}
  .sht-s{position:absolute; inset:0; background:rgba(8,10,14,.34); opacity:0; transition:opacity 300ms var(--ps-ease)}
  .sht[data-on] .sht-s{opacity:1}
  .sht-p{position:absolute; left:0; right:0; bottom:0; max-height:calc(100dvh - 44px); overflow-y:auto; overscroll-behavior:contain; box-sizing:border-box; outline:none;

/* ═════ THE FLOATING TAB BAR (2026-11-26, by request: "make them icons only, then a floating
   rounded corner container") ═════
   On a phone the four tabs are icons in a glass capsule that floats 10px over the foot of the
   page (and the home indicator), as iOS's own tab bars now do. The words stay in the markup for
   VoiceOver and as each tab's name (font-size 0 hides them, it does not remove them). The page
   scrolls under the capsule; --tabbar-h is the room it takes, so everything that sits above the
   tab bar (toasts, the send receipt, the Filter sheet's lift) follows. */
@media (max-width:640px){
  :root{--tabbar-h:calc(56px + 10px + max(10px, env(safe-area-inset-bottom,0px)))}
  .uh-nav{left:max(16px, env(safe-area-inset-left,0px)); right:max(16px, env(safe-area-inset-right,0px));
    bottom:max(10px, env(safe-area-inset-bottom,0px)); width:auto; height:56px; padding:5px; gap:2px; align-items:stretch;
    border-radius:28px; background:color-mix(in srgb, var(--ps-app) 72%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px);
    box-shadow:inset 0 0 0 1px var(--ps-hair), 0 8px 28px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08)}
  :root:not([data-theme="light"]) .uh-nav{box-shadow:inset 0 0 0 1px var(--ps-line), 0 8px 28px rgba(0,0,0,.45)}
  .uh-nav a,.uh-more{flex:1 1 0; height:46px; min-height:46px; padding:0; gap:0; border-radius:23px;
    font-size:0; letter-spacing:0; color:var(--ps-dim); justify-content:center; align-items:center}
  .uh-nav a[aria-current="page"],.uh-more[aria-current="page"]{background:var(--ps-fill); color:var(--ps-ink)}
  .uh-nav .uh-ti{width:25px; height:25px; stroke-width:1.7}
  .uh-nav a[aria-current="page"] .uh-ti,.uh-more[aria-current="page"] .uh-ti{stroke-width:2.1}
  .uh-nav .uh-n,.uh-more .uh-n{top:4px; right:calc(50% - 22px); font-size:10.5px}
  :root[data-kb] .uh-nav{transform:translateY(calc(100% + 40px))}
}

/* ═════ COMPACT CONTROLS, iOS STYLE (2026-11-26, by request: "more compactness and more iOS style
   layout for these long menus … go and find menus like this and change") ═════
   One pattern for every long stack of controls on a phone: a 38px search field with a 38px round
   button at its end (Filter on Tracker, Open on Projects), then a 32px segmented control.
   Tracker went from four rows (~300px) to two (~94px); Projects from three to two; Access's tabs
   and Help's studio switch are the same segmented control. The rest lives in sheets. */
@media (max-width:640px){
  .sx-ph,.pj-ph{display:flex; flex-direction:column; flex-wrap:nowrap; gap:8px; padding:8px 16px 10px}

  .sx-row .srch svg.i{width:17px; height:17px}
  .sx-row .srch input{font-size:16px}
  .sx-row .pp{position:static; flex:none}
  .sx-fb{position:relative; width:38px; min-width:38px; height:38px; min-height:38px; padding:0; justify-content:center; border-radius:50%; gap:0}
  .sx-fb svg.i{width:19px; height:19px}
  .sx-fb[data-on]{background:var(--ps-ink); color:var(--ps-app)}
  .sx-fb .pb-n{position:absolute; top:-3px; right:-3px; min-width:17px; height:17px; padding:0 4px; box-sizing:border-box; border-radius:9px;
    background:var(--ps-warn); color:#141210; font:600 10.5px/17px var(--ps-font); text-align:center; box-shadow:0 0 0 2px var(--ps-app)}
  /* the segmented control */
  .sx-seg,.pj-ph .flt,.ac .ac-tabs,.hp-sw{display:flex !important; width:100%; box-sizing:border-box; gap:2px; padding:2px; margin:0; overflow:visible;
    border-radius:9px; background:var(--ps-fill); flex-wrap:nowrap}
  .sx-seg button,.pj-ph .flt button,.ac .ac-tabs button,.hp-sw button{flex:1 1 0; min-width:0; height:32px; min-height:32px; padding:0 6px; gap:4px;
    justify-content:center; border:0; border-radius:7px; background:none; box-shadow:none; color:var(--ps-ink-2);
    font:500 13px/1 var(--ps-font); letter-spacing:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sx-seg button[aria-pressed="true"],.pj-ph .flt button[aria-pressed="true"],.ac .ac-tabs button[data-on],.hp-sw button[aria-selected="true"]{

  .pj-ph .flt button small,.hp-sw button s{font-size:11.5px; color:var(--ps-dim); text-decoration:none}
  body .hp-sw button s,body .hp-sw button[aria-selected="true"] s{min-width:0; height:auto; padding:0; margin:0; background:none; box-shadow:none; font:500 11.5px/1 var(--ps-font); color:var(--ps-dim)}

  :root[data-sdir="down"]:not([data-kb]) .pj-ph:not(:focus-within){clip-path:inset(0 0 calc(100% - 56px) 0)}

  /* the Filter and view sheet */

    padding:0 16px calc(20px + env(safe-area-inset-bottom,0px)); border-radius:20px 20px 0 0; background:var(--ps-app); box-shadow:0 -10px 40px rgba(0,0,0,.18)}

  .pm-top b{font:600 17px/1.2 var(--ps-font); color:var(--ps-ink)}
  .pm-a{height:36px; padding:0 10px; border:0; border-radius:8px; background:none; color:var(--ps-link); font:400 16px/1 var(--ps-font); cursor:pointer}
  .pm-done{font-weight:600}
  .pm-sh .pm-h{padding:16px 4px 6px; font:500 13px/1.2 var(--ps-font); color:var(--ps-dim); text-transform:none}
  .pm-sh .po{min-height:44px; padding:8px 6px; font-size:16px}
  .pm-sh .po small{font-size:13px}
  .pm-g{margin:6px 0 0; border-radius:12px; background:var(--ps-fill); overflow:hidden}
  .pm-sw{display:flex; align-items:center; gap:12px; width:100%; min-height:50px; box-sizing:border-box; padding:6px 14px; border:0; background:none; color:var(--ps-ink);
    text-align:left; font:400 16px/1.25 var(--ps-font); cursor:pointer; position:relative}
  .pm-sw + .pm-sw::before{content:""; position:absolute; top:0; left:14px; right:0; height:1px; background:var(--ps-line)}
  .pm-sw .po-l{flex:1; min-width:0}
  .pm-sw .po-s{display:block; margin-top:2px; font-size:13px; color:var(--ps-dim)}
  .pm-sw i{position:relative; flex:none; width:51px; height:31px; border-radius:16px; background:var(--ps-fill-h); transition:background-color 200ms var(--ps-ease)}
  .pm-sw i::after{content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.2); transition:transform 220ms var(--ps-ease)}
  .pm-sw[aria-checked="true"] i{background:var(--ps-good)}
  .pm-sw[aria-checked="true"] i::after{transform:translateX(20px)}
  .pm-seg{display:flex; gap:2px; padding:2px; border-radius:9px; background:var(--ps-fill)}
  .pm-seg button{flex:1; height:32px; border:0; border-radius:7px; background:none; color:var(--ps-ink-2); font:500 13px/1 var(--ps-font); cursor:pointer}
  .pm-seg button[aria-pressed="true"]{background:var(--ps-app); color:var(--ps-ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
  :root:not([data-theme="light"]) .pm-seg button[aria-pressed="true"]{background:var(--ps-fill-h)}
  /* the page title and its view switch: the switch is a compact segmented control too */
  .sx-head .vs{height:auto; padding:2px; gap:2px; border-radius:9px}
  .sx-head .vs a{height:30px; min-height:30px; padding:0 12px; border-radius:7px; font-size:13px}

  :root:not([data-theme="light"]) .sx-head .vs a[aria-current="page"]{background:var(--ps-fill-h)}
  /* Help: the search first, the studio switch under it, both stuck under the bar */
  .hp-bar{position:sticky; top:var(--uh-h); flex-direction:column; align-items:stretch; gap:8px; margin:0 -16px 20px; padding:8px 16px 10px}
  .hp-bar .hp-q{order:-1; flex:none; width:100%; min-width:0; height:38px; margin:0; border-radius:11px}
  .hp-bar .hp-q input{font-size:16px}
  /* Access: the preview picker is a quiet row, not a second big pill */

  // ═════ THE SKY: the greeting panel's time of day ═════
  // [x %, y %, width px, how much of the cloud cover it takes]

  // a project's saved name carries its format as a file prefix (Carousel_, Reel_ …): the tile shows

  function recName(n){

  }
  var DESK_MAX = 8;
  function tileHtml(x, title, sub){
    var r = x.r, st = STUDIO[x.k], pid = r.pid || r.state.pid, nm = recName(r.name), th = (r.thumbs || []).filter(function(t){ return /^data:image\//.test(t || ''); });

      '<span class="rc-st">' + (th[0] ? '<img src="' + th[0] + '" alt="" decoding="async">' : '') + '</span>' +
      '<b>' + esc(title || nm.name) + '</b><small>' + (sub ? '<span>' + esc(sub) + '</span>' : mk(x.k)) + (tag ? '<span aria-hidden="true">\u00b7</span><span>' + esc(tag) + '</span>' : '') + '<span aria-hidden="true">\u00b7</span>' + esc(ago(r.ts || 0)) + '</small></a></li>';
  }
  // the pinboard: each tile spans as many 2px rows as it is tall — again as each picture loads,

  // the home's Your studios: each opens on its newest saved project, else on starting one

      if (!x) return;

  }

  // ═════ PROJECTS ═════
  var pjF = 'all', pjQ = '';
  function viewProjects(){
    var r = data.r, ks = designs(); void r;
    if (!ks.length) return '<h1 class="h1">Projects</h1><div class="qk pj-none"><span class="qk-o" data-k="info">' + ico('tray') + '</span><div><h3>No projects for your role</h3><p>Your work comes to you as review links and on My work.</p></div></div>';
    return '<h1 class="h1">Projects</h1><p class="lede">Every project saved on this computer, newest first. Open one to keep designing.</p>' +
      (phoneQ() ? '<div class="pj-tools pj-ph"><div class="sx-row"><label class="srch">' + ico('search') + '<input id="pj-q" type="search" placeholder="Find by name" value="' + esc(pjQ) + '" aria-label="Find a project by name" enterkeyhint="search"></label>' +
        '<button class="pb sx-fb" type="button" data-pjopen aria-label="Open a file">' + ico('folder') + '</button></div>' +
        (ks.length > 1 ? '<div class="flt" role="group" aria-label="Show" id="pj-f"></div>' : '') + '</div>' +
        '<div id="pj"><div class="gt-busy"><i></i>Reading this computer\u2019s projects\u2026</div></div>' : '') +
      (phoneQ() ? '' : '<div class="pj-tools">' + (ks.length > 1 ? '<div class="flt" role="group" aria-label="Show" id="pj-f"></div>' : '') +
        '<div class="pj-open">' + ks.map(function(k){ return '<a class="b b-g" href="' + STUDIO[k].file + '#view=open">' + ico('out') + (k === 'cas' ? 'Open a project file' : 'Open a post file') + '</a>'; }).join('') + '</div>' +
        '<label class="srch">' + ico('search') + '<input id="pj-q" type="search" placeholder="Find by name" value="' + esc(pjQ) + '" aria-label="Find a project by name"></label></div>' +
      '<div id="pj"><div class="gt-busy"><i></i>Reading this computer\u2019s projects\u2026</div></div>');
  }
  function paintProjects(){
    var host = $('pj'); if (!host) return;
    var r = data.r, ks = designs(); void r;
    var rows = (deskRows || []).filter(function(x){ return ks.indexOf(x.k) >= 0; });
    var cnt = { all: rows.length, cas: 0, ops: 0 }; rows.forEach(function(x){ cnt[x.k]++; });
    var f = $('pj-f'); if (f) f.innerHTML = [['all','Everything'], ['cas','Campaign ads'], ['ops','Organic posts']].map(function(o){ return '<button type="button" data-pf="' + o[0] + '" aria-pressed="' + (pjF === o[0]) + '">' + o[1] + ' <small>' + cnt[o[0]] + '</small></button>'; }).join('');
    var q = pjQ.toLowerCase();
    rows = rows.filter(function(x){ return (pjF === 'all' || pjF === x.k) && (!q || String(x.r.name || '').toLowerCase().indexOf(q) >= 0); });
    if (!rows.length) { host.innerHTML = '<div class="qk pj-none"><span class="qk-o" data-k="info">' + ico('tray') + '</span><div><h3>' + (q || pjF !== 'all' ? 'Nothing matches' : 'Nothing saved on this computer yet') + '</h3><p>' + (q || pjF !== 'all' ? 'Try another name, or show everything.' : 'A project shows here once it is saved in a studio. Start one from New.') + '</p></div></div>'; return; }
    var out = '';
    ['cas', 'ops'].forEach(function(k){
      var list = rows.filter(function(x){ return x.k === k; }); if (!list.length) return;
      var groups = [], by = {};
      list.forEach(function(x){
        var nm = String(x.r.name || 'Untitled').trim(), g, title = '', sub = '';
        if (k === 'cas') {
          var rs = null, pid = x.r.pid || x.r.state.pid; try { rs = JSON.parse(localStorage.getItem('provident-rs-pid:' + pid) || 'null'); } catch (e) {}
          var cut = nm.indexOf(' - '), camp = (rs && rs.name) || (cut > 0 ? nm.slice(0, cut) : nm);
          var rest = nm.toLowerCase().indexOf(camp.toLowerCase() + ' - ') === 0 ? nm.slice(camp.length + 3) : (camp === nm ? '' : nm);
          var m = rest.match(/\s*\(([^)]+)\)\s*$/); if (m) rest = rest.slice(0, m.index);
          g = camp; title = rest.trim() || 'Single ad'; sub = m ? m[1] : '';

        var key = g.toLowerCase(); if (!by[key]) { by[key] = { name: g, items: [], ts: 0 }; groups.push(by[key]); }

      });

      var solo = groups.filter(function(g){ return g.items.length === 1; });

          items: solo.map(function(g){ var it = g.items[0]; return k === 'cas' ? { x: it.x, title: g.name, sub: [it.title === 'Single ad' ? '' : it.title, it.sub].filter(Boolean).join(' \u00b7 ') } : it; }) });
      }

        groups.map(function(gr){

  function paintDesk(){

  // PDS AS A CHROME APP (2026-11-27): Chrome installs it from manifest.json into its own window

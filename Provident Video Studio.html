<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASV · Provident Video Studio</title>
<!-- PROTOTYPE (branch video-studio, local only). A standalone page: it links the chrome kit
     directly, so tokens, buttons, fields and the typeface come from ui-design-system/. The
     artwork (the canvas) reads the ART literals in video-studio.js and never a chrome token. -->
<link rel="stylesheet" href="ui-design-system/provident-ui.css">
<link rel="stylesheet" href="video-preview.css">
<style>
html,body{height:100%;margin:0}
body{background:var(--ps-app);color:var(--ps-ink);font-family:var(--ps-font);font-weight:300;font-size:13px;
  display:grid;grid-template-rows:55px minmax(0,1fr) auto;overflow:hidden}
button{font-family:inherit}
.vs-i{display:inline-flex;width:18px;height:18px;flex:none}
.vs-i svg{width:100%;height:100%;fill:currentColor}
.vs-name{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ps-dim);white-space:nowrap}
.vs-sp{flex:1}
.p-top{overflow:visible}

/* main row */
.vs-main{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;min-height:0}
.vs-rail{background:var(--ps-app);min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.vs-rail.l{border-right:1px solid var(--ps-hair)}
.vs-rail.r{border-left:1px solid var(--ps-hair)}
.vs-tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--ps-hair);position:sticky;top:0;background:var(--ps-app);z-index:2}
.vs-tabs button{flex:1;height:30px;border:0;border-radius:var(--ps-pill);background:transparent;color:var(--ps-ink-2);font-size:12px;cursor:pointer}
.vs-tabs button:hover{background:var(--ps-fill)}
.vs-tabs button[data-on]{background:var(--ps-accent);color:var(--ps-accent-i)}
.vs-sec{padding:14px 16px;border-bottom:1px solid var(--ps-hair);display:flex;flex-direction:column;gap:10px}
.vs-sec:last-child{border-bottom:0}
.vs-h{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ps-dim)}
.vs-note{font-size:12px;line-height:1.45;color:var(--ps-dim)}
.vs-drop{border:1px dashed var(--ps-line);border-radius:var(--ps-r-drop);padding:16px 12px;text-align:center;color:var(--ps-ink-2);
  cursor:pointer;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;width:100%}
.vs-drop:hover,.vs-drop[data-over]{background:var(--ps-fill);border-color:var(--ps-focus)}
.vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs-tile{position:relative;border:1px solid var(--ps-hair);border-radius:var(--ps-r-sm);background:var(--ps-fill) center/cover no-repeat;
  aspect-ratio:1;cursor:pointer;padding:0;overflow:hidden;color:var(--ps-ink)}
.vs-tile:hover{border-color:var(--ps-focus)}
.vs-tile b{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;font-weight:300;color:#fff;text-align:left;
  background:linear-gradient(transparent,rgba(0,0,0,.72));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-tile s{position:absolute;top:5px;left:5px;text-decoration:none;font-size:10px;padding:2px 6px;border-radius:var(--ps-pill);background:rgba(0,0,0,.6);color:#fff}
.vs-x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;
  display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
.vs-x .vs-i{width:14px;height:14px}
.vs-tile:hover .vs-x,.vs-lg:hover .vs-x,.vs-arow:hover .vs-x{display:flex}
.vs-arow{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--ps-hair);border-radius:var(--ps-r-sm)}
.vs-arow .n{flex:1;min-width:0}
.vs-arow .n b{display:block;font-weight:300;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-arow .n s{text-decoration:none;font-size:11px;color:var(--ps-dim)}
.vs-arow .vs-x{position:static;background:var(--ps-fill);color:var(--ps-ink)}
.vs-row{display:flex;gap:6px;flex-wrap:wrap}
.vs-row > *{flex:1}
.vs-pre{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--ps-hair);
  border-radius:var(--ps-r-sm);background:transparent;color:var(--ps-ink);cursor:pointer}
.vs-pre:hover{background:var(--ps-fill);border-color:var(--ps-focus)}
.vs-pre b{font-weight:400;font-size:13px}
.vs-pre s{text-decoration:none;font-size:11px;color:var(--ps-dim)}
/* developer logo tiles: each mark is a MASK in the chrome ink, so white and dark files both read */
.vs-lgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vs-lg{position:relative;height:46px;border:1px solid var(--ps-hair);border-radius:var(--ps-r-sm);background:var(--ps-fill);cursor:pointer;
  padding:0;color:var(--ps-ink);display:flex;align-items:center;justify-content:center;font-size:11px}
.vs-lg:hover{border-color:var(--ps-focus)}
.vs-lg[data-on]{background:var(--ps-fill-on);border-color:var(--ps-focus);box-shadow:0 0 0 1px var(--ps-focus)}
.vs-lg i.m{position:absolute;inset:9px 8px;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}

/* fields */
.vs-f{display:flex;flex-direction:column;gap:6px}
.vs-f > label{display:flex;justify-content:space-between;font-size:12px;color:var(--ps-ink-2)}
.vs-f > label s{text-decoration:none;color:var(--ps-dim)}
.vs-f textarea.p-in{height:auto;min-height:64px;resize:vertical;padding:8px 10px;line-height:1.35;border-radius:var(--ps-r-field)}
.vs-f input[type=range]{width:100%;accent-color:var(--ps-link);margin:0}
.vs-seg{display:flex;gap:2px;padding:2px;border-radius:var(--ps-pill);background:var(--ps-fill)}
.vs-seg button{flex:1;height:28px;border:0;border-radius:var(--ps-pill);background:transparent;color:var(--ps-ink-2);font-size:12px;cursor:pointer;padding:0 8px;white-space:nowrap}
.vs-seg button:hover{color:var(--ps-ink)}
.vs-seg button[data-on]{background:var(--ps-accent);color:var(--ps-accent-i)}
.vs-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* stage */
.vs-stage{background:var(--ps-stage);min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.vs-cvw{min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
#cv{display:block;background:#000;border-radius:6px;touch-action:none;box-shadow:0 0 0 1px var(--ps-hair)}
.vs-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;color:var(--ps-ink-2);text-align:center}
.vs-empty b{font-weight:400;font-size:18px;color:var(--ps-ink)}
.vs-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--ps-app);border-top:1px solid var(--ps-hair)}
.vs-ib{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--ps-ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.vs-ib:hover{background:var(--ps-fill)}
.vs-ib:disabled{opacity:.35;cursor:default;background:transparent}
.vs-ib[aria-pressed=true]{background:var(--ps-fill-on);color:var(--ps-ink)}
.vs-ib.p{background:var(--ps-primary);color:var(--ps-primary-i);width:38px;height:38px}
.vs-ib.p .vs-i{width:22px;height:22px}
.vs-time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ps-ink);min-width:132px;text-align:center}
.vs-time s{text-decoration:none;color:var(--ps-dim)}
.vs-sep{width:1px;height:20px;background:var(--ps-hair);margin:0 6px}
.vs-zoom{width:110px;accent-color:var(--ps-link)}

/* timeline */
.vs-tl{height:clamp(170px,32vh,262px);background:var(--ps-app);border-top:1px solid var(--ps-hair);overflow:auto;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.vs-tl-in{position:relative;min-width:100%;min-height:100%}
.vs-ruler{height:30px;position:relative;border-bottom:1px solid var(--ps-hair);cursor:ew-resize}
.vs-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--ps-hair);padding-left:4px;font-size:10px;color:var(--ps-dim);line-height:28px;font-variant-numeric:tabular-nums}
.vs-trk{position:relative;border-bottom:1px solid var(--ps-hair)}
.vs-trk-l{position:sticky;left:0;z-index:3;width:92px;height:100%;display:flex;align-items:center;gap:6px;padding:0 10px;box-sizing:border-box;
  background:var(--ps-app);border-right:1px solid var(--ps-hair);font-size:11px;color:var(--ps-ink-2)}
.vs-trk-l .vs-i{width:15px;height:15px;color:var(--ps-dim)}
.vs-it{position:absolute;height:30px;border-radius:6px;box-sizing:border-box;overflow:hidden;cursor:grab;font-size:11px;color:#fff;
  display:flex;align-items:center;border:1px solid rgba(255,255,255,.14)}
.vs-trk[data-trk=text]{--tc:#6D5BD0}
.vs-trk[data-trk=logo]{--tc:#B0437E}
.vs-trk[data-trk=clip]{--tc:#2F5FB3}
.vs-trk[data-trk=music]{--tc:#1B7A50}
.vs-trk[data-trk=sfx]{--tc:#946A14}
.vs-trk-l::before{content:"";flex:none;width:4px;height:18px;border-radius:2px;background:var(--tc)}
.vs-it{background-color:var(--tc)}
.vs-it[data-kind=clip]{height:46px;background:var(--tc) left center/auto 100% repeat-x;box-shadow:inset 0 4px 0 var(--tc)}
.vs-it[data-kind=audio]{height:36px}
.vs-it[data-on]{outline:2px solid #fff;outline-offset:-2px;z-index:2}
:root[data-theme=light] .vs-it[data-on]{outline-color:#0A0B0D}
.vs-it .n{position:relative;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:1}
.vs-it canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.vs-hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
.vs-hd.l{left:0}.vs-hd.r{right:0}
.vs-it:hover .vs-hd,.vs-it[data-on] .vs-hd{background:rgba(255,255,255,.45)}
.vs-mk{position:absolute;top:18px;bottom:0;width:0;border-left:1px dashed var(--ps-brand);opacity:.55;pointer-events:none;z-index:3}
.vs-mk::before{content:"";position:absolute;top:-7px;left:-4.5px;width:8px;height:8px;background:var(--ps-brand);transform:rotate(45deg);border-radius:1px}
.vs-ph{position:absolute;top:0;bottom:0;width:13px;margin-left:-6px;z-index:4;cursor:ew-resize}
.vs-ph::after{content:"";position:absolute;top:0;bottom:0;left:6px;border-left:1.5px solid var(--ps-brand)}
.vs-ph::before{content:"";position:absolute;top:0;left:0;width:13px;height:13px;background:var(--ps-brand);border-radius:2px 2px 6px 6px}

/* drag guides: shown over the canvas only while a graphic is being moved */
.vs-guide{position:absolute;pointer-events:none;display:none;overflow:hidden;border-radius:6px}
.vs-guide[data-on]{display:block}
.vs-guide i{position:absolute;box-sizing:border-box;display:block}
.vs-g-band{background:rgba(240,60,60,.13)}
.vs-g-safe{border:1px dashed rgba(255,255,255,.85)}
.vs-g-safe b{position:absolute;left:6px;top:4px;font:500 9px/1 var(--ps-font);letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.vs-g-ui{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.14)}
.vs-g-ui.cta{background:rgba(255,255,255,.24)}
.vs-g-ui.nav{background:rgba(0,0,0,.5);border-width:1px 0 0}
.vs-g-cx,.vs-g-cy{background:rgba(255,255,255,.28)}
.vs-g-cx{left:50%;top:0;bottom:0;width:1px;margin-left:-.5px}
.vs-g-cy{top:50%;left:0;right:0;height:1px;margin-top:-.5px}
.vs-g-cx[data-on],.vs-g-cy[data-on]{background:#F3793C;box-shadow:0 0 0 .5px #F3793C}

/* placement preview: the kit's rules come from video-preview.css; these are the page's own */
.mk-ov[hidden]{display:none}
.mk-bar .vs-i{width:16px;height:16px}
.mk-shot{background:#000}
/* brass highlight button: it carries the ink it sets */
.vs-hi{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--ps-ink-2);font:inherit;font-size:11px;cursor:pointer;padding:2px 6px;margin:-2px -6px;border-radius:var(--ps-pill)}
.vs-hi:hover{background:var(--ps-fill);color:var(--ps-ink)}
.vs-hi i{width:9px;height:9px;border-radius:50%;background:#B0905C}
/* camera moves */
.vs-mvs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vs-mv{height:34px;border:1px solid var(--ps-hair);border-radius:var(--ps-r-sm);background:transparent;color:var(--ps-ink-2);font-size:12px;cursor:pointer;padding:0 8px}
.vs-mv:hover:not(:disabled){background:var(--ps-fill);border-color:var(--ps-focus);color:var(--ps-ink)}
.vs-mv[data-on]{background:var(--ps-fill-on);border-color:var(--ps-focus);box-shadow:0 0 0 1px var(--ps-focus);color:var(--ps-ink)}
.vs-mv:disabled,.vs-seg button:disabled{opacity:.45;cursor:default}
.vs-note b{font-weight:500;color:var(--ps-ink-2)}
/* export overlay + toast */
.vs-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center}
.vs-ov[data-on]{display:flex}
.vs-dlg{width:360px;background:var(--ps-card);border:1px solid var(--ps-line);border-radius:var(--ps-r-tile);padding:22px;display:flex;flex-direction:column;gap:14px}
.vs-dlg b{font-weight:400;font-size:16px}
.vs-prog{height:6px;border-radius:var(--ps-pill);background:var(--ps-fill);overflow:hidden}
.vs-prog i{display:block;height:100%;width:0;background:var(--ps-link)}
.vs-toast{position:fixed;left:50%;bottom:284px;transform:translateX(-50%);background:var(--ps-card);border:1px solid var(--ps-line);color:var(--ps-ink);
  padding:10px 16px;border-radius:var(--ps-pill);font-size:12px;z-index:60;display:none;max-width:70vw}
.vs-toast[data-on]{display:block}
@media (max-width:1100px){.vs-main{grid-template-columns:250px minmax(0,1fr) 250px}}
</style>
</head>

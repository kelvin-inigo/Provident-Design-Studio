<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Save to Google Drive</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<script>try { var t = localStorage.getItem('provident-theme'); document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); } catch (e) {}</script>
<link rel="stylesheet" href="ui-design-system/provident-ui.css">
<script src="studio-base.js"></script>
<style>
  /* THE VIDEO STUDIO'S SAVE WINDOW (2026-11-26). CASV runs on the designer's own computer
     (localhost), where Google refuses a sign-in, so its Save and Open from an ad set open this
     page: it holds the Google sign-in, reads the project and its media from CASV's working folder
     on that computer (/api/work/...) and writes them into the ad set's Drive folder:
       <ad set folder>/Video/<name>.casv          the project
       <ad set folder>/Video/Assets/               one file per media item, named by its role; every save overwrites them
     Opened as casv-save.html#save.8794 (save | pick | open, then CASV's port). */
  body{margin:0;background:var(--ps-app);color:var(--ps-ink);font:400 15px/1.5 'Google Sans Flex',system-ui,sans-serif}
  .cs{display:flex;flex-direction:column;gap:16px;min-height:100vh;box-sizing:border-box;padding:24px 20px}
  h1{margin:0;font:400 24px/1.2 'Google Sans Flex',system-ui,sans-serif;letter-spacing:-.01em}
  .cs-sub{margin:4px 0 0;color:var(--ps-ink-2);font-size:14px}
  .cs-st{margin:0;min-height:22px;color:var(--ps-ink-2);font-size:14px}
  .cs-st[data-bad]{color:var(--ps-bad)}
  .cs-bar{height:6px;border-radius:9999px;background:var(--ps-fill);overflow:hidden}
  .cs-bar i{display:block;height:100%;width:0;background:var(--ps-ink);transition:width .2s}
  .cs-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:0}
  .cs-list button{display:flex;align-items:baseline;gap:10px;width:100%;min-height:44px;padding:8px 14px;border:none;border-radius:12px;background:none;box-shadow:inset 0 0 0 1px var(--ps-line);color:var(--ps-ink);font:400 15px/1.3 'Google Sans Flex',system-ui,sans-serif;text-align:left;cursor:pointer}
  .cs-list button:hover{background:var(--ps-fill-h)}
  .cs-list button:focus-visible{outline:2px solid var(--ps-ink);outline-offset:2px}
  .cs-list s{margin-left:auto;text-decoration:none;color:var(--ps-ink-2);font-size:13px;white-space:nowrap}
  .cs-files{margin:0;padding:0;list-style:none;font-size:13px;color:var(--ps-ink-2);overflow:auto;flex:1;min-height:0}
  .cs-files li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--ps-hair)}
  .cs-files b{font-weight:400;color:var(--ps-ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cs-files s{margin-left:auto;text-decoration:none;white-space:nowrap}
  .cs-acts{display:flex;gap:8px;flex-wrap:wrap}
  a{color:var(--ps-link)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="cs">
  <div><h1 id="h">Save to Google Drive</h1><p class="cs-sub" id="sub"></p></div>
  <label id="findL" hidden><input class="p-in" id="find" placeholder="Find an ad set" autocomplete="off" aria-label="Find an ad set" style="width:100%;box-sizing:border-box"></label>
  <ul class="cs-list" id="list" hidden></ul>
  <div class="cs-bar" id="bar" hidden><i></i></div>
  <p class="cs-st" id="st" role="status" aria-live="polite"></p>
  <ul class="cs-files" id="files" hidden></ul>
  <div class="cs-acts" id="acts"></div>
</main>
<script>
(function () {
  'use strict';
  var m = /^#(save|pick|open)\.(\d{2,5})$/.exec(location.hash), D = window.providentDrive;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var st = function (t, bad) { var p = $('st'); p.textContent = t || ''; if (bad) p.dataset.bad = '1'; else delete p.dataset.bad; };
  var acts = function (html) { $('acts').innerHTML = html || ''; };
  var bar = function (f) { $('bar').hidden = f == null; if (f != null) $('bar').firstChild.style.width = Math.round(Math.max(0, Math.min(1, f)) * 100) + '%'; };
  var mb = function (n) { return n >= 1048576 ? (Math.round(n / 104857.6) / 10) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; };
  if (!m) { $('h').textContent = 'Video Studio'; st('Open this from the Video Studio: press Save, or File › Open from an ad set.'); return; }
  var MODE = m[1], AT = 'http://localhost:' + m[2], OPEN = MODE === 'open';
  $('h').textContent = OPEN ? 'Open from an ad set' : 'Save to Google Drive';
  document.title = $('h').textContent;

  // ── Google Drive, with the studios' own sign-in (studio-base.js) ──
  var FOLDER = 'application/vnd.google-apps.folder', ALL = '&supportsAllDrives=true', F = 'id,name,mimeType,size,parents,modifiedTime';
  // the campaigns folder every ad set lives under: the same one Status reads (share-link.js DS_HOME)
  var HOME = (function () { var v = ''; try { v = localStorage.getItem('provident-status-root') || ''; } catch (e) {} return D.id(v) || '1Xj6QMTlEAuOkcafWWFW4rECpe8Ja6s69'; })();
  var q1 = function (s) { return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'"; };
  var gd = function (path, opt) { return D.fetch(D.base() + path, opt); };
  async function query(q) {
    var out = [], tok = '';
    do {
      var d = await (await gd('/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=nextPageToken,files(' + F + ')&pageSize=1000&includeItemsFromAllDrives=true&corpora=allDrives' + ALL + (tok ? '&pageToken=' + tok : ''))).json();
      out.push.apply(out, d.files || []); tok = d.nextPageToken || '';
    } while (tok);
    return out;
  }
  var list = function (parent) { return query(q1(parent) + ' in parents and trashed=false'); };
  async function folder(parent, name, make) {
    var f = (await list(parent)).find(function (x) { return x.mimeType === FOLDER && x.name === name; });
    if (f || !make) return f ? f.id : '';
    return (await (await gd('/drive/v3/files?fields=' + F + ALL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, mimeType: FOLDER, parents: [parent] }) })).json()).id;
  }
  // a file's bytes: made empty first, then filled, so a large video is one plain upload
  async function put(parent, name, blob, have) {
    var id = have && have.id;
    if (!id) id = (await (await gd('/drive/v3/files?fields=' + F + ALL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, parents: [parent] }) })).json()).id;
    await gd('/upload/drive/v3/files/' + id + '?uploadType=media&fields=' + F + ALL, { method: 'PATCH', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
    return id;
  }
  var get = async function (id) { return (await gd('/drive/v3/files/' + id + '?alt=media' + ALL)).blob(); };
  // every ad set under the campaigns folder: its record is <name>_Adset.json in the campaign's folder
  async function findSets() {
    var found = [], level = [HOME];
    for (var depth = 0; depth < 2 && level.length; depth++) {
      var next = [];
      for (var i = 0; i < level.length; i += 30) {
        var par = level.slice(i, i + 30).map(function (id) { return q1(id) + ' in parents'; }).join(' or ');
        (await query('(' + par + ') and trashed=false and (mimeType=' + q1(FOLDER) + " or name contains '_Adset.json')")).forEach(function (f) {
          if (f.mimeType === FOLDER) { if (depth === 0) next.push(f.id); }
          else if (/_Adset\.json$/.test(f.name) && f.parents && f.parents[0]) found.push({ name: f.name.replace(/_Adset\.json$/, ''), folder: f.parents[0], at: f.modifiedTime || '' });
        });
      }
      level = next;
    }
    return found.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
  }
  var safe = function (t) { return String(t || 'Video').replace(/[\\/:*?"<>|#%]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Video'; };

  // ── the Video Studio on this computer ──
  var work = async function (path, opt) {
    var r;
    try { r = await fetch(AT + path, opt); } catch (e) { throw new Error('The Video Studio on this computer did not answer. Keep it open, then try again.'); }
    if (!r.ok) throw new Error('The Video Studio on this computer answered ' + r.status + '. Restart it, then try again.');
    return r;
  };
  var tell = function (msg) { try { if (window.opener) window.opener.postMessage(Object.assign({ casv: 1 }, msg), AT); } catch (e) {} };
  // CASV writes everything to its working folder before this page reads it: `ready`, then wait for `go`
  var settled = function () {
    return new Promise(function (res) {
      if (!window.opener) return res();
      var t = setTimeout(res, 20000);
      window.addEventListener('message', function on(e) { if (e.origin === AT && e.data && e.data.casv === 1 && e.data.what === 'go') { clearTimeout(t); window.removeEventListener('message', on); res(); } });
      tell({ what: 'ready' });
    });
  };

  // ── choosing an ad set ──
  function choose(sets, sub) {
    return new Promise(function (res) {
      $('sub').textContent = sub; $('findL').hidden = sets.length < 8; $('list').hidden = false; st(sets.length ? '' : 'No ad set was found in the campaigns folder.');
      var draw = function () {
        var k = $('find').value.trim().toLowerCase();
        $('list').innerHTML = sets.map(function (s, i) { return k && s.name.toLowerCase().indexOf(k) < 0 ? '' : '<li><button type="button" data-i="' + i + '"><span>' + esc(s.name) + '</span><s>' + esc(s.note || '') + '</s></button></li>'; }).join('');
      };
      draw(); $('find').oninput = draw;
      $('list').onclick = function (e) { var b = e.target.closest('button[data-i]'); if (!b) return; $('list').hidden = true; $('findL').hidden = true; $('list').onclick = null; res(sets[+b.dataset.i]); };
    });
  }

  // ── what a media file is called in the Assets folder: its role on the timeline, then a number ──
  var EXT = { 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm', 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/svg+xml': 'svg', 'image/gif': 'gif',
    'audio/mpeg': 'mp3', 'audio/mp3': 'mp3', 'audio/wav': 'wav', 'audio/x-wav': 'wav', 'audio/wave': 'wav', 'audio/mp4': 'm4a', 'audio/x-m4a': 'm4a', 'audio/aac': 'aac', 'audio/ogg': 'ogg', 'audio/webm': 'webm' };
  function extOf(md) {
    var t = String(md.type || '').split(';')[0].trim().toLowerCase(), e = EXT[t], n = /\.([a-z0-9]{2,5})$/i.exec(md.name || '');
    return e || (n ? n[1].toLowerCase() : (md.kind === 'video' ? 'mp4' : md.kind === 'audio' ? 'mp3' : 'jpg'));
  }
  function roleOf(md, P) {
    var has = function (l) { return (l || []).some(function (x) { return x && x.mid === md.id; }); };
    if (has(P.clips)) return md.kind === 'image' ? 'photo' : 'video';
    var a = (P.audio || []).find(function (x) { return x && x.mid === md.id; });
    if (a) return a.track === 'music' ? 'music' : /voice/i.test(md.name || '') ? 'voiceover' : 'sound';
    if (has(P.logos)) return 'graphic';
    return md.kind === 'audio' ? 'sound' : md.kind === 'video' ? 'video' : md.kind === 'logo' ? 'graphic' : 'photo';
  }
  function nameAll(used, P) {
    var names = {}, taken = {}, old = (P.drive && P.drive.names) || {};
    // in the order they appear on the timeline; a file keeps the name an earlier save gave it
    var order = {}; [P.clips, P.audio, P.logos].forEach(function (l) { (l || []).forEach(function (x) { if (x && x.mid && order[x.mid] == null) order[x.mid] = Object.keys(order).length; }); });
    used.sort(function (a, b) { return (order[a.id] == null ? 1e6 : order[a.id]) - (order[b.id] == null ? 1e6 : order[b.id]); });
    used.forEach(function (md) { var o = old[md.id], want = roleOf(md, P) + '-'; if (o && o.indexOf(want) === 0 && o.split('.').pop() === extOf(md) && !taken[o]) { names[md.id] = o; taken[o] = 1; } });
    used.forEach(function (md) {
      if (names[md.id]) return;
      var role = roleOf(md, P), ext = extOf(md), n = 1, nm;
      var busy = function (stem) { return Object.keys(taken).some(function (k) { return k.split('.')[0] === stem; }); };
      do { nm = role + '-' + (n < 10 ? '0' : '') + n; n++; } while (busy(nm));
      names[md.id] = nm + '.' + ext; taken[names[md.id]] = 1;
    });
    return names;
  }
  // CASV's one-file project: 'CASV', the length of its JSON, the JSON, then each media file
  function pack(head, blobs) {
    var h = new TextEncoder().encode(JSON.stringify(head)), pre = new DataView(new ArrayBuffer(8));
    pre.setUint32(0, 0x43415356); pre.setUint32(4, h.length);
    return new Blob([pre.buffer, h].concat(blobs || []), { type: 'application/octet-stream' });
  }
  async function unpackHead(blob) {
    var pre = new DataView(await blob.slice(0, 8).arrayBuffer());
    if (blob.size < 8 || pre.getUint32(0) !== 0x43415356) throw new Error('That file is not a Video Studio project.');
    var n = pre.getUint32(4);
    return { head: JSON.parse(await blob.slice(8, 8 + n).text()), rest: blob.slice(8 + n) };
  }

  async function signedIn() {
    if (await D.ensure()) return;
    await new Promise(function (res) {
      st('Sign in with the Google account that can open the ad set’s Drive folder.');
      acts('<button type="button" class="p-btn" id="in">Sign in with Google</button>');
      $('in').onclick = async function () { try { await D.signIn(); acts(''); res(); } catch (e) { st(e.message || String(e), true); } };
    });
  }

  async function save() {
    st('Reading the video from this computer…');
    await settled();
    var state = (await (await work('/api/work/state')).json()).state || {}, P = JSON.parse(state.project || 'null');
    if (!P || P.v !== 1) throw new Error('There is no video open in the Video Studio.');
    var name = safe(P.name || (P.cas && P.cas.title)), text = JSON.stringify(P);
    var used = ((await (await work('/api/work/list')).json()).media || []).filter(function (md) { return text.indexOf('"' + md.id + '"') >= 0; });
    await signedIn();
    var set = MODE === 'save' && P.drive && P.drive.set && P.drive.set.folder ? P.drive.set : null;
    if (!set) { st('Finding the ad sets…'); set = await choose(await findSets(), 'Choose the ad set “' + name + '” belongs to. It is remembered for this video.'); }
    $('sub').textContent = set.name + ' › Video › ' + name;
    st('Opening the ad set’s Video folder…'); bar(0);
    var video = await folder(set.folder, 'Video', true), assets = await folder(video, 'Assets', true);
    var there = await list(assets), names = nameAll(used, P), total = used.reduce(function (n, md) { return n + (md.size || 0); }, 0) || 1, done = 0, sent = 0, rows = [];
    for (var i = 0; i < used.length; i++) {
      var md = used[i], nm = names[md.id], have = there.find(function (f) { return f.name === nm && f.mimeType !== FOLDER; });
      // every save writes every file again: what is on Drive is always what the video uses now
      {
        st('Uploading ' + (i + 1) + ' of ' + used.length + ' · ' + nm + ' (' + mb(md.size || 0) + ')');
        var b = await (await work('/api/work/media?id=' + md.id)).blob();
        md.fid = await put(assets, nm, new Blob([b], { type: String(md.type || b.type || '').split(';')[0] || 'application/octet-stream' }), have);
        sent++; rows.push([nm, (have ? 'replaced · ' : '') + mb(md.size || 0)]);
      }
      done += md.size || 0; bar(done / total * .95);
    }
    st('Saving the project…');
    var logos = []; try { logos = JSON.parse(state.logos || '[]'); } catch (e) {}
    var at = Date.now(), proj = Object.assign({}, P, { drive: { set: { name: set.name, folder: set.folder }, names: names, at: at, sig: 'open' } });
    var head = { casv: 1, at: at, project: proj, logos: logos, media: [],
      assets: used.map(function (md) { var o = Object.assign({}, md, { file: names[md.id] }); return o; }) };
    var file = name + '.casv', was = (await list(video)).find(function (f) { return f.name === file && f.mimeType !== FOLDER; });
    await put(video, file, pack(head), was);
    bar(1);
    var ans = { what: 'saved', set: { name: set.name, folder: set.folder }, names: names, at: at };
    // told twice: straight to the Video Studio's window, and left in its working folder in case
    // the browser cut the two windows apart
    try { await work('/api/work/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'drive', value: JSON.stringify(ans) }) }); } catch (e) {}
    tell(ans);
    $('files').hidden = false;
    $('files').innerHTML = [[file, 'project']].concat(rows).map(function (r) { return '<li><b>' + esc(r[0]) + '</b><s>' + esc(r[1]) + '</s></li>'; }).join('');
    st('Saved. ' + sent + (sent === 1 ? ' file' : ' files') + ' written to Video › Assets.');
    acts('<a class="p-ghost" href="https://drive.google.com/drive/folders/' + encodeURIComponent(video) + '" target="_blank" rel="noopener">Open the folder in Google Drive</a><button type="button" class="p-btn" id="x">Close</button>');
    $('x').onclick = function () { window.close(); };
  }

  async function open() {
    await signedIn();
    st('Finding the ad sets…');
    var set = await choose(await findSets(), 'Choose the ad set the video was saved in.');
    st('Looking in ' + set.name + ' › Video…');
    var video = await folder(set.folder, 'Video', false), all = video ? await list(video) : [];
    var vids = all.filter(function (f) { return /\.casv$/i.test(f.name) && f.mimeType !== FOLDER; }).map(function (f) { return { name: f.name.replace(/\.casv$/i, ''), id: f.id, note: (f.modifiedTime || '').slice(0, 10) }; });
    if (!vids.length) throw new Error('No video has been saved in ' + set.name + ' yet.');
    var pick = vids.length === 1 ? vids[0] : await choose(vids, 'Choose the video to open on this computer.');
    $('sub').textContent = set.name + ' › Video › ' + pick.name;
    st('Downloading the project…'); bar(0);
    var blob = await get(pick.id), u = await unpackHead(blob), head = u.head, out = blob;
    if (!head.project || head.project.v !== 1) throw new Error('That file is not a Video Studio project.');
    if (head.assets && head.assets.length) {
      // a project saved from the Save button: its media is in the Assets folder, one file each
      var dir = (await folder(video, 'Assets', false)) || (await folder(video, pick.name + ' Assets', false)), there = dir ? await list(dir) : [], blobs = [], total = head.assets.reduce(function (n, a) { return n + (a.size || 0); }, 0) || 1, done = 0;
      for (var i = 0; i < head.assets.length; i++) {
        var a = head.assets[i], f = there.find(function (x) { return x.name === a.file; });
        if (!f) throw new Error('“' + a.file + '” is missing from the video’s Assets folder on Drive.');
        st('Downloading ' + (i + 1) + ' of ' + head.assets.length + ' · ' + a.file + ' (' + mb(a.size || 0) + ')');
        var b = await get(f.id); blobs.push(b); a.size = b.size; done += b.size; bar(done / total * .9);
      }
      head.project.drive = Object.assign({}, head.project.drive, { set: { name: set.name, folder: set.folder }, sig: 'open' });
      head.media = head.assets.map(function (a) { var o = Object.assign({}, a); delete o.file; delete o.fid; return o; });
      delete head.assets;
      out = pack(head, blobs);
    }
    st('Handing it to the Video Studio…');
    var id = Math.random().toString(36).slice(2, 12);
    await work('/api/outbox/back?id=' + id + '&title=' + encodeURIComponent(pick.name), { method: 'PUT', body: out });
    bar(1); tell({ what: 'opened' });
    st('Ready. The Video Studio asks before it opens “' + pick.name + '”.');
    acts('<button type="button" class="p-btn" id="x">Close</button>'); $('x').onclick = function () { window.close(); };
  }

  (OPEN ? open() : save()).catch(function (e) {
    bar(null); st((e && e.message) || String(e), true);
    acts('<button type="button" class="p-btn" id="again">Try again</button>'); $('again').onclick = function () { location.reload(); };
  });
})();
</script>
</body>
</html>
